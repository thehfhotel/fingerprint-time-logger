<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thai Name Management - Employee Time Logger</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding: 1rem 2rem;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .title {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .title h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #2d3748;
        }
        
        .nav-buttons {
            display: flex;
            gap: 1rem;
        }
        
        .nav-btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 8px;
            background: #4299e1;
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
        }
        
        .nav-btn:hover {
            background: #3182ce;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(66, 153, 225, 0.3);
        }
        
        .container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
        }
        
        .management-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
        }
        
        .card-header {
            padding: 2rem;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            background: linear-gradient(135deg, #f7fafc 0%, #edf2f7 100%);
        }
        
        .card-header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        
        .card-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #2d3748;
        }
        
        .card-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        
        .search-box {
            padding: 0.5rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 0.9rem;
            width: 250px;
            transition: border-color 0.2s;
        }
        
        .search-box:focus {
            outline: none;
            border-color: #4299e1;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.1);
        }
        
        .action-btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }
        
        .primary-btn {
            background: #48bb78;
            color: white;
        }
        
        .primary-btn:hover:not(:disabled) {
            background: #38a169;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(72, 187, 120, 0.3);
        }
        
        .secondary-btn {
            background: #4299e1;
            color: white;
        }
        
        .secondary-btn:hover:not(:disabled) {
            background: #3182ce;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(66, 153, 225, 0.3);
        }
        
        .action-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .hidden-toggle-btn {
            background: #f7fafc;
            color: #4a5568;
            border: 1px solid #e2e8f0;
        }
        
        .hidden-toggle-btn:hover {
            background: #edf2f7;
            border-color: #cbd5e0;
        }
        
        .hidden-toggle-btn.active {
            background: #5a67d8;
            color: white;
            border-color: #5a67d8;
        }
        
        .hide-btn {
            background: transparent;
            border: 1px solid #e53e3e;
            color: #e53e3e;
            padding: 0.3rem 0.8rem;
            border-radius: 4px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .hide-btn:hover {
            background: #e53e3e;
            color: white;
        }
        
        .hide-btn.hidden {
            background: #e53e3e;
            color: white;
        }
        
        .employee-row.hidden {
            opacity: 0.5;
        }
        
        .card-body {
            padding: 0;
        }
        
        .thai-names-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .thai-names-table th,
        .thai-names-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .thai-names-table th {
            background: #f7fafc;
            font-weight: 600;
            color: #4a5568;
            position: sticky;
            top: 0;
            z-index: 1;
        }
        
        .thai-names-table tbody tr:hover {
            background: #f7fafc;
        }
        
        .thai-name-input {
            width: 100%;
            padding: 0.5rem;
            border: 2px solid transparent;
            border-radius: 6px;
            background: #f7fafc;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        
        .thai-name-input:focus {
            outline: none;
            border-color: #4299e1;
            background: white;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.1);
        }
        
        .thai-name-input.modified {
            border-color: #ed8936;
            background: #fffaf0;
        }
        
        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .status-active {
            background: #c6f6d5;
            color: #22543d;
        }
        
        .status-inactive {
            background: #fed7d7;
            color: #742a2a;
        }
        
        .loading {
            text-align: center;
            padding: 3rem;
            color: #718096;
        }
        
        .spinner {
            display: inline-block;
            width: 2rem;
            height: 2rem;
            border: 3px solid #e2e8f0;
            border-top: 3px solid #4299e1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error-message {
            background: #fed7d7;
            color: #742a2a;
            padding: 1rem;
            border-radius: 8px;
            margin: 1rem;
            text-align: center;
        }
        
        .success-message {
            background: #c6f6d5;
            color: #22543d;
            padding: 1rem;
            border-radius: 8px;
            margin: 1rem;
            text-align: center;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.9);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        
        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: #4299e1;
            margin-bottom: 0.5rem;
        }
        
        .stat-label {
            color: #718096;
            font-weight: 500;
        }
        
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 1rem;
            }
            
            .card-header-content {
                flex-direction: column;
                align-items: stretch;
            }
            
            .search-box {
                width: 100%;
            }
            
            .thai-names-table {
                font-size: 0.8rem;
            }
            
            .thai-names-table th,
            .thai-names-table td {
                padding: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <div class="title">
                <h1>📝 Thai Name Management</h1>
            </div>
            <div class="nav-buttons">
                <a href="/" class="nav-btn">🏠 Dashboard</a>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- Statistics -->
        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalEmployees">0</div>
                <div class="stat-label">Total Employees</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="modifiedCount">0</div>
                <div class="stat-label">Modified Names</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="lastUpdated">Never</div>
                <div class="stat-label">Last Updated</div>
            </div>
        </div>

        <!-- Management Card -->
        <div class="management-card">
            <div class="card-header">
                <div class="card-header-content">
                    <h2 class="card-title">Employee Thai Names</h2>
                    <div class="card-actions">
                        <input type="text" id="searchBox" class="search-box" placeholder="🔍 Search badge number or Thai name...">
                        <button id="showHiddenBtn" class="action-btn hidden-toggle-btn">👁️ Show Hidden</button>
                        <button id="saveAllBtn" class="action-btn primary-btn" disabled>💾 Save All Changes</button>
                        <button id="resetBtn" class="action-btn secondary-btn">↻ Reset Changes</button>
                    </div>
                </div>
            </div>
            <div class="card-body">
                <div id="loadingIndicator" class="loading">
                    <div class="spinner"></div>
                    <div>Loading Thai names...</div>
                </div>
                
                <div id="errorMessage" class="error-message" style="display: none;"></div>
                <div id="successMessage" class="success-message" style="display: none;"></div>
                
                <table class="thai-names-table" id="thaiNamesTable" style="display: none;">
                    <thead>
                        <tr>
                            <th>Badge Number</th>
                            <th>Thai Name</th>
                            <th>Status</th>
                            <th>Last Updated</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="thaiNamesTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Global state
        let thaiNames = [];
        let originalThaiNames = {};
        let modifiedNames = new Set();
        let showHidden = false;

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadThaiNames();
            setupEventListeners();
        });

        function setupEventListeners() {
            // Search functionality
            document.getElementById('searchBox').addEventListener('input', handleSearch);
            
            // Save all changes
            document.getElementById('saveAllBtn').addEventListener('click', saveAllChanges);
            
            // Reset changes
            document.getElementById('resetBtn').addEventListener('click', resetAllChanges);
            
            // Show/hide hidden employees
            document.getElementById('showHiddenBtn').addEventListener('click', toggleShowHidden);
            
            // Sync functionality moved to main dashboard
        }

        async function loadThaiNames() {
            try {
                showLoading();
                const url = showHidden ? '/api/thai-names/?show_hidden=true' : '/api/thai-names/';
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                thaiNames = await response.json();
                originalThaiNames = {};
                
                // Store original values
                thaiNames.forEach(item => {
                    originalThaiNames[item.badge_number] = {
                        thai_name: item.thai_name,
                        is_hidden: item.is_hidden
                    };
                });
                
                renderTable();
                updateStats();
                hideLoading();
                
            } catch (error) {
                console.error('Error loading Thai names:', error);
                showError(`Failed to load Thai names: ${error.message}`);
                hideLoading();
            }
        }

        function renderTable(filteredData = null) {
            const data = filteredData || thaiNames;
            const tbody = document.getElementById('thaiNamesTableBody');
            
            tbody.innerHTML = '';
            
            if (data.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" style="text-align: center; padding: 3rem; color: #718096;">
                            No Thai names found. Use "Import Fingerprint Log" on the dashboard to discover badge numbers from attendance records.
                        </td>
                    </tr>
                `;
            } else {
                data.forEach(item => {
                    const row = createTableRow(item);
                    tbody.appendChild(row);
                });
            }
            
            document.getElementById('thaiNamesTable').style.display = 'table';
        }

        function createTableRow(item) {
            const row = document.createElement('tr');
            row.className = item.is_hidden ? 'employee-row hidden' : 'employee-row';
            row.dataset.badge = item.badge_number;
            
            const isModified = modifiedNames.has(item.badge_number);
            const modifiedClass = isModified ? 'modified' : '';
            
            row.innerHTML = `
                <td style="font-weight: 600; color: #2d3748;">${item.badge_number}</td>
                <td>
                    <input 
                        type="text" 
                        class="thai-name-input ${modifiedClass}"
                        value="${item.thai_name}"
                        data-badge="${item.badge_number}"
                        data-original="${originalThaiNames[item.badge_number]?.thai_name || item.thai_name}"
                    >
                </td>
                <td>
                    <span class="status-badge ${item.is_active ? 'status-active' : 'status-inactive'}">
                        ${item.is_active ? 'Active' : 'Inactive'}
                    </span>
                </td>
                <td style="color: #718096; font-size: 0.85rem;">
                    ${formatDate(item.updated_at)}
                </td>
                <td>
                    <button type="button" class="hide-btn ${item.is_hidden ? 'hidden' : ''}" 
                            onclick="toggleHideEmployee('${item.badge_number}')">
                        ${item.is_hidden ? 'Unhide' : 'Hide'}
                    </button>
                </td>
            `;
            
            // Add event listener for input changes
            const input = row.querySelector('.thai-name-input');
            input.addEventListener('input', handleThaiNameChange);
            
            return row;
        }

        function handleThaiNameChange(event) {
            const input = event.target;
            const badgeNumber = input.dataset.badge;
            const originalValue = originalThaiNames[badgeNumber]?.thai_name || input.dataset.original;
            const currentValue = input.value.trim();
            
            if (currentValue !== originalValue) {
                modifiedNames.add(badgeNumber);
                input.classList.add('modified');
            } else {
                modifiedNames.delete(badgeNumber);
                input.classList.remove('modified');
            }
            
            updateModifiedIndicators();
        }

        function updateModifiedIndicators() {
            const saveBtn = document.getElementById('saveAllBtn');
            const modifiedCount = modifiedNames.size;
            
            saveBtn.disabled = modifiedCount === 0;
            saveBtn.textContent = modifiedCount > 0 
                ? `💾 Save ${modifiedCount} Change${modifiedCount !== 1 ? 's' : ''}`
                : '💾 Save All Changes';
            
            document.getElementById('modifiedCount').textContent = modifiedCount;
        }

        function handleSearch(event) {
            const searchTerm = event.target.value.toLowerCase();
            
            if (!searchTerm) {
                renderTable();
                return;
            }
            
            const filteredData = thaiNames.filter(item => 
                item.badge_number.toLowerCase().includes(searchTerm) ||
                item.thai_name.toLowerCase().includes(searchTerm)
            );
            
            renderTable(filteredData);
        }

        async function saveAllChanges() {
            if (modifiedNames.size === 0) return;
            
            const saveBtn = document.getElementById('saveAllBtn');
            
            try {
                saveBtn.disabled = true;
                saveBtn.textContent = '💾 Saving...';
                
                // Collect all modified names
                const updates = [];
                modifiedNames.forEach(badgeNumber => {
                    const input = document.querySelector(`input[data-badge="${badgeNumber}"]`);
                    if (input) {
                        updates.push({
                            badge_number: badgeNumber,
                            thai_name: input.value.trim()
                        });
                    }
                });
                
                const response = await fetch('/api/thai-names/', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ updates })
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || 'Save failed');
                }
                
                const result = await response.json();
                showSuccess(`Successfully saved ${result.updated_count} Thai names!`);
                
                // Clear modified state
                modifiedNames.clear();
                
                // Reload data
                await loadThaiNames();
                
            } catch (error) {
                console.error('Error saving changes:', error);
                showError(`Failed to save changes: ${error.message}`);
            } finally {
                // Always reset button state regardless of success/failure (FIXED)
                updateModifiedIndicators();
            }
        }

        function resetAllChanges() {
            // Reset all inputs to original values
            document.querySelectorAll('.thai-name-input').forEach(input => {
                input.value = input.dataset.original;
                input.classList.remove('modified');
            });
            
            modifiedNames.clear();
            updateModifiedIndicators();
            hideMessages();
        }

        // Sync functionality moved to main dashboard import button

        function updateStats() {
            document.getElementById('totalEmployees').textContent = thaiNames.length;
            
            // Find most recent update
            let lastUpdated = 'Never';
            if (thaiNames.length > 0) {
                const latest = thaiNames.reduce((latest, item) => {
                    const itemDate = new Date(item.updated_at);
                    const latestDate = new Date(latest.updated_at);
                    return itemDate > latestDate ? item : latest;
                });
                lastUpdated = formatDate(latest.updated_at);
            }
            
            document.getElementById('lastUpdated').textContent = lastUpdated;
        }

        function formatDate(dateString) {
            if (!dateString) return 'Never';
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function showLoading() {
            document.getElementById('loadingIndicator').style.display = 'block';
            document.getElementById('thaiNamesTable').style.display = 'none';
            hideMessages();
        }

        function hideLoading() {
            document.getElementById('loadingIndicator').style.display = 'none';
        }

        function showError(message) {
            const errorElement = document.getElementById('errorMessage');
            errorElement.textContent = message;
            errorElement.style.display = 'block';
            hideSuccess();
        }

        function showSuccess(message) {
            const successElement = document.getElementById('successMessage');
            successElement.textContent = message;
            successElement.style.display = 'block';
            hideError();
            
            // Auto-hide after 5 seconds
            setTimeout(hideSuccess, 5000);
        }

        function hideError() {
            document.getElementById('errorMessage').style.display = 'none';
        }

        function hideSuccess() {
            document.getElementById('successMessage').style.display = 'none';
        }

        function hideMessages() {
            hideError();
            hideSuccess();
        }
        
        function toggleShowHidden() {
            showHidden = !showHidden;
            const btn = document.getElementById('showHiddenBtn');
            if (showHidden) {
                btn.classList.add('active');
                btn.textContent = '👁️ Hide Hidden';
            } else {
                btn.classList.remove('active');
                btn.textContent = '👁️ Show Hidden';
            }
            loadThaiNames();
        }
        
        async function toggleHideEmployee(badgeNumber) {
            try {
                const employee = thaiNames.find(e => e.badge_number === badgeNumber);
                if (!employee) return;
                
                const newHiddenStatus = !employee.is_hidden;
                
                const response = await fetch(`/api/thai-names/${badgeNumber}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        is_hidden: newHiddenStatus
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`Failed to update hidden status: ${response.statusText}`);
                }
                
                // Update local data
                employee.is_hidden = newHiddenStatus;
                
                // Update UI
                const row = document.querySelector(`tr[data-badge="${badgeNumber}"]`);
                const hideBtn = row.querySelector('.hide-btn');
                
                if (newHiddenStatus) {
                    row.classList.add('hidden');
                    hideBtn.classList.add('hidden');
                    hideBtn.textContent = 'Unhide';
                } else {
                    row.classList.remove('hidden');
                    hideBtn.classList.remove('hidden');
                    hideBtn.textContent = 'Hide';
                }
                
                showSuccess(`Employee ${badgeNumber} ${newHiddenStatus ? 'hidden' : 'unhidden'} successfully`);
                
            } catch (error) {
                console.error('Error toggling hide status:', error);
                showError(`Failed to update hidden status: ${error.message}`);
            }
        }
    </script>
</body>
</html>
