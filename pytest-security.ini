[tool:pytest]
# Security Testing Configuration for Fingerprint Time Logger

# Test discovery
testpaths = tests/security
python_files = test_*.py
python_functions = test_*
python_classes = Test*

# Security-specific markers
markers =
    security: marks tests as security tests
    biometric: marks tests as biometric system specific
    websocket: marks tests as websocket security specific
    csv: marks tests as CSV injection specific
    api: marks tests as API security specific
    unicode: marks tests as Unicode/i18n security specific
    slow: marks tests as slow running (>10s)
    automated_tools: marks tests using automated security tools
    critical: marks tests for critical security vulnerabilities
    high: marks tests for high severity vulnerabilities
    medium: marks tests for medium severity vulnerabilities
    low: marks tests for low severity vulnerabilities

# Test execution options
addopts =
    --strict-markers
    --tb=short
    --maxfail=50
    --durations=10
    --verbose
    -ra

# Warning filters
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:httpx._client
    ignore::UserWarning:pyzk.*

# Test timeout (30 minutes for full security suite)
timeout = 1800

# Coverage settings for security tests
addopts =
    --cov=app
    --cov-report=html:security_reports/coverage_html
    --cov-report=json:security_reports/coverage.json
    --cov-fail-under=70
    --cov-branch

# Asyncio configuration
asyncio_mode = auto

# Security test specific environment
env =
    TESTING=true
    DATABASE_URL=sqlite:///./test_security.db
    LOG_LEVEL=WARNING
    SECURITY_TESTING=true

# Collect ignore patterns
collect_ignore = [
    "security_reports",
    "*.md",
    "conftest.py"
]

# Required plugins
required_plugins =
    pytest-asyncio
    pytest-cov
    pytest-env
    pytest-timeout