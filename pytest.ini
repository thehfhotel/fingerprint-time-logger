[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -n auto          # Parallel execution with auto worker detection (use -n 0 to disable)
    --dist=loadfile  # Distribute tests by file for optimal load balancing
    # --maxfail removed to allow all tests to run
markers =
    unit: marks tests as unit tests (fast, isolated)
    integration: marks tests as integration tests (database, services)
    e2e: marks tests as end-to-end tests (full application)
    performance: marks tests as performance tests (benchmarking)
    slow: marks tests as slow running (>5 seconds)
    parallel: marks tests safe for parallel execution
    serial: marks tests that must run sequentially
    workflow: marks tests as complete user workflow tests
    smoke: marks tests as quick smoke tests for basic functionality
    xdist_group: marks tests for pytest-xdist group distribution
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning