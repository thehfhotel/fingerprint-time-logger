<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>QR Check-in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Sarabun', 'Noto Sans Thai', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #06C755 0%, #00B900 100%);
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .spinner {
            border: 4px solid rgba(6, 199, 85, 0.2);
            border-radius: 50%;
            border-top: 4px solid #06C755;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 24px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 {
            color: #26221E;
            font-size: 24px;
            margin: 0 0 12px 0;
        }
        p {
            color: #5C554C;
            font-size: 16px;
            margin: 0;
            line-height: 1.6;
        }
        .status {
            margin-top: 20px;
            padding: 12px;
            background: #FAF9F7;
            border-radius: 8px;
            font-size: 14px;
            color: #7A7268;
        }
        .error {
            color: #C53030;
            background: #F7E2E2;
            padding: 16px;
            border-radius: 8px;
            margin-top: 20px;
        }
        .error-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: #06C755;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            border: none;
            cursor: pointer;
        }
        /* Check-in / Check-out chooser */
        .action-choice {
            display: none;
            margin-top: 8px;
        }
        .action-choice.visible { display: block; }
        .action-choice h2 {
            font-size: 20px;
            color: #26221E;
            margin: 0 0 16px 0;
        }
        .action-choice .hint {
            font-size: 14px;
            color: #7A7268;
            margin: 0 0 20px 0;
        }
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .action-btn {
            padding: 18px 20px;
            border: 2px solid transparent;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: transform .05s ease, box-shadow .15s ease;
        }
        .action-btn:active { transform: scale(0.98); }
        .action-btn.checkin {
            background: #06C755;
            color: white;
        }
        .action-btn.checkout {
            background: white;
            color: #C53030;
            border-color: #C53030;
        }
        .action-btn .icon { font-size: 24px; }
    </style>
</head>
<body>
    <div class="container">
        <div id="processingView">
            <div class="spinner"></div>
            <h1>🔍 กำลังประมวลผล QR Code...</h1>
            <p id="statusText">กรุณารอสักครู่</p>
            <div id="statusDetails" class="status"></div>
        </div>

        <div id="actionChoice" class="action-choice">
            <div style="font-size:48px; margin-bottom: 8px;">✅</div>
            <h2>เลือกการบันทึก</h2>
            <p class="hint">QR Code ถูกต้อง กรุณาเลือกเข้างานหรือออกงาน</p>
            <div class="action-buttons">
                <button id="btnCheckIn" class="action-btn checkin" type="button">
                    <span class="icon">📥</span>
                    <span>เข้างาน (Check-in)</span>
                </button>
                <button id="btnCheckOut" class="action-btn checkout" type="button">
                    <span class="icon">📤</span>
                    <span>ออกงาน (Check-out)</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const statusText = document.getElementById('statusText');
            const statusDetails = document.getElementById('statusDetails');
            const processingView = document.getElementById('processingView');
            const actionChoice = document.getElementById('actionChoice');
            const btnCheckIn = document.getElementById('btnCheckIn');
            const btnCheckOut = document.getElementById('btnCheckOut');

            // Get URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            const qrToken = urlParams.get('token');
            const terminalId = urlParams.get('terminal');

            // Check required parameters
            if (!qrToken || !terminalId) {
                showError('QR Code ไม่ถูกต้อง', 'กรุณาสแกน QR Code ใหม่อีกครั้ง');
                return;
            }

            // Cached JWT once auth is validated, then used by submitCheckIn().
            let validatedJwt = null;

            // Main processing flow: validate identity, then show the chooser.
            processQRScan();

            async function processQRScan() {
                try {
                    showProcessing();
                    updateStatus('🔐 ตรวจสอบสถานะการเข้าสู่ระบบ...');

                    // Check if user is authenticated (has JWT in localStorage)
                    const jwtToken = localStorage.getItem('line_jwt_token');

                    if (!jwtToken) {
                        // Not logged in → redirect to LINE OAuth with QR context in URL
                        updateStatus('📱 เปลี่ยนเส้นทางไปยัง LINE Login...');
                        await new Promise(resolve => setTimeout(resolve, 500));

                        // Store QR context in both sessionStorage (for same-browser) and URL (for cross-browser)
                        sessionStorage.setItem('qr_scan_context', JSON.stringify({
                            qrToken: qrToken,
                            terminalId: terminalId,
                            timestamp: Date.now()
                        }));

                        // Redirect to LINE OAuth with QR context in URL parameters
                        const qrContext = encodeURIComponent(JSON.stringify({
                            qrToken: qrToken,
                            terminalId: terminalId,
                            timestamp: Date.now()
                        }));
                        window.location.href = `/api/public/auth/line/login?redirect=qr-scan-callback&qr_context=${qrContext}`;
                        return;
                    }

                    // User has JWT → verify it's still valid
                    updateStatus('✅ ตรวจสอบ Token...');
                    const verifyResponse = await fetch('/api/public/auth/line/verify-token', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token: jwtToken })
                    });

                    if (!verifyResponse.ok) {
                        // Token expired or invalid → clear and retry
                        localStorage.removeItem('line_jwt_token');
                        updateStatus('🔄 Token หมดอายุ กำลังเข้าสู่ระบบใหม่...');
                        await new Promise(resolve => setTimeout(resolve, 500));
                        processQRScan(); // Retry without token
                        return;
                    }

                    const verifyData = await verifyResponse.json();

                    if (!verifyData.employee_badge) {
                        // Logged in but not linked → redirect to link account
                        updateStatus('🔗 ต้องเชื่อมต่อบัญชีก่อน...');
                        sessionStorage.setItem('qr_scan_context', JSON.stringify({
                            qrToken: qrToken,
                            terminalId: terminalId,
                            timestamp: Date.now()
                        }));
                        await new Promise(resolve => setTimeout(resolve, 500));
                        window.location.href = '/qr-checkin/link-account?redirect=qr-scan-callback';
                        return;
                    }

                    // Identity ok → ask user whether this is a check-in or check-out.
                    validatedJwt = jwtToken;
                    showActionChoice();

                } catch (error) {
                    console.error('[QR Scan] Error:', error);
                    showError('เกิดข้อผิดพลาด', error.message || 'กรุณาลองใหม่อีกครั้ง');
                }
            }

            // Bind chooser buttons. Disable both while one is in flight to
            // prevent a double-submit creating two attendance rows.
            btnCheckIn.addEventListener('click', () => submitScan(0));
            btnCheckOut.addEventListener('click', () => submitScan(1));

            async function submitScan(punchType) {
                btnCheckIn.disabled = true;
                btnCheckOut.disabled = true;
                showProcessing();
                try {
                    updateStatus('📍 กำลังตรวจสอบตำแหน่ง GPS...');
                    const gpsData = await getGPSLocation();

                    updateStatus(punchType === 1 ? '✨ กำลังบันทึกออกงาน...' : '✨ กำลังบันทึกเข้างาน...');

                    const checkinResponse = await fetch('/api/public/qr-checkin/scan', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            qr_token: qrToken,
                            jwt_token: validatedJwt,
                            latitude: gpsData.latitude,
                            longitude: gpsData.longitude,
                            accuracy: gpsData.accuracy,
                            punch_type: punchType
                        })
                    });

                    const checkinData = await checkinResponse.json();

                    if (checkinResponse.ok && checkinData.success) {
                        showSuccess(checkinData, punchType);
                    } else {
                        // Re-enable buttons so user can retry their choice.
                        btnCheckIn.disabled = false;
                        btnCheckOut.disabled = false;
                        showError('บันทึกเวลาไม่สำเร็จ', checkinData.detail || checkinData.message);
                    }
                } catch (error) {
                    btnCheckIn.disabled = false;
                    btnCheckOut.disabled = false;
                    console.error('[QR Scan] Submit error:', error);
                    showError('เกิดข้อผิดพลาด', error.message || 'กรุณาลองใหม่อีกครั้ง');
                }
            }

            function showProcessing() {
                processingView.style.display = '';
                actionChoice.classList.remove('visible');
            }

            function showActionChoice() {
                processingView.style.display = 'none';
                actionChoice.classList.add('visible');
            }

            async function getGPSLocation() {
                return new Promise((resolve, reject) => {
                    if (!navigator.geolocation) {
                        reject(new Error('เบราว์เซอร์ไม่รองรับ GPS'));
                        return;
                    }

                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            resolve({
                                latitude: position.coords.latitude,
                                longitude: position.coords.longitude,
                                accuracy: position.coords.accuracy
                            });
                        },
                        (error) => {
                            reject(new Error('ไม่สามารถเข้าถึง GPS ได้ กรุณาเปิดใช้งาน Location Services'));
                        },
                        {
                            enableHighAccuracy: true,
                            timeout: 10000,
                            maximumAge: 0
                        }
                    );
                });
            }

            function updateStatus(message) {
                statusText.textContent = message;
                statusDetails.textContent = new Date().toLocaleTimeString('th-TH');
            }

            function showSuccess(data, punchType) {
                const container = document.querySelector('.container');
                const isCheckOut = punchType === 1;
                const title = isCheckOut ? 'บันทึกออกงานสำเร็จ!' : 'บันทึกเข้างานสำเร็จ!';
                const actionEmoji = isCheckOut ? '📤' : '📥';
                // Build static structure once, then assign data via textContent to prevent XSS.
                container.innerHTML = `
                    <div style="font-size: 64px; margin-bottom: 20px;">${actionEmoji}</div>
                    <h1 id="successTitle" style="color: #06C755;"></h1>
                    <p id="successMessage" style="font-size: 18px; margin: 16px 0;"></p>
                    <div style="background: #FAF9F7; padding: 16px; border-radius: 8px; margin: 20px 0; text-align: left;">
                        <p style="margin: 8px 0;"><strong>👤 พนักงาน:</strong> <span id="successEmployee"></span></p>
                        <p style="margin: 8px 0;"><strong>🕐 เวลา:</strong> <span id="successTime"></span></p>
                        <p style="margin: 8px 0;"><strong>📍 สถานที่:</strong> <span id="successLocation"></span></p>
                        <p id="successDistanceWrap" style="margin: 8px 0; display: none;"><strong>📏 ระยะทาง:</strong> <span id="successDistance"></span></p>
                    </div>
                    <a href="/qr-checkin/mobile" class="btn" style="display: inline-block; margin-right: 10px;">📱 ดูผลการแสกน QR</a>
                    <button class="btn" onclick="window.close()">ปิดหน้าต่าง</button>
                `;
                document.getElementById('successTitle').textContent = title;
                document.getElementById('successMessage').textContent = data.message || '';
                document.getElementById('successEmployee').textContent = data.attendance_record.employee_name || '';
                document.getElementById('successTime').textContent =
                    new Date(data.attendance_record.timestamp).toLocaleTimeString('th-TH');
                document.getElementById('successLocation').textContent = data.attendance_record.location || '';
                if (data.location_validation && data.location_validation.distance) {
                    document.getElementById('successDistanceWrap').style.display = '';
                    document.getElementById('successDistance').textContent =
                        Math.round(data.location_validation.distance) + 'm';
                }
            }

            function showError(title, message) {
                const container = document.querySelector('.container');
                // Build static structure once, then assign server-supplied strings via textContent.
                container.innerHTML = `
                    <div class="error-icon">❌</div>
                    <h1 id="errorTitle" style="color: #C53030;"></h1>
                    <div class="error">
                        <p id="errorMessage" style="margin: 0;"></p>
                    </div>
                    <button class="btn" onclick="window.location.href='/qr-checkin/mobile'">ไปที่หน้าสแกน QR</button>
                `;
                document.getElementById('errorTitle').textContent = title || '';
                document.getElementById('errorMessage').textContent = message || '';
            }
        })();
    </script>
</body>
</html>
