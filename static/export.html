<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>ส่งออกข้อมูล - ระบบบันทึกเวลาด้วยลายนิ้วมือ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- CSS Files with cache busting -->
    <script>
        // Guarded document.write: synchronous injection during initial parse is
        // intentional so the cache-busted config.js below is available before any
        // body inline scripts reference appConfig. The readyState guard prevents
        // accidental document overwrite if the block were re-executed.
        (function injectCacheBustedCss() {
            if (document.readyState !== 'loading') return;
            const cssTimestamp = Date.now();
            document.write(`<link rel="stylesheet" href="static/css/base.css?v=${cssTimestamp}">`);
        })();
    </script>

    <!-- JavaScript Files -->
    <script>
        (function injectCacheBustedJs() {
            if (document.readyState !== 'loading') return;
            const timestamp = Date.now();
            const randomId = Math.random().toString(36).substring(7);
            const buildNumber = '2025011800'; // Build timestamp - FORCE CACHE BREAK
            const version = `v2.5-debug-${buildNumber}`;
            const cacheBuster = `${timestamp}.${randomId}&build=${buildNumber}`;
            document.write(`<script src="static/js/config.js?v=${cacheBuster}&version=${version}&force=${Date.now()}"><\/script>`);
        })();
    </script>
    <style>
        .export-container {
            max-width: 600px;
            margin: 2rem auto;
            padding: 2rem;
        }
        
        .export-card {
            background: white;
            border-radius: 8px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #26221E;
        }
        
        .form-group input, .form-group select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #CFC9C1;
            border-radius: 6px;
            font-size: 1rem;
        }
        
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #2C5282;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        
        .date-range {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        
        .btn {
            width: 100%;
        }
        
        .export-status {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 6px;
            display: none;
        }
        
        .export-status.success {
            background-color: #DCEEE3;
            border: 1px solid #CFE4D8;
            color: #1D5438;
        }
        
        .export-status.error {
            background-color: #F7E2E2;
            border: 1px solid #EFC2C2;
            color: #C53030;
        }
        
        .export-status.loading {
            background-color: #F6EACB;
            border: 1px solid #E7C97F;
            color: #93691F;
        }
        
        .navigation {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .nav-link {
            color: #2C5282;
            text-decoration: none;
            margin: 0 1rem;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            transition: background-color 0.2s;
        }
        
        .nav-link:hover {
            background-color: #F4F1ED;
        }
        
        .info-text {
            background-color: #F4F7FB;
            border: 1px solid #E4EBF3;
            border-radius: 6px;
            padding: 1rem;
            color: #1F3F66;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-row-1">
            <h1>ส่งออกข้อมูลการลงเวลา</h1>
        </div>
        <div class="header-row-2">
            <div class="header-actions">
                <a href="./" class="action-btn">📊 แดชบอร์ด</a>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="export-container">
        <div class="info-text">
            ส่งออกบันทึกการลงเวลาเป็นไฟล์ CSV สำหรับการวิเคราะห์หรือรายงาน
        </div>
        
        <div class="export-card">
            <h2>ตัวเลือกการส่งออก CSV</h2>
            
            <form id="exportForm">
                <div class="form-group">
                    <label for="startDate">วันที่เริ่มต้น:</label>
                    <input type="date" id="startDate" name="startDate" required>
                </div>
                
                <div class="form-group">
                    <label for="endDate">วันที่สิ้นสุด:</label>
                    <input type="date" id="endDate" name="endDate" required>
                </div>
                
                <div class="form-group">
                    <label for="format">รูปแบบการส่งออก:</label>
                    <select id="format" name="format">
                        <option value="detailed">รายละเอียด (รวมชื่อพนักงาน)</option>
                        <option value="simple">แบบง่าย (เฉพาะบัตรและเวลา)</option>
                        <option value="summary">สรุปรายวัน (ยอดรวมรายวัน)</option>
                    </select>
                </div>
                
                <button type="submit" class="btn btn-primary" id="exportBtn">
                    ส่งออกเป็น CSV
                </button>
                
                <div class="export-status" id="exportStatus"></div>
            </form>
        </div>
        
        <div class="export-card">
            <h2>ตัวเลือกส่งออกด่วน</h2>
            
            <div style="display: grid; gap: 1rem;">
                <button class="btn btn-primary" onclick="quickExport('today')">
                    ส่งออกข้อมูลวันนี้
                </button>
                <button class="btn btn-primary" onclick="quickExport('week')">
                    ส่งออกข้อมูลสัปดาห์นี้
                </button>
                <button class="btn btn-primary" onclick="quickExport('month')">
                    ส่งออกข้อมูลเดือนนี้
                </button>
                <button class="btn btn-primary" onclick="quickExport('all')">
                    ส่งออกข้อมูลทั้งหมด
                </button>
            </div>
        </div>
    </div>

    <script>
        // Set default dates
        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date();
            const firstDayOfMonth = new Date(today.getFullYear(), today.getMonth(), 1);
            
            document.getElementById('startDate').value = firstDayOfMonth.toISOString().split('T')[0];
            document.getElementById('endDate').value = today.toISOString().split('T')[0];
        });
        
        document.getElementById('exportForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const format = document.getElementById('format').value;
            
            await exportData(startDate, endDate, format);
        });
        
        async function exportData(startDate, endDate, format = 'detailed') {
            const exportBtn = document.getElementById('exportBtn');
            const statusDiv = document.getElementById('exportStatus');
            
            try {
                // Ensure config is loaded first
                await appConfig.loadConfig();

                // Show loading status
                showStatus('กำลังเตรียมการส่งออก...', 'loading');
                exportBtn.disabled = true;
                exportBtn.textContent = 'กำลังส่งออก...';

                // Build export URL
                const params = new URLSearchParams({
                    start_date: startDate,
                    end_date: endDate,
                    format: format
                });

                const response = await fetch(appConfig.getApiUrl(`attendance/export/csv?${params}`));
                
                if (!response.ok) {
                    throw new Error(`การส่งออกล้มเหลว: ${response.statusText}`);
                }
                
                // Create download
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = `attendance_export_${startDate}_to_${endDate}.csv`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
                
                showStatus('ส่งออกข้อมูลเสร็จสิ้น!', 'success');
                
            } catch (error) {
                console.error('Export error:', error);
                showStatus(`การส่งออกล้มเหลว: ${error.message}`, 'error');
            } finally {
                exportBtn.disabled = false;
                exportBtn.textContent = 'ส่งออกเป็น CSV';
            }
        }
        
        async function quickExport(period) {
            const today = new Date();
            let startDate, endDate;
            
            switch (period) {
                case 'today':
                    startDate = endDate = today.toISOString().split('T')[0];
                    break;
                case 'week':
                    const weekStart = new Date(today);
                    weekStart.setDate(today.getDate() - today.getDay());
                    startDate = weekStart.toISOString().split('T')[0];
                    endDate = today.toISOString().split('T')[0];
                    break;
                case 'month':
                    const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
                    startDate = monthStart.toISOString().split('T')[0];
                    endDate = today.toISOString().split('T')[0];
                    break;
                case 'all':
                    startDate = '2020-01-01'; // Far back date
                    endDate = today.toISOString().split('T')[0];
                    break;
            }
            
            await exportData(startDate, endDate, 'detailed');
        }
        
        function showStatus(message, type) {
            const statusDiv = document.getElementById('exportStatus');
            statusDiv.textContent = message;
            statusDiv.className = `export-status ${type}`;
            statusDiv.style.display = 'block';
            
            if (type === 'success' || type === 'error') {
                setTimeout(() => {
                    statusDiv.style.display = 'none';
                }, 5000);
            }
        }
    </script>
    <script defer src="https://erp.thehfhotel.org/shell/hf-bar.js" data-app="Attendance" data-module="people"></script>
</body>
</html>
