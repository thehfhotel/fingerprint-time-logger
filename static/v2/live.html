<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#4F0E0E" />
  <title>ดูสด — ระบบบันทึกเวลา</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/fingerprintlogs/static/v2/theme.js"></script>
  <!-- Shared navigation — renders BOTH navs. Every page, no exceptions. -->
  <script defer src="/fingerprintlogs/static/v2/nav.js"></script>
  <script src="/fingerprintlogs/static/v2/ws.js"></script>
  <script>
    tailwind.config = {
      theme: { extend: window.V2.THEME },
      safelist: [
        "bg-brand-100", "text-brand-700",
        "bg-good-100",  "text-good-700",
        "bg-warn-100",  "text-warn-700",
        "bg-bad-100",   "text-bad-700",
        "bg-ink-200",   "text-ink-700",
        "bg-off-100",   "text-off-600",
        "bg-good-500",  "bg-bad-500", "bg-warn-500", "bg-ink-300",
        "animate-pulse",
      ],
    };
  </script>
  <style>
    /* Belt-and-braces: the CDN applies fontFamily only after theme.js parses. */
    html, body { font-family: 'Sarabun', 'Noto Sans Thai', system-ui, -apple-system, sans-serif; }
    /* HF One body type: 14px / 1.6 (Thai needs the tall leading). Set on BODY,
       never on <html> — Tailwind's spacing scale is rem-based and rescaling the
       root font-size shrinks every padding and gap utility on the page. */
    body { font-size: 0.875rem; line-height: 1.6; }

    /* Keyframes declared here so they're available even if Tailwind CDN
       hasn't emitted them yet (we trigger via inline style.animation).
       Values mirror theme.js's keyframes — the flash is brand-500 at 10%. */
    @keyframes slideInTop {
      0%   { opacity: 0; transform: translateY(-8px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulseHighlight {
      0%   { background-color: rgba(139, 0, 0, .10); }  /* brand-500 @ 10% */
      100% { background-color: rgba(255, 255, 255, 0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .v2-row-new { animation: none !important; }
    }

    /* ---------- Focus: brand-500 at 40%, never a colored glow ---------- */
    a:focus-visible, button:focus-visible {
      outline: 2px solid rgba(139, 0, 0, .40);   /* brand-500 / 40% */
      outline-offset: 2px;
    }
  </style>
</head>
<body class="min-h-screen bg-ink-50 text-ink-900 antialiased">

  <!-- The ONLY nav markup this page carries. See STYLE.md section 2. -->
  <nav id="v2nav" data-page="live"></nav>

  <main class="mx-auto max-w-3xl px-4 pt-5 pb-28 md:px-5 md:pt-8 md:pb-12">

    <!-- HEADER -->
    <header class="mb-5 md:mb-7">
      <div class="flex items-start justify-between gap-3">
        <div>
          <p class="text-xs font-semibold tracking-wide text-brand-600">ดูสด</p>
          <h1 class="mt-1 text-xl font-bold tracking-tight text-ink-900">การบันทึกเวลาแบบสด</h1>
        </div>
        <!-- Status pill -->
        <div id="statusPill"
             class="inline-flex shrink-0 items-center gap-2 rounded-full border border-ink-200 bg-white px-2.5 py-1 text-xs shadow-card md:text-sm">
          <span id="statusDot" class="inline-block h-2 w-2 rounded-full bg-ink-300 animate-pulse"></span>
          <span id="statusText" class="font-medium text-ink-600">กำลังเชื่อมต่อ…</span>
        </div>
      </div>
      <!-- The one deliberate gold mark on this screen: the number this page
           exists to draw the eye to (HF One accent rule). -->
      <p id="lastPushText" class="mt-2 border-l-2 border-gold-300 pl-2 text-sm text-ink-600">รอการลงเวลาครั้งถัดไป…</p>
    </header>

    <!-- FEED -->
    <section class="rounded-xl border border-ink-200 bg-white shadow-card overflow-hidden">
      <div class="flex items-center justify-between border-b border-ink-100 px-4 py-3">
        <h2 class="text-sm font-semibold text-ink-700">การลงเวลาล่าสุด</h2>
        <span id="feedCount" class="text-xs tabular-nums text-ink-500">0</span>
      </div>

      <!-- Empty state -->
      <div id="emptyState" class="px-6 py-16 text-center">
        <div class="mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-full bg-brand-50 text-brand-600">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6">
            <circle cx="12" cy="12" r="9"/>
            <polyline points="12 7 12 12 15 14"/>
          </svg>
        </div>
        <p class="text-sm font-medium text-ink-700">รอการลงเวลาครั้งถัดไป…</p>
        <p class="mt-1 text-xs text-ink-500">รายการใหม่จะแสดงที่นี่ทันที</p>
      </div>

      <!-- Loading state -->
      <div id="loadingState" class="hidden px-6 py-12 text-center">
        <div class="mx-auto h-6 w-6 animate-spin rounded-full border-2 border-ink-200 border-t-brand-500"></div>
        <p class="mt-3 text-sm text-ink-500">กำลังโหลดข้อมูลล่าสุด…</p>
      </div>

      <!-- Error state -->
      <div id="errorState" class="hidden border-t border-bad-100 bg-bad-50 px-4 py-3 text-sm text-bad-700">
        <span id="errorText">ไม่สามารถโหลดข้อมูลล่าสุดได้</span>
        <button id="retryBtn" class="ml-2 font-semibold underline underline-offset-2 hover:text-bad-600">ลองใหม่</button>
      </div>

      <!-- Feed list -->
      <ul id="feedList" class="hidden divide-y divide-ink-100"></ul>
    </section>

    <!-- Feed size: the initial REST load brings the newest 20; realtime rows
         prepend on top and the list is trimmed at 200. -->
    <p class="mt-4 text-center text-xs text-ink-500">
      โหลด 20 รายการล่าสุด · รายการใหม่เพิ่มขึ้นสูงสุด 200 รายการ · เวลาเขตกรุงเทพ (Asia/Bangkok)
    </p>
  </main>

  <!-- Row template -->
  <template id="rowTemplate">
    <li class="flex items-center gap-3 px-4 py-3 md:px-5">
      <span data-role="avatar"
            class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full text-sm font-semibold"></span>
      <div class="min-w-0 flex-1">
        <p data-role="name" class="truncate text-sm font-semibold text-ink-900"></p>
        <p data-role="badge" class="truncate text-xs text-ink-500"></p>
      </div>
      <span data-role="pill"
            class="inline-flex items-center rounded-full px-2 py-0.5 text-xs font-medium"></span>
      <span data-role="time" class="ml-2 shrink-0 tabular-nums text-sm font-semibold text-ink-700"></span>
    </li>
  </template>

  <script>
    (function () {
      const V2 = window.V2;
      const MAX_ROWS = 200;
      const INITIAL_LIMIT = 20;

      // DOM refs
      const list = document.getElementById("feedList");
      const empty = document.getElementById("emptyState");
      const loading = document.getElementById("loadingState");
      const error = document.getElementById("errorState");
      const errorText = document.getElementById("errorText");
      const retryBtn = document.getElementById("retryBtn");
      const countEl = document.getElementById("feedCount");
      const tmpl = document.getElementById("rowTemplate");

      const statusDot = document.getElementById("statusDot");
      const statusText = document.getElementById("statusText");
      const lastPushText = document.getElementById("lastPushText");

      // Latest-seen punch (UTC ISO) for the "punched Xs ago" label.
      let lastPunchIso = null;

      // ---------- Status pill ----------
      function setStatus(state, label) {
        statusDot.classList.remove("animate-pulse", "bg-ink-300", "bg-good-500", "bg-bad-500", "bg-warn-500");
        if (state === "online")       statusDot.classList.add("bg-good-500");
        else if (state === "offline") statusDot.classList.add("bg-bad-500");
        else                          statusDot.classList.add("bg-ink-300", "animate-pulse");
        statusText.textContent = label;
      }

      // ---------- Row rendering ----------
      function pillFor(punchType) {
        // punch_type: 0 = check-in, 1 = check-out (matches existing dashboard convention).
        const isIn = punchType === 0 || punchType === "0";
        return {
          label: isIn ? "เข้า" : "ออก",
          klass: isIn ? "bg-good-100 text-good-700" : "bg-brand-100 text-brand-700",
        };
      }

      function buildRow(entry) {
        const li = tmpl.content.firstElementChild.cloneNode(true);
        const avatar = li.querySelector('[data-role="avatar"]');
        const name = li.querySelector('[data-role="name"]');
        const badge = li.querySelector('[data-role="badge"]');
        const pill = li.querySelector('[data-role="pill"]');
        const time = li.querySelector('[data-role="time"]');

        const displayName = entry.display_name || ("บัตร " + (entry.badge_number || "?"));
        avatar.textContent = V2.initials(displayName);
        avatar.className = avatar.className + " " + V2.avatarColor(entry.badge_number || displayName);
        name.textContent = displayName;
        badge.textContent = entry.badge_number ? ("#" + entry.badge_number) : "";

        const p = pillFor(entry.punch_type);
        pill.textContent = p.label;
        pill.className = pill.className + " " + p.klass;

        time.textContent = V2.bangkokTime(entry.timestamp);
        return li;
      }

      function showFeedShellIfNeeded() {
        loading.classList.add("hidden");
        empty.classList.add("hidden");
        list.classList.remove("hidden");
      }

      function setEmpty() {
        list.classList.add("hidden");
        loading.classList.add("hidden");
        empty.classList.remove("hidden");
      }

      function trim() {
        while (list.children.length > MAX_ROWS) {
          list.removeChild(list.lastElementChild);
        }
        countEl.textContent = String(list.children.length);
      }

      function prepend(entry, opts) {
        if (!entry || !entry.timestamp) return;
        showFeedShellIfNeeded();
        const row = buildRow(entry);
        if (opts && opts.highlight && !V2.reducedMotion()) {
          row.classList.add("v2-row-new");
          row.style.animation = "slideInTop 240ms ease-out, pulseHighlight 1000ms ease-out";
        }
        list.insertBefore(row, list.firstChild);
        trim();

        // Track latest punch time for the "Xs ago" label.
        if (!lastPunchIso || new Date(entry.timestamp) > new Date(lastPunchIso)) {
          lastPunchIso = entry.timestamp;
        }
      }

      // ---------- "Last push" ticker ----------
      function tickLastPush() {
        if (!lastPunchIso) {
          lastPushText.textContent = "รอการลงเวลาครั้งถัดไป…";
        } else {
          lastPushText.textContent = "ลงเวลาล่าสุด " + V2.relTime(lastPunchIso);
        }
      }
      setInterval(tickLastPush, 1000);

      // ---------- Initial REST load ----------
      function showError(msg) {
        loading.classList.add("hidden");
        error.classList.remove("hidden");
        errorText.textContent = msg || "ไม่สามารถโหลดข้อมูลล่าสุดได้";
      }
      function hideError() {
        error.classList.add("hidden");
      }

      async function loadInitial() {
        loading.classList.remove("hidden");
        empty.classList.add("hidden");
        list.classList.add("hidden");
        hideError();
        try {
          const data = await V2.apiFetch("/api/private/attendance/?limit=" + INITIAL_LIMIT);
          // Response shape (consolidated_attendance.py):
          // { records: [{ employee_badge_number, timestamp, punch_type, ... }], total }
          const records = (data && data.records) || [];
          if (records.length === 0) {
            setEmpty();
            countEl.textContent = "0";
            return;
          }

          // Need display names — fetch employees in one batch.
          let nameMap = {};
          try {
            const empData = await V2.apiFetch("/api/private/employees/");
            const arr = (empData && (empData.employees || empData.records || empData)) || [];
            (Array.isArray(arr) ? arr : []).forEach(function (e) {
              if (e && e.badge_number) {
                nameMap[e.badge_number] = e.display_name || e.name || e.thai_name || null;
              }
            });
          } catch (_) { /* names optional */ }

          // Render newest-first. Backend returns ordered desc by default;
          // re-sort defensively so the feed is reliable.
          records.sort(function (a, b) {
            return new Date(b.timestamp) - new Date(a.timestamp);
          });

          showFeedShellIfNeeded();
          list.innerHTML = "";
          records.forEach(function (r) {
            const entry = {
              badge_number: r.employee_badge_number,
              display_name: nameMap[r.employee_badge_number] || null,
              timestamp: r.timestamp,
              punch_type: r.punch_type,
            };
            const row = buildRow(entry);
            list.appendChild(row);
            if (!lastPunchIso || new Date(entry.timestamp) > new Date(lastPunchIso)) {
              lastPunchIso = entry.timestamp;
            }
          });
          countEl.textContent = String(list.children.length);
          tickLastPush();
        } catch (err) {
          showError("ไม่สามารถโหลดข้อมูลล่าสุดได้ (" + (err.status || "เครือข่าย") + ")");
        }
      }
      retryBtn.addEventListener("click", loadInitial);

      // ---------- WebSocket ----------
      // V2WS hands over the TOP-LEVEL broadcast object as arg 1 (badge_number /
      // display_name / timestamp / punch_type) and the dashboard summary — which
      // this page does not use — as an optional arg 2.
      function onPunch(p) {
        // Defensive: ensure required fields.
        if (!p) return;
        prepend({
          badge_number: p.badge_number,
          display_name: p.display_name,
          timestamp: p.timestamp,
          punch_type: p.punch_type,
        }, { highlight: true });
        tickLastPush();
      }
      function onStatus(s) {
        if (s.connected) setStatus("online", "เชื่อมต่อแล้ว");
        else setStatus("offline", "กำลังเชื่อมต่อใหม่…");
      }

      // Boot
      setStatus("warm", "กำลังเชื่อมต่อ…");
      loadInitial();
      V2WS.connectWS({ onPunch: onPunch, onStatus: onStatus });
    })();
  </script>
  <script defer src="https://erp.thehfhotel.org/shell/hf-bar.js" data-app="Attendance" data-module="people"></script>
</body>
</html>
