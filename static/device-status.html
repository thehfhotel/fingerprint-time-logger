<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Status - Fingerprint Time Logger</title>
    <link rel="stylesheet" href="static/css/base.css">
    <style>
        .status-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
        }
        
        .status-card {
            background: white;
            border-radius: 8px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .status-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        
        .status-indicator {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        
        .status-connected { background-color: #22c55e; }
        .status-disconnected { background-color: #ef4444; }
        .status-syncing { background-color: #f59e0b; }
        
        .device-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin: 1rem 0;
        }
        
        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid #e5e7eb;
        }
        
        .action-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }
        
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background-color: #3b82f6;
            color: white;
        }
        
        .btn-primary:hover {
            background-color: #2563eb;
        }
        
        .btn-secondary {
            background-color: #6b7280;
            color: white;
        }
        
        .btn-secondary:hover {
            background-color: #4b5563;
        }
        
        .sync-log {
            max-height: 300px;
            overflow-y: auto;
            background-color: #f9fafb;
            padding: 1rem;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.875rem;
        }
        
        .navigation {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .nav-link {
            color: #3b82f6;
            text-decoration: none;
            margin: 0 1rem;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            transition: background-color 0.2s;
        }
        
        .nav-link:hover {
            background-color: #f3f4f6;
        }
        
        .loading {
            text-align: center;
            padding: 2rem;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <div class="navigation">
        <a href="./" class="nav-link">Dashboard</a>
        <a href="./device-status" class="nav-link">Device Status</a>
        <a href="./nickname-management" class="nav-link">Nicknames</a>
        <a href="./export" class="nav-link">Export Data</a>
    </div>

    <div class="status-container">
        <h1>ZKTeco Device Status</h1>
        
        <div class="status-card">
            <div class="status-header">
                <div class="status-indicator" id="deviceIndicator"></div>
                <h2>Device Connection</h2>
            </div>
            
            <div class="device-info" id="deviceInfo">
                <div class="loading">Loading device information...</div>
            </div>
            
            <div class="action-buttons">
                <button class="btn btn-primary" onclick="syncTime()">Sync Time to Device</button>
                <button class="btn btn-primary" onclick="importLogs()">Import Fingerprint Logs</button>
                <button class="btn btn-secondary" onclick="refreshStatus()">Refresh Status</button>
            </div>
        </div>
        
        <div class="status-card">
            <div class="status-header">
                <div class="status-indicator" id="autoImportIndicator"></div>
                <h2>Auto-Import Service</h2>
            </div>
            
            <div class="device-info" id="autoImportInfo">
                <div class="loading">Loading auto-import status...</div>
            </div>
            
            <div class="action-buttons">
                <button class="btn btn-primary" onclick="triggerManualImport()">Import Now</button>
                <button class="btn btn-secondary" onclick="refreshAutoImportStatus()">Refresh Status</button>
            </div>
        </div>
        
        <div class="status-card">
            <h2>Recent Sync Activity</h2>
            <div class="sync-log" id="syncLog">
                <div class="loading">Loading sync log...</div>
            </div>
        </div>
    </div>

    <script>
        let deviceStatus = {};
        
        async function loadDeviceStatus() {
            try {
                const response = await fetch(appConfig.getApiUrl('devices/health'));
                deviceStatus = await response.json();
                updateDeviceDisplay();
            } catch (error) {
                console.error('Failed to load device status:', error);
                showError('Failed to connect to device');
            }
        }
        
        function updateDeviceDisplay() {
            const indicator = document.getElementById('deviceIndicator');
            const infoDiv = document.getElementById('deviceInfo');
            
            if (deviceStatus.device_connected || deviceStatus.connected) {
                indicator.className = 'status-indicator status-connected';
                infoDiv.innerHTML = `
                    <div class="info-item">
                        <span>Status:</span>
                        <span style="color: #22c55e; font-weight: 500;">Connected</span>
                    </div>
                    <div class="info-item">
                        <span>Device Model:</span>
                        <span>${deviceStatus.device_name || deviceStatus.model || 'ZKTeco Device'}</span>
                    </div>
                    <div class="info-item">
                        <span>IP Address:</span>
                        <span>${deviceStatus.ip || 'Unknown'}</span>
                    </div>
                    <div class="info-item">
                        <span>Serial Number:</span>
                        <span>${deviceStatus.serial || 'N/A'}</span>
                    </div>
                    <div class="info-item">
                        <span>Device Time:</span>
                        <span>${deviceStatus.device_time || 'Unknown'}</span>
                    </div>
                    <div class="info-item">
                        <span>Users Count:</span>
                        <span>${deviceStatus.users_count || 0}</span>
                    </div>
                    <div class="info-item">
                        <span>Records Count:</span>
                        <span>${deviceStatus.records_count || 0}</span>
                    </div>
                    <div class="info-item">
                        <span>Last Sync:</span>
                        <span>${deviceStatus.last_sync || 'Never'}</span>
                    </div>
                `;
            } else {
                indicator.className = 'status-indicator status-disconnected';
                infoDiv.innerHTML = `
                    <div class="info-item">
                        <span>Status:</span>
                        <span style="color: #ef4444; font-weight: 500;">Disconnected</span>
                    </div>
                    <div class="info-item">
                        <span>Error:</span>
                        <span>${deviceStatus.error || 'Unable to connect to device'}</span>
                    </div>
                `;
            }
        }
        
        async function syncTime() {
            try {
                const indicator = document.getElementById('deviceIndicator');
                indicator.className = 'status-indicator status-syncing';
                
                const response = await fetch(appConfig.getApiUrl('devices/sync-time'), { method: 'POST' });
                const result = await response.json();
                
                if (result.success) {
                    addSyncLog('Time sync successful');
                    loadDeviceStatus();
                } else {
                    addSyncLog('Time sync failed: ' + result.message);
                }
            } catch (error) {
                addSyncLog('Time sync error: ' + error.message);
                loadDeviceStatus();
            }
        }
        
        async function importLogs() {
            try {
                const indicator = document.getElementById('deviceIndicator');
                indicator.className = 'status-indicator status-syncing';
                
                const response = await fetch(appConfig.getApiUrl('attendance/sync'), { method: 'POST' });
                const result = await response.json();
                
                if (result.success) {
                    addSyncLog(`Import successful: ${result.imported_count || 0} records imported`);
                    loadDeviceStatus();
                } else {
                    addSyncLog('Import failed: ' + result.message);
                }
            } catch (error) {
                addSyncLog('Import error: ' + error.message);
                loadDeviceStatus();
            }
        }
        
        function refreshStatus() {
            loadDeviceStatus();
            addSyncLog('Status refreshed');
        }
        
        function addSyncLog(message) {
            const logDiv = document.getElementById('syncLog');
            const timestamp = new Date().toLocaleString();
            const logEntry = `[${timestamp}] ${message}\n`;
            
            if (logDiv.textContent.includes('Loading sync log...')) {
                logDiv.textContent = logEntry;
            } else {
                logDiv.textContent = logEntry + logDiv.textContent;
            }
            
            // Keep only last 50 lines
            const lines = logDiv.textContent.split('\n');
            if (lines.length > 50) {
                logDiv.textContent = lines.slice(0, 50).join('\n');
            }
        }
        
        function showError(message) {
            const indicator = document.getElementById('deviceIndicator');
            indicator.className = 'status-indicator status-disconnected';
            
            const infoDiv = document.getElementById('deviceInfo');
            infoDiv.innerHTML = `
                <div class="info-item">
                    <span>Error:</span>
                    <span style="color: #ef4444;">${message}</span>
                </div>
            `;
        }
        
        // Auto-import functions
        let autoImportStatus = {};
        
        async function loadAutoImportStatus() {
            try {
                const response = await fetch(appConfig.getApiUrl('auto-import/status'));
                autoImportStatus = await response.json();
                updateAutoImportDisplay();
            } catch (error) {
                console.error('Failed to load auto-import status:', error);
                showAutoImportError('Failed to load auto-import status');
            }
        }
        
        function updateAutoImportDisplay() {
            const indicator = document.getElementById('autoImportIndicator');
            const infoDiv = document.getElementById('autoImportInfo');
            
            if (autoImportStatus.enabled && autoImportStatus.task_status === 'running') {
                indicator.className = 'status-indicator status-connected';
                infoDiv.innerHTML = `
                    <div class="info-item">
                        <span>Status:</span>
                        <span style="color: #22c55e; font-weight: 500;">Active</span>
                    </div>
                    <div class="info-item">
                        <span>Import Interval:</span>
                        <span>${autoImportStatus.interval_minutes} minutes</span>
                    </div>
                    <div class="info-item">
                        <span>Next Import:</span>
                        <span>${autoImportStatus.next_import_estimate}</span>
                    </div>
                    <div class="info-item">
                        <span>Task Status:</span>
                        <span style="color: #22c55e;">${autoImportStatus.task_status}</span>
                    </div>
                `;
            } else {
                indicator.className = 'status-indicator status-disconnected';
                infoDiv.innerHTML = `
                    <div class="info-item">
                        <span>Status:</span>
                        <span style="color: #ef4444; font-weight: 500;">Inactive</span>
                    </div>
                    <div class="info-item">
                        <span>Task Status:</span>
                        <span style="color: #ef4444;">${autoImportStatus.task_status || 'stopped'}</span>
                    </div>
                    <div class="info-item">
                        <span>Configured Interval:</span>
                        <span>${autoImportStatus.interval_minutes || 30} minutes</span>
                    </div>
                `;
            }
        }
        
        async function triggerManualImport() {
            try {
                const indicator = document.getElementById('autoImportIndicator');
                indicator.className = 'status-indicator status-syncing';
                
                const response = await fetch(appConfig.getApiUrl('auto-import/trigger'), { method: 'POST' });
                const result = await response.json();
                
                if (result.success) {
                    addSyncLog(`Manual import successful: ${result.synced || 0} records synced`);
                    loadDeviceStatus();
                    loadAutoImportStatus();
                } else {
                    addSyncLog('Manual import failed: ' + result.message);
                }
            } catch (error) {
                addSyncLog('Manual import error: ' + error.message);
                loadAutoImportStatus();
            }
        }
        
        function refreshAutoImportStatus() {
            loadAutoImportStatus();
            addSyncLog('Auto-import status refreshed');
        }
        
        function showAutoImportError(message) {
            const indicator = document.getElementById('autoImportIndicator');
            indicator.className = 'status-indicator status-disconnected';
            
            const infoDiv = document.getElementById('autoImportInfo');
            infoDiv.innerHTML = `
                <div class="info-item">
                    <span>Error:</span>
                    <span style="color: #ef4444;">${message}</span>
                </div>
            `;
        }
        
        // Initialize page
        document.addEventListener('DOMContentLoaded', () => {
            loadDeviceStatus();
            loadAutoImportStatus();
            addSyncLog('Device status page loaded');
            
            // Auto-refresh every 30 seconds
            setInterval(() => {
                loadDeviceStatus();
                loadAutoImportStatus();
            }, 30000);
        });
    </script>
</body>
</html>
