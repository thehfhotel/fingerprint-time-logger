<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="version" content="v3.0-logs-update-20250919">
    <title>สถานะเครื่อง - ระบบบันทึกเวลาด้วยลายนิ้วมือ</title>
    <!-- CSS Files with cache busting -->
    <script>
        const cssTimestamp = Date.now();
        document.write(`<link rel="stylesheet" href="static/css/base.css?v=${cssTimestamp}">`);
    </script>

    <!-- JavaScript Files -->
    <script>
        const timestamp = Date.now();
        const version = 'v3.0-logs-update-20250919';
        document.write(`<script src="static/js/config.js?v=${timestamp}&version=${version}&bust=2"><\/script>`);
    </script>
    <style>
        .status-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
        }
        
        .status-card {
            background: white;
            border-radius: 8px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .status-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        
        .status-indicator {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        
        .status-connected { background-color: #22c55e; }
        .status-disconnected { background-color: #ef4444; }
        .status-syncing { background-color: #f59e0b; }
        
        .device-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin: 1rem 0;
        }
        
        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid #e5e7eb;
        }
        
        .action-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }
        
        
        .sync-log {
            max-height: 300px;
            overflow-y: auto;
            background-color: #f9fafb;
            padding: 1rem;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.875rem;
        }
        
        
        .loading {
            text-align: center;
            padding: 2rem;
            color: #6b7280;
        }

        .log-controls {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .log-controls select {
            padding: 0.25rem 0.5rem;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            font-size: 0.875rem;
        }

        .btn-sm {
            padding: 0.25rem 0.75rem;
            font-size: 0.875rem;
        }

        .log-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin: 1rem 0;
            padding: 1rem;
            background-color: #f9fafb;
            border-radius: 6px;
            font-size: 0.875rem;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1f2937;
        }

        .stat-label {
            color: #6b7280;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .log-entry {
            margin-bottom: 0.5rem;
            padding: 0.5rem;
            border-left: 3px solid #e5e7eb;
            background-color: #f9fafb;
            border-radius: 0 4px 4px 0;
        }

        .log-entry.level-error {
            border-left-color: #ef4444;
            background-color: #fef2f2;
        }

        .log-entry.level-warning {
            border-left-color: #f59e0b;
            background-color: #fffbeb;
        }

        .log-entry.level-info {
            border-left-color: #3b82f6;
            background-color: #eff6ff;
        }

        .log-timestamp {
            font-size: 0.75rem;
            color: #6b7280;
            margin-bottom: 0.25rem;
        }

        .log-message {
            font-family: inherit;
            font-size: 0.875rem;
            line-height: 1.4;
        }

        .log-details {
            font-size: 0.75rem;
            color: #6b7280;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-row-1">
            <h1>สถานะเครื่องสแกน</h1>
        </div>
        <div class="header-row-2">
            <div class="header-actions">
                <a href="./" class="action-btn">📊 แดชบอร์ด</a>
                <a href="./device-status" class="action-btn" style="background: var(--accent-blue); color: white;">🔧 สถานะเครื่อง</a>
                <a href="./nickname-management" class="action-btn">👤 จัดการชื่อเล่น</a>
                <a href="/fingerprintlogs/individual-attendance" class="action-btn">📅 เข้า/ออก รายคน</a>
                <a href="./export" class="action-btn">📤 ส่งออกข้อมูล</a>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="status-container">
        <h1>สถานะเครื่อง ZKTeco</h1>
        
        <div class="status-card">
            <div class="status-header">
                <div class="status-indicator" id="deviceIndicator"></div>
                <h2>Device Connection</h2>
            </div>
            
            <div class="device-info" id="deviceInfo">
                <div class="loading">กำลังโหลดข้อมูลเครื่อง...</div>
            </div>
            
            <div class="action-buttons">
                <button class="btn btn-primary" onclick="syncTime()">Sync Time to Device</button>
                <button class="btn btn-primary" onclick="importLogs()">นำเข้าบันทึกลายนิ้วมือ</button>
                <button class="btn btn-secondary" onclick="refreshStatus()">รีเฟรชสถานะ</button>
            </div>
        </div>
        
        <div class="status-card">
            <div class="status-header">
                <div class="status-indicator" id="autoImportIndicator"></div>
                <h2>บริการนำเข้าอัตโนมัติ</h2>
            </div>
            
            <div class="device-info" id="autoImportInfo">
                <div class="loading">กำลังโหลดสถานะการนำเข้าอัตโนมัติ...</div>
            </div>
            
            <div class="action-buttons">
                <button class="btn btn-primary" onclick="triggerManualImport()">นำเข้าทันที</button>
                <button class="btn btn-secondary" onclick="refreshAutoImportStatus()">รีเฟรชสถานะ</button>
            </div>
        </div>
        
        <div class="status-card">
            <div class="status-header">
                <h2>Application Logs <span style="font-size: 0.7em; color: #22c55e; font-weight: normal;">✓ v3.0</span></h2>
                <div class="log-controls">
                    <select id="logLevel" onchange="loadLogs()">
                        <option value="">All Levels</option>
                        <option value="ERROR">ข้อผิดพลาดเท่านั้น</option>
                        <option value="WARNING">Warnings</option>
                        <option value="INFO">Info</option>
                    </select>
                    <select id="logCategory" onchange="loadLogs()">
                        <option value="">All Categories</option>
                        <option value="sync">Sync Operations</option>
                        <option value="connection">Device Connection</option>
                        <option value="api">API Requests</option>
                        <option value="system">System Events</option>
                        <option value="employee">Employee Actions</option>
                    </select>
                    <button class="btn btn-secondary btn-sm" onclick="loadLogs()">🔄 รีเฟรช</button>
                    <button class="btn btn-secondary btn-sm" onclick="clearLogDisplay()">🗑️ ล้างการแสดงผล</button>
                </div>
            </div>
            <div class="log-stats" id="logStats">
                <div class="loading">กำลังโหลดสถิติบันทึก...</div>
            </div>
            <div class="sync-log" id="syncLog">
                <div class="loading">กำลังโหลดบันทึกการทำงาน...</div>
            </div>
        </div>
    </div>

    <script>
        let deviceStatus = {};
        
        async function loadDeviceStatus() {
            try {
                const response = await fetch(appConfig.getApiUrl('devices/health'));
                deviceStatus = await response.json();
                updateDeviceDisplay();
            } catch (error) {
                console.error('Failed to load device status:', error);
                showError('Failed to connect to device');
            }
        }
        
        function updateDeviceDisplay() {
            const indicator = document.getElementById('deviceIndicator');
            const infoDiv = document.getElementById('deviceInfo');
            
            if (deviceStatus.device_connected || deviceStatus.connected) {
                indicator.className = 'status-indicator status-connected';
                infoDiv.innerHTML = `
                    <div class="info-item">
                        <span>Status:</span>
                        <span style="color: #22c55e; font-weight: 500;">เชื่อมต่อแล้ว</span>
                    </div>
                    <div class="info-item">
                        <span>Device Model:</span>
                        <span>${deviceStatus.device_name || deviceStatus.model || 'ZKTeco Device'}</span>
                    </div>
                    <div class="info-item">
                        <span>IP Address:</span>
                        <span>${deviceStatus.ip || 'Unknown'}</span>
                    </div>
                    <div class="info-item">
                        <span>Serial Number:</span>
                        <span>${deviceStatus.serial || 'N/A'}</span>
                    </div>
                    <div class="info-item">
                        <span>Device Time:</span>
                        <span>${deviceStatus.device_time || 'Unknown'}</span>
                    </div>
                    <div class="info-item">
                        <span>Users Count:</span>
                        <span>${deviceStatus.users_count || 0}</span>
                    </div>
                    <div class="info-item">
                        <span>Records Count:</span>
                        <span>${deviceStatus.records_count || 0}</span>
                    </div>
                    <div class="info-item">
                        <span>Last Sync:</span>
                        <span>${deviceStatus.last_sync || 'Never'}</span>
                    </div>
                `;
            } else {
                indicator.className = 'status-indicator status-disconnected';
                infoDiv.innerHTML = `
                    <div class="info-item">
                        <span>Status:</span>
                        <span style="color: #ef4444; font-weight: 500;">ไม่ได้เชื่อมต่อ</span>
                    </div>
                    <div class="info-item">
                        <span>ข้อผิดพลาด:</span>
                        <span>${deviceStatus.error || 'Unable to connect to device'}</span>
                    </div>
                `;
            }
        }
        
        async function syncTime() {
            try {
                const indicator = document.getElementById('deviceIndicator');
                indicator.className = 'status-indicator status-syncing';
                
                const response = await fetch(appConfig.getApiUrl('devices/sync-time'), { method: 'POST' });
                const result = await response.json();
                
                if (result.success) {
                    addSyncLog('Time sync successful');
                    loadDeviceStatus();
                } else {
                    addSyncLog('Time sync failed: ' + result.message);
                }
            } catch (error) {
                addSyncLog('Time sync error: ' + error.message);
                loadDeviceStatus();
            }
        }
        
        async function importLogs() {
            try {
                const indicator = document.getElementById('deviceIndicator');
                indicator.className = 'status-indicator status-syncing';
                
                const response = await fetch(appConfig.getApiUrl('attendance/sync'), { method: 'POST' });
                const result = await response.json();
                
                if (result.success) {
                    addSyncLog(`Import successful: ${result.imported_count || 0} records imported`);
                    loadDeviceStatus();
                } else {
                    addSyncLog('Import failed: ' + result.message);
                }
            } catch (error) {
                addSyncLog('Import error: ' + error.message);
                loadDeviceStatus();
            }
        }
        
        function refreshStatus() {
            loadDeviceStatus();
            addSyncLog('Status refreshed');
        }
        
        async function loadLogs() {
            try {
                const level = document.getElementById('logLevel').value;
                const category = document.getElementById('logCategory').value;

                // Build query parameters
                const params = new URLSearchParams({
                    limit: '100',
                    hours_back: '168' // 1 week
                });

                if (level) params.append('level', level);
                if (category) params.append('category', category);

                const response = await fetch(appConfig.getApiUrl(`system/logs?${params}`));
                const data = await response.json();

                displayLogs(data.logs || []);
                displayLogStats(data.summary || {});

            } catch (error) {
                console.error('Failed to load logs:', error);
                const logDiv = document.getElementById('syncLog');
                logDiv.innerHTML = '<div class="log-entry level-error">Failed to load logs: ' + error.message + '</div>';
            }
        }

        function displayLogs(logs) {
            const logDiv = document.getElementById('syncLog');

            if (logs.length === 0) {
                logDiv.innerHTML = '<div class="log-entry">No logs found matching the current filters.</div>';
                return;
            }

            const logEntries = logs.map(log => {
                const timestamp = new Date(log.timestamp).toLocaleString();
                const levelClass = `level-${log.level.toLowerCase()}`;

                let details = '';
                if (log.details && Object.keys(log.details).length > 0) {
                    details = `<div class="log-details">Details: ${JSON.stringify(log.details)}</div>`;
                }

                let badge = '';
                if (log.employee_badge) {
                    details += `<div class="log-details">Employee: ${log.employee_badge}</div>`;
                }

                let duration = '';
                if (log.duration_ms) {
                    details += `<div class="log-details">Duration: ${log.duration_ms}ms</div>`;
                }

                const successIcon = log.success === true ? '✅' : log.success === false ? '❌' : '';

                return `
                    <div class="log-entry ${levelClass}">
                        <div class="log-timestamp">[${timestamp}] ${log.level} - ${log.category}.${log.action} ${successIcon}</div>
                        <div class="log-message">${log.message}</div>
                        ${details}
                    </div>
                `;
            }).join('');

            logDiv.innerHTML = logEntries;
        }

        function displayLogStats(summary) {
            const statsDiv = document.getElementById('logStats');

            if (!summary || summary.error) {
                statsDiv.innerHTML = '<div class="loading">Log statistics unavailable</div>';
                return;
            }

            const healthColor = summary.health_status === 'good' ? '#22c55e' :
                              summary.health_status === 'warning' ? '#f59e0b' : '#ef4444';

            statsDiv.innerHTML = `
                <div class="stat-item">
                    <div class="stat-value">${summary.total_logs || 0}</div>
                    <div class="stat-label">Total Logs</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" style="color: #ef4444;">${summary.recent_errors || 0}</div>
                    <div class="stat-label">ข้อผิดพลาด</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" style="color: #f59e0b;">${summary.recent_warnings || 0}</div>
                    <div class="stat-label">Warnings</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" style="color: ${healthColor};">${summary.health_status || 'unknown'}</div>
                    <div class="stat-label">System Health</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">${summary.category_counts?.sync || 0}</div>
                    <div class="stat-label">Sync Events</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">${summary.category_counts?.connection || 0}</div>
                    <div class="stat-label">Connections</div>
                </div>
            `;
        }

        function clearLogDisplay() {
            const logDiv = document.getElementById('syncLog');
            logDiv.innerHTML = '<div class="loading">ล้างการแสดงผลแล้ว คลิกรีเฟรชเพื่อโหลดบันทึกใหม่</div>';
        }

        function addSyncLog(message) {
            // Create a temporary log entry for immediate feedback
            const logDiv = document.getElementById('syncLog');
            const timestamp = new Date().toLocaleString();
            const tempEntry = `
                <div class="log-entry level-info">
                    <div class="log-timestamp">[${timestamp}] INFO - ui.action ✅</div>
                    <div class="log-message">${message}</div>
                </div>
            `;

            if (logDiv.innerHTML.includes('Loading')) {
                logDiv.innerHTML = tempEntry;
            } else {
                logDiv.innerHTML = tempEntry + logDiv.innerHTML;
            }

            // Reload logs after a short delay to get the actual logged data
            setTimeout(loadLogs, 1000);
        }
        
        function showError(message) {
            const indicator = document.getElementById('deviceIndicator');
            indicator.className = 'status-indicator status-disconnected';
            
            const infoDiv = document.getElementById('deviceInfo');
            infoDiv.innerHTML = `
                <div class="info-item">
                    <span>Error:</span>
                    <span style="color: #ef4444;">${message}</span>
                </div>
            `;
        }
        
        // Auto-import functions
        let autoImportStatus = {};
        
        async function loadAutoImportStatus() {
            try {
                const response = await fetch(appConfig.getApiUrl('auto-import/status'));
                autoImportStatus = await response.json();
                updateAutoImportDisplay();
            } catch (error) {
                console.error('Failed to load auto-import status:', error);
                showAutoImportError('Failed to load auto-import status');
            }
        }
        
        function updateAutoImportDisplay() {
            const indicator = document.getElementById('autoImportIndicator');
            const infoDiv = document.getElementById('autoImportInfo');
            
            if (autoImportStatus.enabled && autoImportStatus.task_status === 'running') {
                indicator.className = 'status-indicator status-connected';
                infoDiv.innerHTML = `
                    <div class="info-item">
                        <span>Status:</span>
                        <span style="color: #22c55e; font-weight: 500;">Active</span>
                    </div>
                    <div class="info-item">
                        <span>Import Interval:</span>
                        <span>${autoImportStatus.interval_minutes} minutes</span>
                    </div>
                    <div class="info-item">
                        <span>Next Import:</span>
                        <span>${autoImportStatus.next_import_estimate}</span>
                    </div>
                    <div class="info-item">
                        <span>Task Status:</span>
                        <span style="color: #22c55e;">${autoImportStatus.task_status}</span>
                    </div>
                `;
            } else {
                indicator.className = 'status-indicator status-disconnected';
                infoDiv.innerHTML = `
                    <div class="info-item">
                        <span>Status:</span>
                        <span style="color: #ef4444; font-weight: 500;">Inactive</span>
                    </div>
                    <div class="info-item">
                        <span>Task Status:</span>
                        <span style="color: #ef4444;">${autoImportStatus.task_status || 'stopped'}</span>
                    </div>
                    <div class="info-item">
                        <span>Configured Interval:</span>
                        <span>${autoImportStatus.interval_minutes || 30} minutes</span>
                    </div>
                `;
            }
        }
        
        async function triggerManualImport() {
            try {
                const indicator = document.getElementById('autoImportIndicator');
                indicator.className = 'status-indicator status-syncing';
                
                const response = await fetch(appConfig.getApiUrl('auto-import/trigger'), { method: 'POST' });
                const result = await response.json();
                
                if (result.success) {
                    addSyncLog(`Manual import successful: ${result.synced || 0} records synced`);
                    loadDeviceStatus();
                    loadAutoImportStatus();
                } else {
                    addSyncLog('Manual import failed: ' + result.message);
                }
            } catch (error) {
                addSyncLog('Manual import error: ' + error.message);
                loadAutoImportStatus();
            }
        }
        
        function refreshAutoImportStatus() {
            loadAutoImportStatus();
            addSyncLog('Auto-import status refreshed');
        }
        
        function showAutoImportError(message) {
            const indicator = document.getElementById('autoImportIndicator');
            indicator.className = 'status-indicator status-disconnected';
            
            const infoDiv = document.getElementById('autoImportInfo');
            infoDiv.innerHTML = `
                <div class="info-item">
                    <span>Error:</span>
                    <span style="color: #ef4444;">${message}</span>
                </div>
            `;
        }
        
        // Force cache refresh detection
        function checkForOldInterface() {
            const logControlsExists = document.getElementById('logLevel');
            const logStatsExists = document.getElementById('logStats');

            if (!logControlsExists || !logStatsExists) {
                console.log('Old interface detected, forcing page reload...');
                // Add timestamp to force reload
                const currentUrl = window.location.href.split('?')[0];
                window.location.href = currentUrl + '?v=' + Date.now();
                return false;
            }
            return true;
        }

        // Initialize page
        document.addEventListener('DOMContentLoaded', () => {
            // Check if we have the new interface
            if (!checkForOldInterface()) {
                return; // Will reload the page
            }

            loadDeviceStatus();
            loadAutoImportStatus();
            loadLogs();
            addSyncLog('Device status page loaded with new logging interface');

            // Auto-refresh every 30 seconds
            setInterval(() => {
                loadDeviceStatus();
                loadAutoImportStatus();
                loadLogs(); // Auto-refresh logs too
            }, 30000);
        });
    </script>
</body>
</html>
