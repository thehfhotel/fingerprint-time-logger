<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="version" content="v3.1-timezone-fix-20250927">
    <title>สถานะเครื่อง - ระบบบันทึกเวลาด้วยลายนิ้วมือ</title>
    <!-- CSS Files with cache busting -->
    <script>
        const cssTimestamp = Date.now();
        document.write(`<link rel="stylesheet" href="static/css/base.css?v=${cssTimestamp}">`);
    </script>

    <!-- JavaScript Files -->
    <script>
        const timestamp = Date.now();
        const version = 'v3.1-timezone-fix-20250927';
        document.write(`<script src="static/js/config.js?v=${timestamp}&version=${version}&bust=2"><\/script>`);
    </script>
    <style>
        .status-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
        }
        
        .status-card {
            background: white;
            border-radius: 8px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .status-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        
        .status-indicator {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        
        .status-connected { background-color: #22c55e; }
        .status-disconnected { background-color: #ef4444; }
        .status-syncing { background-color: #f59e0b; }
        
        .device-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin: 1rem 0;
        }
        
        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid #e5e7eb;
        }
        
        .action-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }
        
        
        .sync-log {
            max-height: 300px;
            overflow-y: auto;
            background-color: #f9fafb;
            padding: 1rem;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.875rem;
        }
        
        
        .loading {
            text-align: center;
            padding: 2rem;
            color: #6b7280;
        }

        .log-controls {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .log-controls select {
            padding: 0.25rem 0.5rem;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            font-size: 0.875rem;
        }

        .btn-sm {
            padding: 0.25rem 0.75rem;
            font-size: 0.875rem;
        }

        .log-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin: 1rem 0;
            padding: 1rem;
            background-color: #f9fafb;
            border-radius: 6px;
            font-size: 0.875rem;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1f2937;
        }

        .stat-label {
            color: #6b7280;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .log-entry {
            margin-bottom: 0.5rem;
            padding: 0.5rem;
            border-left: 3px solid #e5e7eb;
            background-color: #f9fafb;
            border-radius: 0 4px 4px 0;
        }

        .log-entry.level-error {
            border-left-color: #ef4444;
            background-color: #fef2f2;
        }

        .log-entry.level-warning {
            border-left-color: #f59e0b;
            background-color: #fffbeb;
        }

        .log-entry.level-info {
            border-left-color: #3b82f6;
            background-color: #eff6ff;
        }

        .log-timestamp {
            font-size: 0.75rem;
            color: #6b7280;
            margin-bottom: 0.25rem;
        }

        .log-message {
            font-family: inherit;
            font-size: 0.875rem;
            line-height: 1.4;
        }

        .log-details {
            font-size: 0.75rem;
            color: #6b7280;
            margin-top: 0.25rem;
        }

        /* Enhanced button states */
        .btn-loading {
            opacity: 0.8;
            cursor: not-allowed;
        }

        .btn-success-flash {
            background-color: var(--accent-green) !important;
            border-color: var(--accent-green) !important;
            animation: success-pulse 0.6s ease-out;
        }

        .btn-error-flash {
            background-color: var(--accent-red) !important;
            border-color: var(--accent-red) !important;
            animation: error-shake 0.6s ease-out;
        }

        @keyframes success-pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes error-shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* Spinner styling */
        .btn-spinner {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-text, .btn-spinner {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-row-1">
            <h1>สถานะเครื่องสแกน</h1>
        </div>
        <div class="header-row-2">
            <div class="header-actions">
                <a href="./" class="action-btn">📊 แดชบอร์ด</a>
                <a href="./device-status" class="action-btn" style="background: var(--accent-blue); color: white;">🔧 สถานะเครื่อง</a>
                <a href="./nickname-management" class="action-btn">👤 จัดการชื่อเล่น</a>
                <a href="/fingerprintlogs/individual-attendance" class="action-btn">📅 เข้า/ออก รายคน</a>
                <a href="./export" class="action-btn">📤 ส่งออกข้อมูล</a>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="status-container">
        <h1>สถานะเครื่อง ZKTeco</h1>
        
        <div class="status-card">
            <div class="status-header">
                <div class="status-indicator" id="deviceIndicator"></div>
                <h2>การเชื่อมต่อเครื่อง</h2>
            </div>
            
            <div class="device-info" id="deviceInfo">
                <div class="loading">กำลังโหลดข้อมูลเครื่อง...</div>
            </div>
            
            <div class="action-buttons">
                <button id="syncTimeBtn" class="btn btn-primary" onclick="syncTime()" aria-label="ซิงค์เวลาไปยังเครื่องสแกนลายนิ้วมือ" title="ซิงค์เวลาปัจจุบันไปยังเครื่องสแกนลายนิ้วมือ">
                    <span class="btn-text">🕒 ซิงค์เวลาไปยังเครื่อง</span>
                    <span class="btn-spinner" style="display: none;" aria-live="polite">⏳ กำลังซิงค์...</span>
                </button>
                <button class="btn btn-primary" onclick="importLogs()">นำเข้าบันทึกลายนิ้วมือ</button>
                <button class="btn btn-secondary" onclick="refreshStatus()">รีเฟรชสถานะ</button>
            </div>
        </div>
        
        <div class="status-card">
            <div class="status-header">
                <div class="status-indicator" id="autoImportIndicator"></div>
                <h2>บริการนำเข้าอัตโนมัติ</h2>
            </div>
            
            <div class="device-info" id="autoImportInfo">
                <div class="loading">กำลังโหลดสถานะการนำเข้าอัตโนมัติ...</div>
            </div>
            
            <div class="action-buttons">
                <button class="btn btn-primary" onclick="triggerManualImport()">นำเข้าทันที</button>
                <button class="btn btn-secondary" onclick="refreshAutoImportStatus()">รีเฟรชสถานะ</button>
            </div>
        </div>
        
        <div class="status-card">
            <div class="status-header">
                <h2>บันทึกการทำงาน <span style="font-size: 0.7em; color: #22c55e; font-weight: normal;">✓ v3.0</span></h2>
                <div class="log-controls">
                    <select id="logLevel" onchange="loadLogs()">
                        <option value="">ทุกระดับ</option>
                        <option value="ERROR">ข้อผิดพลาดเท่านั้น</option>
                        <option value="WARNING">คำเตือน</option>
                        <option value="INFO">ข้อมูล</option>
                    </select>
                    <select id="logCategory" onchange="loadLogs()">
                        <option value="">ทุกหมวดหมู่</option>
                        <option value="sync">การซิงค์ข้อมูล</option>
                        <option value="connection">การเชื่อมต่อเครื่อง</option>
                        <option value="api">คำขอ API</option>
                        <option value="system">เหตุการณ์ระบบ</option>
                        <option value="employee">การกระทำพนักงาน</option>
                    </select>
                    <button class="btn btn-secondary btn-sm" onclick="loadLogs()">🔄 รีเฟรช</button>
                    <button class="btn btn-secondary btn-sm" onclick="clearLogDisplay()">🗑️ ล้างการแสดงผล</button>
                </div>
            </div>
            <div class="log-stats" id="logStats">
                <div class="loading">กำลังโหลดสถิติบันทึก...</div>
            </div>
            <div class="sync-log" id="syncLog">
                <div class="loading">กำลังโหลดบันทึกการทำงาน...</div>
            </div>
        </div>
    </div>

    <script>
        let deviceStatus = {};
        
        async function loadDeviceStatus() {
            try {
                const response = await fetch(appConfig.getApiUrl('devices/health'));
                deviceStatus = await response.json();
                updateDeviceDisplay();
            } catch (error) {
                console.error('Failed to load device status:', error);
                showError('ไม่สามารถเชื่อมต่อเครื่องได้');
            }
        }
        
        function updateDeviceDisplay() {
            const indicator = document.getElementById('deviceIndicator');
            const infoDiv = document.getElementById('deviceInfo');
            
            if (deviceStatus.device_connected || deviceStatus.connected) {
                indicator.className = 'status-indicator status-connected';
                infoDiv.innerHTML = `
                    <div class="info-item">
                        <span>สถานะ:</span>
                        <span style="color: #22c55e; font-weight: 500;">เชื่อมต่อแล้ว</span>
                    </div>
                    <div class="info-item">
                        <span>ชื่อเครื่อง:</span>
                        <span>${deviceStatus.device_name || deviceStatus.model || 'ZKTeco Device'}</span>
                    </div>
                    <div class="info-item">
                        <span>ที่อยู่ IP:</span>
                        <span>${deviceStatus.ip || 'ไม่ทราบ'}</span>
                    </div>
                    <div class="info-item">
                        <span>หมายเลขเครื่อง:</span>
                        <span>${deviceStatus.serial || 'ไม่มีข้อมูล'}</span>
                    </div>
                    <div class="info-item">
                        <span>เวลาเครื่อง:</span>
                        <span>${deviceStatus.device_time || 'ไม่ทราบ'}</span>
                    </div>
                    <div class="info-item">
                        <span>จำนวนผู้ใช้:</span>
                        <span>${deviceStatus.users_count || 0}</span>
                    </div>
                    <div class="info-item">
                        <span>จำนวนบันทึก:</span>
                        <span>${deviceStatus.records_count || 0}</span>
                    </div>
                    <div class="info-item">
                        <span>ซิงค์ล่าสุด:</span>
                        <span>${deviceStatus.last_sync || 'ไม่เคย'}</span>
                    </div>
                `;
            } else {
                indicator.className = 'status-indicator status-disconnected';
                infoDiv.innerHTML = `
                    <div class="info-item">
                        <span>สถานะ:</span>
                        <span style="color: #ef4444; font-weight: 500;">ไม่ได้เชื่อมต่อ</span>
                    </div>
                    <div class="info-item">
                        <span>ข้อผิดพลาด:</span>
                        <span>${deviceStatus.error || 'ไม่สามารถเชื่อมต่อกับเครื่องได้'}</span>
                    </div>
                `;
            }
        }
        
        // Enhanced error messages in Thai
        const errorMessages = {
            'connection_failed': 'ไม่สามารถเชื่อมต่อกับเครื่องได้ กรุณาตรวจสอบการเชื่อมต่อ',
            'device_busy': 'เครื่องกำลังทำงานอยู่ กรุณารอสักครู่แล้วลองใหม่',
            'authentication_failed': 'การยืนยันตัวตนล้มเหลว กรุณาตรวจสอบรหัสผ่านเครื่อง',
            'timeout': 'การเชื่อมต่อหมดเวลา กรุณาลองใหม่อีกครั้ง'
        };

        function getLocalizedErrorMessage(error) {
            if (errorMessages[error]) {
                return errorMessages[error];
            }
            return `เกิดข้อผิดพลาด: ${error}`;
        }

        async function syncTime() {
            // Add confirmation for production safety
            if (!confirm('คุณต้องการซิงค์เวลาไปยังเครื่องหรือไม่?')) {
                return;
            }

            const btn = document.getElementById('syncTimeBtn');
            const btnText = btn.querySelector('.btn-text');
            const btnSpinner = btn.querySelector('.btn-spinner');

            try {
                // Show loading state
                btn.disabled = true;
                btnText.style.display = 'none';
                btnSpinner.style.display = 'inline-flex';
                btn.classList.add('btn-loading');

                const indicator = document.getElementById('deviceIndicator');
                indicator.className = 'status-indicator status-syncing';

                const response = await fetch(appConfig.getApiUrl('devices/sync-time'), { method: 'POST' });
                const result = await response.json();

                if (result.success) {
                    addSyncLog('การซิงค์เวลาสำเร็จ');
                    btn.classList.add('btn-success-flash');
                    setTimeout(() => btn.classList.remove('btn-success-flash'), 2000);
                    loadDeviceStatus();
                } else {
                    const errorMsg = getLocalizedErrorMessage(result.error || result.message);
                    addSyncLog('การซิงค์เวลาล้มเหลว: ' + errorMsg);
                    btn.classList.add('btn-error-flash');
                    setTimeout(() => btn.classList.remove('btn-error-flash'), 2000);
                }
            } catch (error) {
                const errorMsg = getLocalizedErrorMessage(error.message);
                addSyncLog('เกิดข้อผิดพลาดในการซิงค์เวลา: ' + errorMsg);
                btn.classList.add('btn-error-flash');
                setTimeout(() => btn.classList.remove('btn-error-flash'), 2000);
            } finally {
                // Reset button state
                btn.disabled = false;
                btnText.style.display = 'inline-flex';
                btnSpinner.style.display = 'none';
                btn.classList.remove('btn-loading');
                loadDeviceStatus();
            }
        }
        
        async function importLogs() {
            try {
                const indicator = document.getElementById('deviceIndicator');
                indicator.className = 'status-indicator status-syncing';
                
                const response = await fetch(appConfig.getApiUrl('attendance/sync'), { method: 'POST' });
                const result = await response.json();
                
                if (result.success) {
                    addSyncLog(`Import successful: ${result.imported_count || 0} records imported`);
                    loadDeviceStatus();
                } else {
                    addSyncLog('การนำเข้าล้มเหลว: ' + result.message);
                }
            } catch (error) {
                addSyncLog('ข้อผิดพลาดการนำเข้า: ' + error.message);
                loadDeviceStatus();
            }
        }
        
        function refreshStatus() {
            loadDeviceStatus();
            addSyncLog('รีเฟรชสถานะแล้ว');
        }
        
        async function loadLogs() {
            try {
                const level = document.getElementById('logLevel').value;
                const category = document.getElementById('logCategory').value;

                // Build query parameters
                const params = new URLSearchParams({
                    limit: '100',
                    hours_back: '168' // 1 week
                });

                if (level) params.append('level', level);
                if (category) params.append('category', category);

                const response = await fetch(appConfig.getApiUrl(`system/logs?${params}`));
                const data = await response.json();

                displayLogs(data.logs || []);
                displayLogStats(data.summary || {});

            } catch (error) {
                console.error('Failed to load logs:', error);
                const logDiv = document.getElementById('syncLog');
                logDiv.innerHTML = '<div class="log-entry level-error">ไม่สามารถโหลดบันทึกได้: ' + error.message + '</div>';
            }
        }

        function displayLogs(logs) {
            const logDiv = document.getElementById('syncLog');

            if (logs.length === 0) {
                logDiv.innerHTML = '<div class="log-entry">ไม่พบบันทึกที่ตรงกับตัวกรองปัจจุบัน</div>';
                return;
            }

            const logEntries = logs.map(log => {
                // TIMEZONE FIX 20250927: Ensure timestamp is treated as UTC by adding Z suffix if missing
                const utcTimestamp = log.timestamp.endsWith('Z') ? log.timestamp : log.timestamp + 'Z';
                const timestamp = new Date(utcTimestamp).toLocaleString('th-TH', {
                    timeZone: 'Asia/Bangkok',
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: false
                });
                const levelClass = `level-${log.level.toLowerCase()}`;

                let details = '';
                if (log.details && Object.keys(log.details).length > 0) {
                    details = `<div class="log-details">รายละเอียด: ${JSON.stringify(log.details)}</div>`;
                }

                let badge = '';
                if (log.employee_badge) {
                    details += `<div class="log-details">พนักงาน: ${log.employee_badge}</div>`;
                }

                let duration = '';
                if (log.duration_ms) {
                    details += `<div class="log-details">ระยะเวลา: ${log.duration_ms}ms</div>`;
                }

                const successIcon = log.success === true ? '✅' : log.success === false ? '❌' : '';

                return `
                    <div class="log-entry ${levelClass}">
                        <div class="log-timestamp">[${timestamp}] ${log.level} - ${log.category}.${log.action} ${successIcon}</div>
                        <div class="log-message">${log.message}</div>
                        ${details}
                    </div>
                `;
            }).join('');

            logDiv.innerHTML = logEntries;
        }

        function displayLogStats(summary) {
            const statsDiv = document.getElementById('logStats');

            if (!summary || summary.error) {
                statsDiv.innerHTML = '<div class="loading">สถิติบันทึกไม่พร้อมใช้งาน</div>';
                return;
            }

            const healthColor = summary.health_status === 'good' ? '#22c55e' :
                              summary.health_status === 'warning' ? '#f59e0b' : '#ef4444';

            statsDiv.innerHTML = `
                <div class="stat-item">
                    <div class="stat-value">${summary.total_logs || 0}</div>
                    <div class="stat-label">บันทึกทั้งหมด</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" style="color: #ef4444;">${summary.recent_errors || 0}</div>
                    <div class="stat-label">ข้อผิดพลาด</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" style="color: #f59e0b;">${summary.recent_warnings || 0}</div>
                    <div class="stat-label">คำเตือน</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" style="color: ${healthColor};">${summary.health_status || 'ไม่ทราบ'}</div>
                    <div class="stat-label">สุขภาพระบบ</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">${summary.category_counts?.sync || 0}</div>
                    <div class="stat-label">เหตุการณ์ซิงค์</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">${summary.category_counts?.connection || 0}</div>
                    <div class="stat-label">การเชื่อมต่อ</div>
                </div>
            `;
        }

        function clearLogDisplay() {
            const logDiv = document.getElementById('syncLog');
            logDiv.innerHTML = '<div class="loading">ล้างการแสดงผลแล้ว คลิกรีเฟรชเพื่อโหลดบันทึกใหม่</div>';
        }

        function addSyncLog(message) {
            // Create a temporary log entry for immediate feedback
            const logDiv = document.getElementById('syncLog');
            const timestamp = new Date().toLocaleString('th-TH', {
                timeZone: 'Asia/Bangkok',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });
            const tempEntry = `
                <div class="log-entry level-info">
                    <div class="log-timestamp">[${timestamp}] INFO - ui.action ✅</div>
                    <div class="log-message">${message}</div>
                </div>
            `;

            if (logDiv.innerHTML.includes('กำลังโหลด')) {
                logDiv.innerHTML = tempEntry;
            } else {
                logDiv.innerHTML = tempEntry + logDiv.innerHTML;
            }

            // Reload logs after a short delay to get the actual logged data
            setTimeout(loadLogs, 1000);
        }
        
        function showError(message) {
            const indicator = document.getElementById('deviceIndicator');
            indicator.className = 'status-indicator status-disconnected';
            
            const infoDiv = document.getElementById('deviceInfo');
            infoDiv.innerHTML = `
                <div class="info-item">
                    <span>Error:</span>
                    <span style="color: #ef4444;">${message}</span>
                </div>
            `;
        }
        
        // Auto-import functions
        let autoImportStatus = {};
        
        async function loadAutoImportStatus() {
            try {
                const response = await fetch(appConfig.getApiUrl('auto-import/status'));
                autoImportStatus = await response.json();
                updateAutoImportDisplay();
            } catch (error) {
                console.error('Failed to load auto-import status:', error);
                showAutoImportError('ไม่สามารถโหลดสถานะการนำเข้าอัตโนมัติได้');
            }
        }
        
        function updateAutoImportDisplay() {
            const indicator = document.getElementById('autoImportIndicator');
            const infoDiv = document.getElementById('autoImportInfo');
            
            if (autoImportStatus.enabled && autoImportStatus.task_status === 'running') {
                indicator.className = 'status-indicator status-connected';
                infoDiv.innerHTML = `
                    <div class="info-item">
                        <span>สถานะ:</span>
                        <span style="color: #22c55e; font-weight: 500;">ทำงาน</span>
                    </div>
                    <div class="info-item">
                        <span>ช่วงเวลานำเข้า:</span>
                        <span>${autoImportStatus.interval_minutes} นาที</span>
                    </div>
                    <div class="info-item">
                        <span>การนำเข้าครั้งต่อไป:</span>
                        <span>${autoImportStatus.next_import_estimate}</span>
                    </div>
                    <div class="info-item">
                        <span>สถานะงาน:</span>
                        <span style="color: #22c55e;">${autoImportStatus.task_status}</span>
                    </div>
                `;
            } else {
                indicator.className = 'status-indicator status-disconnected';
                infoDiv.innerHTML = `
                    <div class="info-item">
                        <span>สถานะ:</span>
                        <span style="color: #ef4444; font-weight: 500;">ไม่ทำงาน</span>
                    </div>
                    <div class="info-item">
                        <span>สถานะงาน:</span>
                        <span style="color: #ef4444;">${autoImportStatus.task_status || 'หยุด'}</span>
                    </div>
                    <div class="info-item">
                        <span>ช่วงเวลาที่ตั้งค่า:</span>
                        <span>${autoImportStatus.interval_minutes || 30} นาที</span>
                    </div>
                `;
            }
        }
        
        async function triggerManualImport() {
            try {
                const indicator = document.getElementById('autoImportIndicator');
                indicator.className = 'status-indicator status-syncing';
                
                const response = await fetch(appConfig.getApiUrl('auto-import/trigger'), { method: 'POST' });
                const result = await response.json();
                
                if (result.success) {
                    addSyncLog(`นำเข้าแบบแมนวลสำเร็จ: ซิงค์แล้ว ${result.synced || 0} บันทึก`);
                    loadDeviceStatus();
                    loadAutoImportStatus();
                } else {
                    addSyncLog('นำเข้าแบบแมนวลล้มเหลว: ' + result.message);
                }
            } catch (error) {
                addSyncLog('เกิดข้อผิดพลาดในการนำเข้าแบบแมนวล: ' + error.message);
                loadAutoImportStatus();
            }
        }
        
        function refreshAutoImportStatus() {
            loadAutoImportStatus();
            addSyncLog('Auto-import status refreshed');
        }
        
        function showAutoImportError(message) {
            const indicator = document.getElementById('autoImportIndicator');
            indicator.className = 'status-indicator status-disconnected';
            
            const infoDiv = document.getElementById('autoImportInfo');
            infoDiv.innerHTML = `
                <div class="info-item">
                    <span>Error:</span>
                    <span style="color: #ef4444;">${message}</span>
                </div>
            `;
        }
        
        // Force cache refresh detection
        function checkForOldInterface() {
            const logControlsExists = document.getElementById('logLevel');
            const logStatsExists = document.getElementById('logStats');

            if (!logControlsExists || !logStatsExists) {
                console.log('Old interface detected, forcing page reload...');
                // Add timestamp to force reload
                const currentUrl = window.location.href.split('?')[0];
                window.location.href = currentUrl + '?v=' + Date.now();
                return false;
            }
            return true;
        }

        // Initialize page
        document.addEventListener('DOMContentLoaded', () => {
            // Check if we have the new interface
            if (!checkForOldInterface()) {
                return; // Will reload the page
            }

            loadDeviceStatus();
            loadAutoImportStatus();
            loadLogs();
            addSyncLog('โหลดหน้าสถานะเครื่องพร้อมอินเทอร์เฟซบันทึกใหม่');

            // Auto-refresh every 10 minutes to reduce device connection frequency
            setInterval(() => {
                loadDeviceStatus();
                loadAutoImportStatus();
                loadLogs(); // Auto-refresh logs too
            }, 600000); // 10 minutes to reduce device connection frequency
        });
    </script>
</body>
</html>
