<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>จัดการชื่อเล่นพนักงาน - ระบบบันทึกเวลาด้วยลายนิ้วมือ</title>
    <!-- CSS Files with cache busting -->
    <script>
        const cssTimestamp = Date.now();
        document.write(`<link rel="stylesheet" href="static/css/base.css?v=${cssTimestamp}">`);
        document.write(`<link rel="stylesheet" href="static/css/modal.css?v=${cssTimestamp}">`);
    </script>

    <!-- JavaScript Files -->
    <script>
        const timestamp = Date.now();
        const randomId = Math.random().toString(36).substring(7);
        const buildNumber = '2025011801'; // Build timestamp - FORCE CACHE BREAK v3.0
        const version = `v3.0-https-fix-${buildNumber}`;
        const cacheBuster = `${timestamp}.${randomId}&build=${buildNumber}`;
        document.write(`<script src="static/js/config.js?v=${cacheBuster}&version=${version}&force=${Date.now()}"><\/script>`);
    </script>
    <style>
        .nickname-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1.5rem;
            background: var(--primary-white);
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 1px 3px var(--shadow-light);
        }

        .nickname-table th,
        .nickname-table td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid var(--border-light);
        }

        .nickname-table th {
            background-color: var(--bg-tertiary);
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.875rem;
        }

        .nickname-table tr:hover {
            background-color: var(--bg-secondary);
        }

        .nickname-input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .nickname-input:focus {
            outline: none;
            border-color: #007bff;
        }

        .search-box {
            margin-bottom: 20px;
        }

        .search-input {
            width: 300px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .success-message {
            color: #28a745;
            font-size: 12px;
            margin-left: 10px;
            display: none;
        }

        .error-message {
            color: #dc3545;
            font-size: 12px;
            margin-left: 10px;
            display: none;
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-active {
            background-color: #d4edda;
            color: #155724;
        }

        .status-inactive {
            background-color: #f8d7da;
            color: #721c24;
        }

        .status-hidden {
            background-color: #e2e3e5;
            color: #383d41;
        }

        .btn.inactive {
            background: var(--text-muted) !important;
            border-color: var(--text-muted) !important;
        }

        .btn.hidden {
            background: var(--accent-orange) !important;
            border-color: var(--accent-orange) !important;
            color: var(--text-primary) !important;
        }

        .btn.active {
            background: var(--accent-blue) !important;
            border-color: var(--accent-blue) !important;
            color: var(--primary-white) !important;
        }

        /* Employee source type tags */
        .source-tag {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 8px;
            vertical-align: middle;
        }

        .source-tag-zkdevice {
            background-color: #e3f2fd;
            color: #1565c0;
            border: 1px solid #90caf9;
        }

        .source-tag-database {
            background-color: #fff3e0;
            color: #e65100;
            border: 1px solid #ffb74d;
        }

        /* Delete button styling */
        .btn-delete {
            background-color: #dc3545 !important;
            border-color: #dc3545 !important;
            color: white !important;
            padding: 6px 12px;
            font-size: 13px;
            margin-top: 5px;
        }

        .btn-delete:hover {
            background-color: #c82333 !important;
            border-color: #bd2130 !important;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-row-1">
            <h1>จัดการชื่อเล่นพนักงาน</h1>
        </div>
        <div class="header-row-2">
            <div class="header-actions">
                <a href="/fingerprintlogs/admin-console" class="action-btn" style="background: var(--accent-blue); color: white;">← กลับสู่คอนโซลผู้ดูแล</a>
            </div>
        </div>
    </div>

    <div class="container">
            <div class="card">
                <div class="card-header">
                    <h2>จัดการชื่อเล่นพนักงาน</h2>
                    <button id="adminModeBtn" class="btn btn-primary" onclick="activateAdminMode()" style="float: right; margin-top: -10px;">
                        🔐 จัดการรหัสเชื่อมต่อ LINE
                    </button>
                </div>
                <div class="card-body">
                    <div class="search-box">
                        <input type="text" id="searchInput" class="search-input" placeholder="ค้นหาด้วยหมายเลขบัตรหรือชื่อเล่น...">
                        <button id="showHiddenBtn" class="btn btn-secondary" onclick="toggleShowHidden()">แสดงที่ซ่อน</button>
                        <button id="addEmployeeBtn" class="btn btn-primary" onclick="showAddEmployeeModal()" style="margin-left: 10px;">➕ เพิ่มพนักงานใหม่</button>
                    </div>

                    <!-- Admin Mode Panel (Hidden by default) -->
                    <div id="adminPanel" style="display: none; margin-bottom: 20px; padding: 20px; background: #f8f9fa; border-radius: 6px; border: 2px solid #007bff;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                            <h3 style="margin: 0; color: #007bff;">🔐 โหมดผู้ดูแลระบบ - จัดการรหัสเชื่อมต่อ LINE</h3>
                            <button class="btn btn-secondary" onclick="deactivateAdminMode()">ออกจากโหมดผู้ดูแล</button>
                        </div>
                        <div id="adminStats" style="margin-bottom: 15px; padding: 10px; background: white; border-radius: 4px;">
                            กำลังโหลดสถิติ...
                        </div>
                        <div style="margin-bottom: 10px;">
                            <button class="btn btn-primary" onclick="showPendingCodes()">📋 รหัสที่รอเชื่อมต่อ</button>
                            <button class="btn btn-success" onclick="showLinkedAccounts()">✅ บัญชีที่เชื่อมต่อแล้ว</button>
                            <button class="btn btn-secondary" onclick="refreshAdminData()">🔄 รีเฟรชข้อมูล</button>
                        </div>
                    </div>
                    
                    <div id="loadingDiv" class="loading">กำลังโหลดข้อมูลพนักงาน...</div>
                    
                    <table class="nickname-table" id="nicknameTable" style="display: none;">
                        <thead>
                            <tr>
                                <th>หมายเลขบัตร</th>
                                <th>ชื่อเล่น</th>
                                <th>สถานะ</th>
                                <th>การแสดงผล</th>
                                <th>การดำเนินการ</th>
                                <th id="lineCodeHeader" style="display: none;">🔐 รหัสเชื่อมต่อ LINE</th>
                            </tr>
                        </thead>
                        <tbody id="nicknameTableBody">
                            <!-- Table rows will be populated here -->
                        </tbody>
                    </table>
                </div>
            </div>
    </div>

    <script>
        /**
         * Escape HTML-special characters to prevent stored XSS via innerHTML.
         * Use anywhere server-supplied strings are interpolated into HTML.
         */
        function escapeHtml(value) {
            return String(value == null ? '' : value).replace(/[&<>"']/g, function(c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        /**
         * Escape a value for safe inclusion inside a single-quoted JS string literal
         * that itself sits inside an HTML attribute (e.g. onclick="foo('${val}')").
         * Double-encoding is necessary: first JS-escape, then HTML-escape because the
         * containing attribute is double-quoted.
         */
        function escapeJsInAttr(value) {
            const jsEscaped = String(value == null ? '' : value)
                .replace(/\\/g, '\\\\')
                .replace(/'/g, "\\'")
                .replace(/\r/g, '\\r')
                .replace(/\n/g, '\\n');
            return escapeHtml(jsEscaped);
        }

        let employees = [];
        let showHidden = false;

        // Load employees on page load
        async function loadEmployees() {
            try {
                // Ensure config is loaded first
                await appConfig.loadConfig();

                // Fetch employees from both ZK device and database
                const params = new URLSearchParams({
                    from_device: 'true',  // Fetch from ZK device
                    include_hidden: showHidden.toString()
                });

                const deviceUrl = appConfig.getApiUrl(`employees/?${params}`);
                console.log('Loading employees from device:', deviceUrl);
                const deviceResponse = await fetch(deviceUrl);
                if (!deviceResponse.ok) throw new Error('โหลดข้อมูลพนักงานจากเครื่อง ZK ไม่สำเร็จ');

                const deviceData = await deviceResponse.json();
                const deviceEmployees = deviceData.employees || [];

                // Also fetch database-only employees (not from device)
                const dbParams = new URLSearchParams({
                    from_device: 'false',  // Fetch from database only
                    include_hidden: showHidden.toString()
                });

                const dbUrl = appConfig.getApiUrl(`employees/?${dbParams}`);
                console.log('Loading employees from database:', dbUrl);
                const dbResponse = await fetch(dbUrl);
                if (!dbResponse.ok) throw new Error('โหลดข้อมูลพนักงานจากฐานข้อมูลไม่สำเร็จ');

                const dbData = await dbResponse.json();
                const dbEmployees = dbData.employees || [];

                // Merge employees: ZK device users + database-only users (exclude duplicates)
                const deviceBadges = new Set(deviceEmployees.map(e => e.badge_number));
                const dbOnlyEmployees = dbEmployees.filter(e => !deviceBadges.has(e.badge_number));

                // Mark database-only employees
                dbOnlyEmployees.forEach(emp => {
                    emp.in_database = true;
                    emp.from_database_only = true;  // Flag for special display
                });

                employees = [...deviceEmployees, ...dbOnlyEmployees];

                // Sort by badge number (numeric sort)
                employees.sort((a, b) => {
                    const numA = parseInt(a.badge_number);
                    const numB = parseInt(b.badge_number);
                    if (!isNaN(numA) && !isNaN(numB)) {
                        return numA - numB;
                    }
                    return a.badge_number.localeCompare(b.badge_number);
                });

                displayEmployees(employees);
                document.getElementById('loadingDiv').style.display = 'none';
                document.getElementById('nicknameTable').style.display = 'table';
            } catch (error) {
                console.error('Error loading employees:', error);
                document.getElementById('loadingDiv').innerHTML = 'โหลดข้อมูลพนักงานไม่สำเร็จ: ' + error.message;
            }
        }

        // Display employees in table
        function displayEmployees(employeeList) {
            const tbody = document.getElementById('nicknameTableBody');
            tbody.innerHTML = '';
            
            employeeList.forEach(employee => {
                const row = document.createElement('tr');
                const statusClass = employee.is_active ? 'status-active' : 'status-inactive';
                const statusText = employee.is_active ? 'ใช้งาน' : 'ไม่ใช้งาน';
                const hiddenClass = employee.is_hidden ? 'status-hidden' : 'status-active';
                const hiddenText = employee.is_hidden ? 'ซ่อน' : 'แสดง';
                
                // Generate source type badge tag
                let sourceTag = '';
                if (employee.from_database_only) {
                    // Database-only employee (manually created, not from ZK device)
                    sourceTag = '<span class="source-tag source-tag-database" title="สร้างด้วยมือ - ไม่ได้มาจากเครื่อง ZK">DATABASE</span>';
                } else {
                    // From ZK device
                    sourceTag = '<span class="source-tag source-tag-zkdevice" title="ซิงค์จากเครื่อง ZKTeco">ZKDEVICE</span>';
                }
                
                // LINE code column content (only in admin mode)
                let lineCodeCell = '';
                if (adminMode) {
                    const safeBadgeForJs = escapeJsInAttr(employee.badge_number);
                    if (employee.line_user_id) {
                        // Already linked - allow re-linking with new code
                        lineCodeCell = `
                            <td>
                                <span style="color: #28a745; font-weight: bold;">✅ เชื่อมต่อแล้ว</span><br>
                                <span style="font-size: 12px; color: #666;">${escapeHtml(employee.line_display_name || 'N/A')}</span><br>
                                <button class="btn btn-primary" style="font-size: 12px; margin-top: 5px;"
                                        onclick="generateLinkingCode('${safeBadgeForJs}')">
                                    🔄 สร้างรหัสเชื่อมต่อใหม่
                                </button>
                            </td>
                        `;
                    } else if (employee.line_linking_code) {
                        // Has code, waiting for link
                        lineCodeCell = `
                            <td>
                                <span style="color: #007bff; font-weight: bold; font-size: 18px;">${escapeHtml(employee.line_linking_code)}</span><br>
                                <span style="font-size: 12px; color: #666;">รอพนักงานเชื่อมต่อ</span><br>
                                <button class="btn btn-secondary" style="font-size: 12px; margin-top: 5px;"
                                        onclick="regenerateLinkingCode('${safeBadgeForJs}')">
                                    สร้างรหัสใหม่
                                </button>
                            </td>
                        `;
                    } else {
                        // No code yet
                        lineCodeCell = `
                            <td>
                                <button class="btn btn-primary"
                                        onclick="generateLinkingCode('${safeBadgeForJs}')">
                                    สร้างรหัสเชื่อมต่อ
                                </button>
                            </td>
                        `;
                    }
                }

                const safeBadge = escapeHtml(employee.badge_number);
                const safeDisplayName = escapeHtml(employee.display_name || '');
                const safeBadgeForJs = escapeJsInAttr(employee.badge_number);
                const safeDisplayNameForJs = escapeJsInAttr(employee.display_name || '');

                row.innerHTML = `
                    <td>${safeBadge}${sourceTag}</td>
                    <td>
                        <input type="text"
                               class="nickname-input"
                               id="nickname-${safeBadge}"
                               value="${safeDisplayName}"
                               data-original="${safeDisplayName}"
                               placeholder="${employee.in_database ? 'ใส่ชื่อเล่น' : 'ใส่ชื่อเล่น (จะสร้างข้อมูลพนักงาน)'}">
                    </td>
                    <td>
                        <button class="btn btn-secondary toggle-btn ${employee.is_active ? '' : 'inactive'}"
                                onclick="toggleStatus('${safeBadgeForJs}', ${!employee.is_active})">
                            ${employee.is_active ? 'ตั้งเป็นไม่ใช้งาน' : 'ตั้งเป็นใช้งาน'}
                        </button>
                        <span class="status-badge ${statusClass}">${statusText}</span>
                    </td>
                    <td>
                        <button class="btn btn-secondary toggle-btn ${employee.is_hidden ? 'hidden' : ''}"
                                onclick="toggleHidden('${safeBadgeForJs}', ${!employee.is_hidden})">
                            ${employee.is_hidden ? 'แสดง' : 'ซ่อน'}
                        </button>
                        <span class="status-badge ${hiddenClass}">${hiddenText}</span>
                    </td>
                    <td>
                        <button class="btn btn-primary save-btn"
                                onclick="saveNickname('${safeBadgeForJs}')"
                                id="save-${safeBadge}"
                                disabled>
                            ${employee.in_database ? 'บันทึก' : 'สร้างและบันทึก'}
                        </button>
                        ${employee.from_database_only ?
                            `<br><button class="btn btn-delete" onclick="deleteEmployee('${safeBadgeForJs}', '${safeDisplayNameForJs}')">🗑️ ลบ</button>`
                            : ''}
                        <span class="success-message" id="success-${safeBadge}">บันทึกแล้ว!</span>
                        <span class="error-message" id="error-${safeBadge}">บันทึกไม่สำเร็จ</span>
                    </td>
                    ${lineCodeCell}
                `;
                tbody.appendChild(row);
                
                // Add event listener for input changes
                const input = document.getElementById(`nickname-${employee.badge_number}`);
                input.addEventListener('input', function() {
                    const saveBtn = document.getElementById(`save-${employee.badge_number}`);
                    saveBtn.disabled = this.value === this.getAttribute('data-original');
                });
            });
        }

        // Save nickname
        async function saveNickname(badgeNumber) {
            const input = document.getElementById(`nickname-${badgeNumber}`);
            const saveBtn = document.getElementById(`save-${badgeNumber}`);
            const successMsg = document.getElementById(`success-${badgeNumber}`);
            const errorMsg = document.getElementById(`error-${badgeNumber}`);
            
            saveBtn.disabled = true;
            successMsg.style.display = 'none';
            errorMsg.style.display = 'none';
            
            try {
                // Ensure config is loaded first
                await appConfig.loadConfig();

                const response = await fetch(appConfig.getApiUrl(`employees/${badgeNumber}/nickname`), {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        nickname: input.value
                    })
                });
                
                if (!response.ok) throw new Error('บันทึกชื่อเล่นไม่สำเร็จ');
                
                // Update the original value
                input.setAttribute('data-original', input.value);
                
                // Show success message
                successMsg.style.display = 'inline';
                setTimeout(() => {
                    successMsg.style.display = 'none';
                }, 3000);
                
                // Update the employee in our local array
                const employee = employees.find(e => e.badge_number === badgeNumber);
                if (employee) {
                    employee.display_name = input.value;
                    employee.in_database = true; // Now in database
                }
                
                // Check if employee was created
                const result = await response.json();
                if (result.created) {
                    // Update button text since employee is now in database
                    saveBtn.textContent = 'บันทึก';
                    // Refresh the row to remove the "not in database" indicator
                    displayEmployees(getFilteredEmployees());
                }
            } catch (error) {
                console.error('Error saving nickname:', error);
                errorMsg.style.display = 'inline';
                setTimeout(() => {
                    errorMsg.style.display = 'none';
                }, 3000);
                
                // Re-enable save button if there's still a change
                if (input.value !== input.getAttribute('data-original')) {
                    saveBtn.disabled = false;
                }
            }
        }

        // Toggle employee status (active/inactive)
        async function toggleStatus(badgeNumber, newStatus) {
            try {
                // Ensure config is loaded first
                await appConfig.loadConfig();

                const response = await fetch(appConfig.getApiUrl(`employees/${badgeNumber}/status`), {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        is_active: newStatus
                    })
                });
                
                if (!response.ok) throw new Error('อัปเดตสถานะไม่สำเร็จ');
                
                // Update the employee in our local array
                const employee = employees.find(e => e.badge_number === badgeNumber);
                if (employee) {
                    employee.is_active = newStatus;
                }
                
                // Refresh the display
                displayEmployees(getFilteredEmployees());
            } catch (error) {
                console.error('Error updating status:', error);
                alert('อัปเดตสถานะพนักงานไม่สำเร็จ');
            }
        }

        // Toggle employee hidden status
        async function toggleHidden(badgeNumber, newHiddenStatus) {
            try {
                // Ensure config is loaded first
                await appConfig.loadConfig();

                const response = await fetch(appConfig.getApiUrl(`employees/${badgeNumber}/hidden`), {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        is_hidden: newHiddenStatus
                    })
                });
                
                if (!response.ok) throw new Error('อัปเดตสถานะการซ่อนไม่สำเร็จ');

                // Update the employee in our local array
                const employee = employees.find(e => e.badge_number === badgeNumber);
                if (employee) {
                    employee.is_hidden = newHiddenStatus;
                }

                // Refresh the display with filtered employees
                displayEmployees(getFilteredEmployees());
            } catch (error) {
                console.error('Error updating hidden status:', error);
                alert('อัปเดตสถานะการซ่อนพนักงานไม่สำเร็จ');
            }
        }

        // Delete employee (database-only employees)
        async function deleteEmployee(badgeNumber, displayName) {
            if (!confirm(`คุณต้องการลบพนักงาน "${displayName}" (เลขบัตร: ${badgeNumber}) ใช่หรือไม่?\n\n⚠️ การลบนี้ไม่สามารถย้อนกลับได้`)) {
                return;
            }

            try {
                await appConfig.loadConfig();

                const response = await fetch(appConfig.getApiUrl(`employees/${badgeNumber}`), {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    const error = await response.json();
                    alert(`ลบพนักงานไม่สำเร็จ: ${error.detail || 'เกิดข้อผิดพลาด'}`);
                    return;
                }

                const result = await response.json();
                alert(result.message || 'ลบพนักงานสำเร็จแล้ว');

                // Remove employee from local array
                employees = employees.filter(e => e.badge_number !== badgeNumber);

                // Refresh the display
                displayEmployees(getFilteredEmployees());
            } catch (error) {
                console.error('Error deleting employee:', error);
                alert('เกิดข้อผิดพลาดในการลบพนักงาน กรุณาลองใหม่อีกครั้ง');
            }
        }

        // Toggle show hidden employees
        function toggleShowHidden() {
            showHidden = !showHidden;
            const btn = document.getElementById('showHiddenBtn');

            if (showHidden) {
                btn.textContent = 'ซ่อนที่ซ่อน';
                btn.classList.add('active');
            } else {
                btn.textContent = 'แสดงที่ซ่อน';
                btn.classList.remove('active');
            }

            loadEmployees();
        }

        // Get filtered employees based on search and hidden status
        function getFilteredEmployees() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();

            return employees.filter(employee => {
                // Filter by search term
                const badgeMatch = employee.badge_number.toLowerCase().includes(searchTerm);
                const nameMatch = (employee.display_name || '').toLowerCase().includes(searchTerm);
                const searchMatch = badgeMatch || nameMatch;

                // Filter by hidden status
                const hiddenMatch = showHidden || !employee.is_hidden;

                return searchMatch && hiddenMatch;
            });
        }

        // Search functionality
        document.getElementById('searchInput').addEventListener('input', function() {
            displayEmployees(getFilteredEmployees());
        });

        // Load employees when page loads
        loadEmployees();

        // ============================================================================
        // ADMIN MODE FUNCTIONALITY
        // ============================================================================

        let adminMode = false;

        // Activate admin mode (no password required - already authenticated via admin console)
        async function activateAdminMode() {
            try {
                await appConfig.loadConfig();

                adminMode = true;

                // Show admin panel
                document.getElementById('adminPanel').style.display = 'block';
                document.getElementById('lineCodeHeader').style.display = 'table-cell';
                document.getElementById('adminModeBtn').style.display = 'none';

                // Load admin stats
                await loadAdminStats();

                // Refresh display to show LINE code column
                displayEmployees(getFilteredEmployees());
            } catch (error) {
                console.error('Error activating admin mode:', error);
                alert('เกิดข้อผิดพลาดในการเข้าสู่โหมดจัดการรหัสเชื่อมต่อ LINE');
            }
        }

        // Deactivate admin mode
        function deactivateAdminMode() {
            adminMode = false;

            document.getElementById('adminPanel').style.display = 'none';
            document.getElementById('lineCodeHeader').style.display = 'none';
            document.getElementById('adminModeBtn').style.display = 'inline-block';

            // Refresh display to hide LINE code column
            displayEmployees(getFilteredEmployees());
        }

        // Load admin statistics
        async function loadAdminStats() {
            try {
                await appConfig.loadConfig();

                const response = await fetch(
                    appConfig.getApiUrl('admin/line-codes/stats'),
                    {
                        credentials: 'include'
                    }
                );

                if (!response.ok) throw new Error('Failed to load stats');

                const stats = await response.json();

                document.getElementById('adminStats').innerHTML = `
                    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px;">
                        <div style="text-align: center;">
                            <div style="font-size: 24px; font-weight: bold; color: #007bff;">${stats.total_active_employees}</div>
                            <div style="font-size: 12px; color: #666;">พนักงานทั้งหมด</div>
                        </div>
                        <div style="text-align: center;">
                            <div style="font-size: 24px; font-weight: bold; color: #28a745;">${stats.linked_accounts}</div>
                            <div style="font-size: 12px; color: #666;">เชื่อมต่อแล้ว</div>
                        </div>
                        <div style="text-align: center;">
                            <div style="font-size: 24px; font-weight: bold; color: #ffc107;">${stats.pending_codes}</div>
                            <div style="font-size: 12px; color: #666;">รอเชื่อมต่อ</div>
                        </div>
                        <div style="text-align: center;">
                            <div style="font-size: 24px; font-weight: bold; color: #dc3545;">${stats.unlinked}</div>
                            <div style="font-size: 12px; color: #666;">ยังไม่สร้างรหัส</div>
                        </div>
                    </div>
                    <div style="margin-top: 10px; text-align: center; font-size: 14px; color: #666;">
                        เชื่อมต่อแล้ว: ${stats.linking_percentage}%
                    </div>
                `;
            } catch (error) {
                console.error('Error loading admin stats:', error);
                document.getElementById('adminStats').innerHTML = '<div style="color: red;">โหลดสถิติไม่สำเร็จ</div>';
            }
        }

        // Generate LINE linking code (handles both new and re-linking)
        async function generateLinkingCode(badgeNumber) {
            try {
                await appConfig.loadConfig();

                const response = await fetch(appConfig.getApiUrl('admin/line-codes/generate'), {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        badge_number: badgeNumber
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    alert(`เกิดข้อผิดพลาด: ${error.detail}`);
                    return;
                }

                const result = await response.json();

                // Show different messages for new link vs re-link
                let message = `รหัสเชื่อมต่อ LINE สำหรับ ${result.display_name}:\n\n${result.linking_code}\n\n(หมดอายุใน 24 ชั่วโมง)`;

                if (result.is_relink) {
                    message = `🔄 ยกเลิกการเชื่อมต่อเดิม\n(${result.old_line_display_name})\n\nรหัสใหม่สำหรับ ${result.display_name}:\n\n${result.linking_code}\n\n(หมดอายุใน 24 ชั่วโมง)`;
                }

                alert(message);

                // Refresh admin stats
                await loadAdminStats();

                // Refresh display
                displayEmployees(getFilteredEmployees());
            } catch (error) {
                console.error('Error generating code:', error);
                alert('เกิดข้อผิดพลาดในการสร้างรหัสเชื่อมต่อ');
            }
        }

        // Regenerate LINE linking code
        async function regenerateLinkingCode(badgeNumber) {
            if (!confirm('คุณต้องการสร้างรหัสใหม่ใช่หรือไม่? รหัสเก่าจะถูกลบทิ้ง')) return;

            try {
                await appConfig.loadConfig();

                const response = await fetch(appConfig.getApiUrl('admin/line-codes/regenerate'), {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        badge_number: badgeNumber,
                        reason: 'พนักงานทำรหัสหาย'
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    alert(`เกิดข้อผิดพลาด: ${error.detail}`);
                    return;
                }

                const result = await response.json();

                alert(`สร้างรหัสใหม่สำเร็จ!\n\nรหัสเก่า: ${result.old_code}\nรหัสใหม่: ${result.new_code}\n\n(หมดอายุใน 24 ชั่วโมง)`);

                await loadAdminStats();
                displayEmployees(getFilteredEmployees());
            } catch (error) {
                console.error('Error regenerating code:', error);
                alert('เกิดข้อผิดพลาดในการสร้างรหัสใหม่');
            }
        }

        // Unlink LINE account
        async function unlinkLineAccount(badgeNumber, displayName) {
            if (!confirm(`คุณต้องการยกเลิกการเชื่อมต่อ LINE ของ ${displayName} ใช่หรือไม่?`)) return;

            try {
                await appConfig.loadConfig();

                const response = await fetch(appConfig.getApiUrl('admin/line-codes/unlink'), {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        badge_number: badgeNumber,
                        reason: 'ผู้ดูแลระบบยกเลิกการเชื่อมต่อ'
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    alert(`เกิดข้อผิดพลาด: ${error.detail}`);
                    return;
                }

                alert('ยกเลิกการเชื่อมต่อ LINE สำเร็จ');

                await loadAdminStats();
                displayEmployees(getFilteredEmployees());
            } catch (error) {
                console.error('Error unlinking account:', error);
                alert('เกิดข้อผิดพลาดในการยกเลิกการเชื่อมต่อ');
            }
        }

        // Show pending codes modal
        async function showPendingCodes() {
            try {
                await appConfig.loadConfig();

                const response = await fetch(
                    appConfig.getApiUrl('admin/line-codes/list?include_expired=true'),
                    {
                        credentials: 'include'
                    }
                );

                if (!response.ok) throw new Error('Failed to load pending codes');

                const codes = await response.json();

                if (codes.length === 0) {
                    alert('ไม่มีรหัสที่รอเชื่อมต่อ');
                    return;
                }

                let message = '📋 รหัสที่รอเชื่อมต่อ:\n\n';
                codes.forEach(code => {
                    const status = code.is_expired ? '(หมดอายุ)' : '(ใช้งานได้)';
                    message += `${code.badge_number} - ${code.display_name}\n`;
                    message += `รหัส: ${code.linking_code} ${status}\n`;
                    message += `สร้างเมื่อ: ${new Date(code.generated_at).toLocaleString('th-TH')}\n\n`;
                });

                alert(message);
            } catch (error) {
                console.error('Error loading pending codes:', error);
                alert('เกิดข้อผิดพลาดในการโหลดรหัสที่รอเชื่อมต่อ');
            }
        }

        // Show linked accounts modal
        async function showLinkedAccounts() {
            try {
                await appConfig.loadConfig();

                const response = await fetch(
                    appConfig.getApiUrl('admin/line-codes/linked'),
                    {
                        credentials: 'include'
                    }
                );

                if (!response.ok) throw new Error('Failed to load linked accounts');

                const accounts = await response.json();

                if (accounts.length === 0) {
                    alert('ยังไม่มีบัญชีที่เชื่อมต่อ');
                    return;
                }

                let message = '✅ บัญชีที่เชื่อมต่อแล้ว:\n\n';
                accounts.forEach(account => {
                    message += `${account.badge_number} - ${account.display_name}\n`;
                    message += `LINE: ${account.line_display_name || 'N/A'}\n`;
                    message += `เชื่อมต่อเมื่อ: ${new Date(account.linked_at).toLocaleString('th-TH')}\n\n`;
                });

                alert(message);
            } catch (error) {
                console.error('Error loading linked accounts:', error);
                alert('เกิดข้อผิดพลาดในการโหลดบัญชีที่เชื่อมต่อ');
            }
        }

        // Refresh admin data
        async function refreshAdminData() {
            await loadAdminStats();
            displayEmployees(getFilteredEmployees());
            alert('รีเฟรชข้อมูลสำเร็จ');
        }

        // ============================================================================
        // ADD NEW EMPLOYEE FUNCTIONALITY
        // ============================================================================

        // Show add employee modal
        function showAddEmployeeModal() {
            document.getElementById('addEmployeeModal').style.display = 'flex';
            document.getElementById('newBadgeNumber').focus();
        }

        // Hide add employee modal
        function hideAddEmployeeModal() {
            document.getElementById('addEmployeeModal').style.display = 'none';
            // Clear form
            document.getElementById('newBadgeNumber').value = '';
            document.getElementById('newNickname').value = '';
            document.getElementById('addEmployeeError').style.display = 'none';
        }

        // Create new employee
        async function createNewEmployee() {
            const badgeNumber = document.getElementById('newBadgeNumber').value.trim();
            const nickname = document.getElementById('newNickname').value.trim();
            const errorDiv = document.getElementById('addEmployeeError');
            const submitBtn = document.getElementById('createEmployeeBtn');

            // Validate inputs
            if (!badgeNumber) {
                errorDiv.textContent = 'กรุณาระบุหมายเลขบัตร';
                errorDiv.style.display = 'block';
                return;
            }

            if (!nickname) {
                errorDiv.textContent = 'กรุณาระบุชื่อเล่น';
                errorDiv.style.display = 'block';
                return;
            }

            errorDiv.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'กำลังสร้าง...';

            try {
                await appConfig.loadConfig();

                const response = await fetch(appConfig.getApiUrl('employees/'), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        badge_number: badgeNumber,
                        thai_name: nickname,
                        is_active: true,
                        is_hidden: false
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    errorDiv.textContent = error.detail || 'เกิดข้อผิดพลาดในการสร้างพนักงาน';
                    errorDiv.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'สร้างพนักงาน';
                    return;
                }

                const result = await response.json();
                alert(`สร้างพนักงานสำเร็จ!\n\nหมายเลขบัตร: ${result.badge_number}\nชื่อเล่น: ${result.display_name}`);

                // Hide modal and reload employees
                hideAddEmployeeModal();
                await loadEmployees();

            } catch (error) {
                console.error('Error creating employee:', error);
                errorDiv.textContent = 'เกิดข้อผิดพลาดในการสร้างพนักงาน กรุณาลองใหม่อีกครั้ง';
                errorDiv.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'สร้างพนักงาน';
            }
        }

        // Handle Enter key in form
        document.addEventListener('DOMContentLoaded', function() {
            const newBadgeNumber = document.getElementById('newBadgeNumber');
            const newNickname = document.getElementById('newNickname');

            if (newBadgeNumber) {
                newBadgeNumber.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        newNickname.focus();
                    }
                });
            }

            if (newNickname) {
                newNickname.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        createNewEmployee();
                    }
                });
            }
        });
    </script>

    <!-- Add Employee Modal -->
    <div id="addEmployeeModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
        <div style="background: white; padding: 30px; border-radius: 8px; max-width: 500px; width: 90%; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
            <h3 style="margin: 0 0 20px 0; color: #333;">➕ เพิ่มพนักงานใหม่</h3>

            <div style="margin-bottom: 15px;">
                <label for="newBadgeNumber" style="display: block; margin-bottom: 5px; font-weight: 500; color: #555;">หมายเลขบัตร <span style="color: red;">*</span></label>
                <input type="text" id="newBadgeNumber" placeholder="ระบุหมายเลขบัตร" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 20px;">
                <label for="newNickname" style="display: block; margin-bottom: 5px; font-weight: 500; color: #555;">ชื่อเล่น <span style="color: red;">*</span></label>
                <input type="text" id="newNickname" placeholder="ระบุชื่อเล่นพนักงาน" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; box-sizing: border-box;">
            </div>

            <div id="addEmployeeError" style="display: none; margin-bottom: 15px; padding: 10px; background: #f8d7da; border: 1px solid #f5c6cb; border-radius: 4px; color: #721c24; font-size: 14px;"></div>

            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button class="btn btn-secondary" onclick="hideAddEmployeeModal()">ยกเลิก</button>
                <button id="createEmployeeBtn" class="btn btn-primary" onclick="createNewEmployee()">สร้างพนักงาน</button>
            </div>
        </div>
    </div>
</body>
</html>
