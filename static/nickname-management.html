<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>จัดการชื่อเล่นพนักงาน - ระบบบันทึกเวลาด้วยลายนิ้วมือ</title>
    <!-- CSS Files with cache busting -->
    <script>
        const cssTimestamp = Date.now();
        document.write(`<link rel="stylesheet" href="static/css/base.css?v=${cssTimestamp}">`);
        document.write(`<link rel="stylesheet" href="static/css/modal.css?v=${cssTimestamp}">`);
    </script>

    <!-- JavaScript Files -->
    <script>
        const timestamp = Date.now();
        const randomId = Math.random().toString(36).substring(7);
        const buildNumber = '2025011801'; // Build timestamp - FORCE CACHE BREAK v3.0
        const version = `v3.0-https-fix-${buildNumber}`;
        const cacheBuster = `${timestamp}.${randomId}&build=${buildNumber}`;
        document.write(`<script src="static/js/config.js?v=${cacheBuster}&version=${version}&force=${Date.now()}"><\/script>`);
    </script>
    <style>
        .nickname-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1.5rem;
            background: var(--primary-white);
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 1px 3px var(--shadow-light);
        }

        .nickname-table th,
        .nickname-table td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid var(--border-light);
        }

        .nickname-table th {
            background-color: var(--bg-tertiary);
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.875rem;
        }

        .nickname-table tr:hover {
            background-color: var(--bg-secondary);
        }

        .nickname-input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .nickname-input:focus {
            outline: none;
            border-color: #007bff;
        }

        .search-box {
            margin-bottom: 20px;
        }

        .search-input {
            width: 300px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .success-message {
            color: #28a745;
            font-size: 12px;
            margin-left: 10px;
            display: none;
        }

        .error-message {
            color: #dc3545;
            font-size: 12px;
            margin-left: 10px;
            display: none;
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-active {
            background-color: #d4edda;
            color: #155724;
        }

        .status-inactive {
            background-color: #f8d7da;
            color: #721c24;
        }

        .status-hidden {
            background-color: #e2e3e5;
            color: #383d41;
        }

        .btn.inactive {
            background: var(--text-muted) !important;
            border-color: var(--text-muted) !important;
        }

        .btn.hidden {
            background: var(--accent-orange) !important;
            border-color: var(--accent-orange) !important;
            color: var(--text-primary) !important;
        }

        .btn.active {
            background: var(--accent-blue) !important;
            border-color: var(--accent-blue) !important;
            color: var(--primary-white) !important;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-row-1">
            <h1>จัดการชื่อเล่นพนักงาน</h1>
        </div>
        <div class="header-row-2">
            <div class="header-actions">
                <a href="./" class="action-btn">📊 แดชบอร์ด</a>
                <a href="./device-status" class="action-btn">🔧 สถานะเครื่อง</a>
                <a href="./nickname-management" class="action-btn" style="background: var(--accent-blue); color: white;">👤 จัดการชื่อเล่น</a>
                <a href="/fingerprintlogs/individual-attendance" class="action-btn">📅 เข้า/ออก รายคน</a>
                <a href="./export" class="action-btn">📤 ส่งออกข้อมูล</a>
            </div>
        </div>
    </div>

    <div class="container">
            <div class="card">
                <div class="card-header">
                    <h2>จัดการชื่อเล่นพนักงาน</h2>
                </div>
                <div class="card-body">
                    <div class="search-box">
                        <input type="text" id="searchInput" class="search-input" placeholder="ค้นหาด้วยหมายเลขบัตรหรือชื่อเล่น...">
                        <button id="showHiddenBtn" class="btn btn-secondary" onclick="toggleShowHidden()">แสดงที่ซ่อน</button>
                    </div>
                    
                    <div id="loadingDiv" class="loading">กำลังโหลดข้อมูลพนักงาน...</div>
                    
                    <table class="nickname-table" id="nicknameTable" style="display: none;">
                        <thead>
                            <tr>
                                <th>หมายเลขบัตร</th>
                                <th>ชื่อเล่น</th>
                                <th>สถานะ</th>
                                <th>การแสดงผล</th>
                                <th>การดำเนินการ</th>
                            </tr>
                        </thead>
                        <tbody id="nicknameTableBody">
                            <!-- Table rows will be populated here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        let employees = [];
        let showHidden = false;

        // Load employees on page load
        async function loadEmployees() {
            try {
                // Ensure config is loaded first
                await appConfig.loadConfig();
                
                const params = new URLSearchParams({
                    from_device: 'true',  // Always fetch from ZK device
                    include_hidden: showHidden.toString()
                });
                
                const url = appConfig.getApiUrl(`employees/?${params}`);
                console.log('Loading employees from:', url);
                const response = await fetch(url);
                if (!response.ok) throw new Error('โหลดข้อมูลพนักงานไม่สำเร็จ');
                
                const data = await response.json();
                employees = data.employees || [];
                
                displayEmployees(employees);
                document.getElementById('loadingDiv').style.display = 'none';
                document.getElementById('nicknameTable').style.display = 'table';
            } catch (error) {
                console.error('Error loading employees:', error);
                document.getElementById('loadingDiv').innerHTML = 'โหลดข้อมูลพนักงานไม่สำเร็จ กรุณาตรวจสอบการเชื่อมต่อเครื่อง ZK';
            }
        }

        // Display employees in table
        function displayEmployees(employeeList) {
            const tbody = document.getElementById('nicknameTableBody');
            tbody.innerHTML = '';
            
            employeeList.forEach(employee => {
                const row = document.createElement('tr');
                const statusClass = employee.is_active ? 'status-active' : 'status-inactive';
                const statusText = employee.is_active ? 'ใช้งาน' : 'ไม่ใช้งาน';
                const hiddenClass = employee.is_hidden ? 'status-hidden' : 'status-active';
                const hiddenText = employee.is_hidden ? 'ซ่อน' : 'แสดง';
                
                // Add visual indicator for employees not in database
                const notInDbIndicator = !employee.in_database ?
                    '<span style="color: #ffc107; font-size: 12px; margin-left: 5px;" title="จากเครื่อง ZK - ยังไม่มีในฐานข้อมูล">📋</span>' : '';
                
                row.innerHTML = `
                    <td>${employee.badge_number}${notInDbIndicator}</td>
                    <td>
                        <input type="text" 
                               class="nickname-input" 
                               id="nickname-${employee.badge_number}"
                               value="${employee.display_name || ''}" 
                               data-original="${employee.display_name || ''}"
                               placeholder="${employee.in_database ? 'ใส่ชื่อเล่น' : 'ใส่ชื่อเล่น (จะสร้างข้อมูลพนักงาน)'}">
                    </td>
                    <td>
                        <button class="btn btn-secondary toggle-btn ${employee.is_active ? '' : 'inactive'}"
                                onclick="toggleStatus('${employee.badge_number}', ${!employee.is_active})">
                            ${employee.is_active ? 'ตั้งเป็นไม่ใช้งาน' : 'ตั้งเป็นใช้งาน'}
                        </button>
                        <span class="status-badge ${statusClass}">${statusText}</span>
                    </td>
                    <td>
                        <button class="btn btn-secondary toggle-btn ${employee.is_hidden ? 'hidden' : ''}"
                                onclick="toggleHidden('${employee.badge_number}', ${!employee.is_hidden})">
                            ${employee.is_hidden ? 'แสดง' : 'ซ่อน'}
                        </button>
                        <span class="status-badge ${hiddenClass}">${hiddenText}</span>
                    </td>
                    <td>
                        <button class="btn btn-primary save-btn"
                                onclick="saveNickname('${employee.badge_number}')"
                                id="save-${employee.badge_number}"
                                disabled>
                            ${employee.in_database ? 'บันทึก' : 'สร้างและบันทึก'}
                        </button>
                        <span class="success-message" id="success-${employee.badge_number}">บันทึกแล้ว!</span>
                        <span class="error-message" id="error-${employee.badge_number}">บันทึกไม่สำเร็จ</span>
                    </td>
                `;
                tbody.appendChild(row);
                
                // Add event listener for input changes
                const input = document.getElementById(`nickname-${employee.badge_number}`);
                input.addEventListener('input', function() {
                    const saveBtn = document.getElementById(`save-${employee.badge_number}`);
                    saveBtn.disabled = this.value === this.getAttribute('data-original');
                });
            });
        }

        // Save nickname
        async function saveNickname(badgeNumber) {
            const input = document.getElementById(`nickname-${badgeNumber}`);
            const saveBtn = document.getElementById(`save-${badgeNumber}`);
            const successMsg = document.getElementById(`success-${badgeNumber}`);
            const errorMsg = document.getElementById(`error-${badgeNumber}`);
            
            saveBtn.disabled = true;
            successMsg.style.display = 'none';
            errorMsg.style.display = 'none';
            
            try {
                // Ensure config is loaded first
                await appConfig.loadConfig();

                const response = await fetch(appConfig.getApiUrl(`employees/${badgeNumber}/nickname`), {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        nickname: input.value
                    })
                });
                
                if (!response.ok) throw new Error('บันทึกชื่อเล่นไม่สำเร็จ');
                
                // Update the original value
                input.setAttribute('data-original', input.value);
                
                // Show success message
                successMsg.style.display = 'inline';
                setTimeout(() => {
                    successMsg.style.display = 'none';
                }, 3000);
                
                // Update the employee in our local array
                const employee = employees.find(e => e.badge_number === badgeNumber);
                if (employee) {
                    employee.display_name = input.value;
                    employee.in_database = true; // Now in database
                }
                
                // Check if employee was created
                const result = await response.json();
                if (result.created) {
                    // Update button text since employee is now in database
                    saveBtn.textContent = 'บันทึก';
                    // Refresh the row to remove the "not in database" indicator
                    displayEmployees(getFilteredEmployees());
                }
            } catch (error) {
                console.error('Error saving nickname:', error);
                errorMsg.style.display = 'inline';
                setTimeout(() => {
                    errorMsg.style.display = 'none';
                }, 3000);
                
                // Re-enable save button if there's still a change
                if (input.value !== input.getAttribute('data-original')) {
                    saveBtn.disabled = false;
                }
            }
        }

        // Toggle employee status (active/inactive)
        async function toggleStatus(badgeNumber, newStatus) {
            try {
                // Ensure config is loaded first
                await appConfig.loadConfig();

                const response = await fetch(appConfig.getApiUrl(`employees/${badgeNumber}/status`), {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        is_active: newStatus
                    })
                });
                
                if (!response.ok) throw new Error('อัปเดตสถานะไม่สำเร็จ');
                
                // Update the employee in our local array
                const employee = employees.find(e => e.badge_number === badgeNumber);
                if (employee) {
                    employee.is_active = newStatus;
                }
                
                // Refresh the display
                displayEmployees(getFilteredEmployees());
            } catch (error) {
                console.error('Error updating status:', error);
                alert('อัปเดตสถานะพนักงานไม่สำเร็จ');
            }
        }

        // Toggle employee hidden status
        async function toggleHidden(badgeNumber, newHiddenStatus) {
            try {
                // Ensure config is loaded first
                await appConfig.loadConfig();

                const response = await fetch(appConfig.getApiUrl(`employees/${badgeNumber}/hidden`), {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        is_hidden: newHiddenStatus
                    })
                });
                
                if (!response.ok) throw new Error('อัปเดตสถานะการซ่อนไม่สำเร็จ');

                // Update the employee in our local array
                const employee = employees.find(e => e.badge_number === badgeNumber);
                if (employee) {
                    employee.is_hidden = newHiddenStatus;
                }

                // Refresh the display with filtered employees
                displayEmployees(getFilteredEmployees());
            } catch (error) {
                console.error('Error updating hidden status:', error);
                alert('อัปเดตสถานะการซ่อนพนักงานไม่สำเร็จ');
            }
        }

        // Toggle show hidden employees
        function toggleShowHidden() {
            showHidden = !showHidden;
            const btn = document.getElementById('showHiddenBtn');

            if (showHidden) {
                btn.textContent = 'ซ่อนที่ซ่อน';
                btn.classList.add('active');
            } else {
                btn.textContent = 'แสดงที่ซ่อน';
                btn.classList.remove('active');
            }

            loadEmployees();
        }

        // Get filtered employees based on search and hidden status
        function getFilteredEmployees() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();

            return employees.filter(employee => {
                // Filter by search term
                const badgeMatch = employee.badge_number.toLowerCase().includes(searchTerm);
                const nameMatch = (employee.display_name || '').toLowerCase().includes(searchTerm);
                const searchMatch = badgeMatch || nameMatch;

                // Filter by hidden status
                const hiddenMatch = showHidden || !employee.is_hidden;

                return searchMatch && hiddenMatch;
            });
        }

        // Search functionality
        document.getElementById('searchInput').addEventListener('input', function() {
            displayEmployees(getFilteredEmployees());
        });

        // Load employees when page loads
        loadEmployees();
    </script>
</body>
</html>
