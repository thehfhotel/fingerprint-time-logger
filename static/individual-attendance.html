<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Last-Modified" content="0">
    <meta name="cache-buster" content="2025-10-04-timezone-fix-v2.9">
    <title>เข้า/ออก รายคน - การลงเวลารายบุคคล</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- CSS Files with cache busting -->
    <script>
        const cssTimestamp = Date.now();
        document.write(`<link rel="stylesheet" href="static/css/base.css?v=${cssTimestamp}">`);
        document.write(`<link rel="stylesheet" href="static/css/individual-attendance.css?v=${cssTimestamp}">`);
    </script>

    <!-- JavaScript Files with Aggressive Cache Busting -->
    <script>
        const timestamp = Date.now();
        const randomId = Math.random().toString(36).substring(7);
        const buildNumber = '2025011803'; // Build timestamp - TIMESTAMP FIX
        const version = `v2.8-timestamp-fix-${buildNumber}`;
        const cacheBuster = `${timestamp}.${randomId}&build=${buildNumber}`;
        document.write(`<script src="static/js/config.js?v=${cacheBuster}&version=${version}&force=${Date.now()}"><\/script>`);
        document.write(`<script src="static/js/individual-attendance.js?v=${cacheBuster}&version=${version}&force=${Date.now()}"><\/script>`);
    </script>
</head>
<body>
    <div class="header">
        <div class="header-row-1">
            <h1>เข้า/ออก รายคน</h1>
        </div>
        <div class="header-row-2">
            <div class="header-actions">
                <a href="./" class="action-btn">📊 แดชบอร์ด</a>
            </div>
        </div>
    </div>

    <div class="main-container">
        <!-- Left Sidebar with Nickname List -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h3>รายชื่อพนักงาน</h3>
                <div class="search-box">
                    <input type="text" id="nicknameSearch" placeholder="ค้นหาชื่อ..." />
                </div>
            </div>
            <div class="nickname-list" id="nicknameList">
                <div class="loading">กำลังโหลดรายชื่อ...</div>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="content-area">
            <div class="content-header">
                <h2 id="selectedEmployeeName">เลือกพนักงานเพื่อดูข้อมูล</h2>
                <div class="date-filter">
                    <label>ตั้งแต่วันที่:</label>
                    <input type="date" id="startDate" />
                    <label>ถึงวันที่:</label>
                    <input type="date" id="endDate" />
                    <button id="filterButton" class="btn btn-primary">กรอง</button>
                </div>
            </div>

            <div class="attendance-table-container">
                <table class="attendance-table" id="attendanceTable">
                    <thead>
                        <tr>
                            <th>วันที่ (dd/mm/yyyy)</th>
                            <th>เวลา</th>
                        </tr>
                    </thead>
                    <tbody id="attendanceTableBody">
                        <tr>
                            <td colspan="2" class="no-data">เลือกพนักงานเพื่อดูข้อมูลการเข้า-ออกงาน</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
        <div class="loading-spinner">กำลังโหลดข้อมูล...</div>
    </div>
    <script defer src="https://erp.thehfhotel.org/shell/hf-bar.js" data-app="Attendance" data-module="people"></script>
</body>
</html>
