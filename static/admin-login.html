<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - ระบบบันทึกเวลา</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/css/base.css">
    <style>
        body {
            background: linear-gradient(135deg, #4F0E0E 0%, #7A0000 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Sarabun', 'Noto Sans Thai', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .login-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 3rem;
            width: 100%;
            max-width: 400px;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h1 {
            color: #26221E;
            font-size: 1.875rem;
            font-weight: 700;
            margin: 0 0 0.5rem 0;
        }

        .login-header p {
            color: #7A7268;
            font-size: 0.875rem;
            margin: 0;
        }

        .primary-path {
            background: #F6F1EA;
            border: 1px solid #E8E4DF;
            border-left: 4px solid #7A0000;
            border-radius: 8px;
            padding: 0.875rem 1rem;
            margin: 0 0 1rem 0;
            text-align: left;
            color: #26221E;
            font-size: 0.875rem;
            line-height: 1.6;
        }

        .primary-path a {
            color: #7A0000;
            font-weight: 600;
            text-decoration: none;
        }

        .primary-path a:hover {
            text-decoration: underline;
        }

        .fallback-note {
            color: #7A7268;
            font-size: 0.8125rem;
            line-height: 1.6;
            text-align: left;
            margin: 0;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            color: #26221E;
            font-weight: 500;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #E8E4DF;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.2s;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: #8B0000;
            box-shadow: 0 0 0 3px rgba(139, 0, 0, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 0.875rem;
            background: linear-gradient(135deg, #4F0E0E 0%, #7A0000 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(139, 0, 0, 0.3);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.875rem;
            display: none;
        }

        .alert-error {
            background-color: #F7E2E2;
            border: 1px solid #EFC2C2;
            color: #C53030;
        }

        .alert-success {
            background-color: #DCEEE3;
            border: 1px solid #CFE4D8;
            color: #1D5438;
        }

        .alert.show {
            display: block;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }

        .back-link a {
            color: #7A7268;
            text-decoration: none;
            font-size: 0.875rem;
            transition: color 0.2s;
        }

        .back-link a:hover {
            color: #8B0000;
        }

        .password-toggle {
            position: relative;
        }

        .password-toggle button {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #7A7268;
            cursor: pointer;
            padding: 0.25rem;
            font-size: 1.125rem;
        }

        .password-toggle button:hover {
            color: #26221E;
        }
    </style>

    <!-- JavaScript Files -->
    <script>
        // Force fresh config.js - version bump for HTTPS fix
        const timestamp = Date.now();
        const configVersion = 'v4.0-https-fix';
        document.write(`<script src="static/js/config.js?v=${timestamp}&ver=${configVersion}"><\/script>`);
    </script>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Admin Console</h1>
            <p class="primary-path">
                ผู้จัดการ: เข้าใช้งานผ่าน
                <a href="https://erp.thehfhotel.org">erp.thehfhotel.org</a>
                แล้วเปิดการ์ด "Attendance" ระบบจะพาเข้าหน้าจัดการให้อัตโนมัติ
                โดยไม่ต้องใส่รหัสผ่าน
            </p>
            <p class="fallback-note">
                รหัสผ่านด้านล่างเป็นทางเข้าสำรองสำหรับกรณีฉุกเฉิน
                หรือเครื่องที่เข้าใช้งานผ่านเครือข่ายภายในเท่านั้น
            </p>
        </div>

        <div id="alert" class="alert"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="passcode">รหัสผ่านสำรอง (Admin)</label>
                <div class="password-toggle">
                    <input
                        type="password"
                        id="passcode"
                        name="passcode"
                        placeholder="กรุณาใส่รหัสผ่าน"
                        required
                        autocomplete="off"
                    >
                    <button type="button" id="togglePassword" title="แสดง/ซ่อนรหัสผ่าน">
                        👁️
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                เข้าสู่ระบบ
            </button>
        </form>

        <div class="back-link">
            <a href="./">← กลับหน้าแดชบอร์ด</a>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const passcodeInput = document.getElementById('passcode');
        const loginBtn = document.getElementById('loginBtn');
        const alertDiv = document.getElementById('alert');
        const togglePasswordBtn = document.getElementById('togglePassword');

        // Password visibility toggle
        togglePasswordBtn.addEventListener('click', () => {
            const type = passcodeInput.type === 'password' ? 'text' : 'password';
            passcodeInput.type = type;
            togglePasswordBtn.textContent = type === 'password' ? '👁️' : '🙈';
        });

        // Show alert message
        function showAlert(message, type = 'error') {
            alertDiv.textContent = message;
            alertDiv.className = `alert alert-${type} show`;

            setTimeout(() => {
                alertDiv.classList.remove('show');
            }, 5000);
        }

        // Handle login form submission
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const passcode = passcodeInput.value.trim();

            if (!passcode) {
                showAlert('กรุณาใส่รหัสผ่าน', 'error');
                return;
            }

            // Disable button during request
            loginBtn.disabled = true;
            loginBtn.textContent = 'กำลังตรวจสอบ...';

            try {
                // Ensure config is loaded
                await appConfig.loadConfig();

                const response = await fetch(appConfig.getApiUrl('admin/auth/login'), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({ passcode })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    // Auth token is stored in an HttpOnly cookie set by the
                    // server — we do NOT mirror it into localStorage. We keep
                    // only the expiry timestamp for UX (e.g., countdown).
                    localStorage.setItem('admin_session_expires', result.expires_at);

                    showAlert('เข้าสู่ระบบสำเร็จ! กำลังเข้าหน้า Admin Console...', 'success');

                    // Redirect to admin console after short delay
                    setTimeout(() => {
                        window.location.href = './admin-console';
                    }, 1000);
                } else {
                    showAlert(result.message || 'รหัสผ่านไม่ถูกต้อง', 'error');
                    passcodeInput.value = '';
                    passcodeInput.focus();
                }
            } catch (error) {
                console.error('Login error:', error);
                showAlert('เกิดข้อผิดพลาดในการเข้าสู่ระบบ กรุณาลองใหม่อีกครั้ง', 'error');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'เข้าสู่ระบบ';
            }
        });

        // Focus passcode input on page load
        window.addEventListener('DOMContentLoaded', () => {
            passcodeInput.focus();
        });

        // Check if already logged in by validating the HttpOnly session cookie.
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                await appConfig.loadConfig();

                const response = await fetch(appConfig.getApiUrl('admin/auth/validate'), {
                    credentials: 'include'
                });

                if (response.ok) {
                    const result = await response.json();
                    if (result.valid) {
                        // Already logged in, redirect to admin console
                        window.location.href = './admin-console';
                    }
                }
            } catch (error) {
                console.error('Session validation error:', error);
            }
        });
    </script>
    <script defer src="https://erp.thehfhotel.org/shell/hf-bar.js" data-app="Attendance" data-module="people"></script>
</body>
</html>
