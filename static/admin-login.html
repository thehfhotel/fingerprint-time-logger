<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - ระบบบันทึกเวลา</title>
    <link rel="stylesheet" href="static/css/base.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .login-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 3rem;
            width: 100%;
            max-width: 400px;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h1 {
            color: #1f2937;
            font-size: 1.875rem;
            font-weight: 700;
            margin: 0 0 0.5rem 0;
        }

        .login-header p {
            color: #6b7280;
            font-size: 0.875rem;
            margin: 0;
        }

        .lock-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            color: #374151;
            font-weight: 500;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.2s;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 0.875rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.875rem;
            display: none;
        }

        .alert-error {
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
        }

        .alert-success {
            background-color: #dcfce7;
            border: 1px solid #bbf7d0;
            color: #166534;
        }

        .alert.show {
            display: block;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }

        .back-link a {
            color: #6b7280;
            text-decoration: none;
            font-size: 0.875rem;
            transition: color 0.2s;
        }

        .back-link a:hover {
            color: #667eea;
        }

        .password-toggle {
            position: relative;
        }

        .password-toggle button {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #6b7280;
            cursor: pointer;
            padding: 0.25rem;
            font-size: 1.125rem;
        }

        .password-toggle button:hover {
            color: #374151;
        }
    </style>

    <!-- JavaScript Files -->
    <script>
        const timestamp = Date.now();
        document.write(`<script src="static/js/config.js?v=${timestamp}"><\/script>`);
    </script>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="lock-icon">🔒</div>
            <h1>Admin Console</h1>
            <p>กรุณาใส่รหัสผ่านเพื่อเข้าถึงหน้าจัดการระบบ</p>
        </div>

        <div id="alert" class="alert"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="passcode">รหัสผ่าน Admin</label>
                <div class="password-toggle">
                    <input
                        type="password"
                        id="passcode"
                        name="passcode"
                        placeholder="กรุณาใส่รหัสผ่าน"
                        required
                        autocomplete="off"
                    >
                    <button type="button" id="togglePassword" title="แสดง/ซ่อนรหัสผ่าน">
                        👁️
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                เข้าสู่ระบบ
            </button>
        </form>

        <div class="back-link">
            <a href="./">← กลับหน้าแดชบอร์ด</a>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const passcodeInput = document.getElementById('passcode');
        const loginBtn = document.getElementById('loginBtn');
        const alertDiv = document.getElementById('alert');
        const togglePasswordBtn = document.getElementById('togglePassword');

        // Password visibility toggle
        togglePasswordBtn.addEventListener('click', () => {
            const type = passcodeInput.type === 'password' ? 'text' : 'password';
            passcodeInput.type = type;
            togglePasswordBtn.textContent = type === 'password' ? '👁️' : '🙈';
        });

        // Show alert message
        function showAlert(message, type = 'error') {
            alertDiv.textContent = message;
            alertDiv.className = `alert alert-${type} show`;

            setTimeout(() => {
                alertDiv.classList.remove('show');
            }, 5000);
        }

        // Handle login form submission
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const passcode = passcodeInput.value.trim();

            if (!passcode) {
                showAlert('กรุณาใส่รหัสผ่าน', 'error');
                return;
            }

            // Disable button during request
            loginBtn.disabled = true;
            loginBtn.textContent = 'กำลังตรวจสอบ...';

            try {
                // Ensure config is loaded
                await appConfig.loadConfig();

                const response = await fetch(appConfig.getApiUrl('admin/auth/login'), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ passcode })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    // Store session token in localStorage
                    localStorage.setItem('admin_session_token', result.token);
                    localStorage.setItem('admin_session_expires', result.expires_at);

                    showAlert('เข้าสู่ระบบสำเร็จ! กำลังเข้าหน้า Admin Console...', 'success');

                    // Redirect to admin console after short delay
                    setTimeout(() => {
                        window.location.href = './admin-console';
                    }, 1000);
                } else {
                    showAlert(result.message || 'รหัสผ่านไม่ถูกต้อง', 'error');
                    passcodeInput.value = '';
                    passcodeInput.focus();
                }
            } catch (error) {
                console.error('Login error:', error);
                showAlert('เกิดข้อผิดพลาดในการเข้าสู่ระบบ กรุณาลองใหม่อีกครั้ง', 'error');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'เข้าสู่ระบบ';
            }
        });

        // Focus passcode input on page load
        window.addEventListener('DOMContentLoaded', () => {
            passcodeInput.focus();
        });

        // Check if already logged in
        window.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('admin_session_token');

            if (token) {
                try {
                    await appConfig.loadConfig();

                    const response = await fetch(appConfig.getApiUrl('admin/auth/validate'), {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (response.ok) {
                        const result = await response.json();
                        if (result.valid) {
                            // Already logged in, redirect to admin console
                            window.location.href = './admin-console';
                        }
                    }
                } catch (error) {
                    console.error('Session validation error:', error);
                }
            }
        });
    </script>
</body>
</html>
