[tool:pytest]
# E2E Testing Configuration for Fingerprint Time Logger
# Optimized for Playwright browser automation testing

# Test Discovery
testpaths = tests/e2e
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    workflow: Complete user workflow tests
    slow: Tests that take longer to execute
    integration: Integration tests with external systems
    visual: Visual regression tests
    websocket: Real-time WebSocket functionality tests
    device: ZKTeco device integration tests
    performance: Performance and load testing
    smoke: Quick smoke tests for basic functionality
    critical: Critical path functionality tests
    thai: Thai localization and Unicode tests

# Minimum version requirements
minversion = 6.0

# Test execution options
addopts =
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --durations=10
    --html=tests/e2e/reports/report.html
    --self-contained-html
    --json-report
    --json-report-file=tests/e2e/reports/report.json
    --cov=app
    --cov-report=html:tests/e2e/reports/coverage
    --cov-report=json:tests/e2e/reports/coverage.json
    --cov-fail-under=80
    --maxfail=5
    --tb=short
    --capture=no

# Parallel execution
#addopts += --numprocesses=auto
#addopts += --dist=worksteal

# Browser configuration
# Set via environment variables or command line
# BROWSER=chromium  # chromium, firefox, webkit
# HEADLESS=true     # true, false
# SLOWMO=0          # milliseconds

# Timeout configuration
timeout = 300
timeout_method = thread

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*unclosed.*:ResourceWarning

# Environment variables
env =
    APP_URL = http://localhost:5000
    BROWSER = chromium
    HEADLESS = true
    SLOWMO = 0
    SCREENSHOT_ON_FAILURE = true
    VIDEO_RECORDING = false
    TRACE_RECORDING = false

# Test data configuration
# Thai language testing
thai_locale = th-TH
thai_timezone = Asia/Bangkok

# Performance thresholds
page_load_timeout = 10000
navigation_timeout = 30000
element_timeout = 5000

# Visual testing
visual_threshold = 0.2
visual_update_snapshots = false

# Reporting
generate_report = true
report_title = Fingerprint Time Logger E2E Test Report
open_report = false