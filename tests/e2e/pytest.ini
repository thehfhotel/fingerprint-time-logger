[tool:pytest]
# CLI-based E2E Testing Configuration for Fingerprint Time Logger

# Test Discovery
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    e2e: marks tests as end-to-end tests
    cli: marks tests as CLI-based tests (HTTP requests)
    api: marks tests as API endpoint tests
    slow: marks tests as slow running (>5 seconds)

# Test execution options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    # --maxfail removed to allow all tests to run

# Timeout configuration (for HTTP requests)
timeout = 30
timeout_method = thread

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*unclosed.*:ResourceWarning

# Environment variables for CLI testing
env =
    APP_URL = http://localhost:5000/fingerprintlogs
    HTTP_TIMEOUT = 10
    REQUEST_RETRIES = 3