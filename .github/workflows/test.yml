name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12]

    services:
      sqlite:
        image: keinos/sqlite3:latest
        options: --health-cmd="sqlite3 --version" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc curl sqlite3

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-mock pytest-cov pytest-xdist pytest-benchmark factory-boy

    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 app tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Type check with mypy (optional)
      continue-on-error: true
      run: |
        pip install mypy
        mypy app --ignore-missing-imports

    - name: Run unit tests
      run: |
        pytest tests/unit/ -v --cov=app --cov-report=xml --cov-report=term-missing

    - name: Run integration tests
      run: |
        pytest tests/integration/ -v --cov=app --cov-append --cov-report=xml

    - name: Run performance tests
      run: |
        pytest tests/performance/ -v --benchmark-only --benchmark-json=benchmark.json

    - name: Security scan with bandit
      run: |
        pip install bandit
        bandit -r app -f json -o bandit-report.json || true

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results-${{ matrix.python-version }}
        path: |
          coverage.xml
          benchmark.json
          bandit-report.json

  integration:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-mock pytest-cov factory-boy

    - name: Set up test database
      run: |
        mkdir -p database
        touch database/test_attendance.db

    - name: Run database migration tests
      run: |
        alembic -c database/alembic.ini upgrade head
        pytest tests/integration/test_database_migrations.py -v

    - name: Run API integration tests
      run: |
        pytest tests/integration/ -v -m "not slow"

    - name: Run end-to-end tests
      run: |
        pytest tests/e2e/ -v --maxfail=5

  quality-gates:
    runs-on: ubuntu-latest
    needs: [test, integration]
    if: always()

    steps:
    - uses: actions/checkout@v4

    - name: Download test artifacts
      uses: actions/download-artifact@v3
      with:
        name: test-results-3.11

    - name: Quality Gate - Coverage Check
      run: |
        python -c "
        import xml.etree.ElementTree as ET
        import sys

        tree = ET.parse('coverage.xml')
        root = tree.getroot()
        coverage = float(root.attrib['line-rate']) * 100

        print(f'Coverage: {coverage:.1f}%')

        if coverage < 80:
            print('❌ Coverage below 80% threshold')
            sys.exit(1)
        else:
            print('✅ Coverage meets 80% threshold')
        "

    - name: Quality Gate - Performance Check
      run: |
        python -c "
        import json
        import sys

        try:
            with open('benchmark.json') as f:
                data = json.load(f)

            # Check if any benchmark exceeded performance thresholds
            failed_benchmarks = []
            for benchmark in data['benchmarks']:
                mean_time = benchmark['stats']['mean']
                if 'api' in benchmark['name'] and mean_time > 0.2:  # 200ms threshold
                    failed_benchmarks.append((benchmark['name'], mean_time))

            if failed_benchmarks:
                print('❌ Performance benchmarks failed:')
                for name, time in failed_benchmarks:
                    print(f'  {name}: {time:.3f}s > 0.200s')
                sys.exit(1)
            else:
                print('✅ All performance benchmarks passed')

        except FileNotFoundError:
            print('⚠️ No benchmark results found')
        except Exception as e:
            print(f'⚠️ Could not check performance: {e}')
        "

    - name: Quality Gate - Security Check
      run: |
        python -c "
        import json
        import sys

        try:
            with open('bandit-report.json') as f:
                data = json.load(f)

            high_severity_issues = [
                issue for issue in data.get('results', [])
                if issue.get('issue_severity') == 'HIGH'
            ]

            if high_severity_issues:
                print('❌ High severity security issues found:')
                for issue in high_severity_issues:
                    print(f'  {issue[\"issue_text\"]} in {issue[\"filename\"]}:{issue[\"line_number\"]}')
                sys.exit(1)
            else:
                print('✅ No high severity security issues found')

        except FileNotFoundError:
            print('⚠️ No security scan results found')
        except Exception as e:
            print(f'⚠️ Could not check security: {e}')
        "

    - name: Quality Summary
      if: success()
      run: |
        echo "🎉 All quality gates passed!"
        echo "✅ Test Coverage ≥ 80%"
        echo "✅ API Performance < 200ms"
        echo "✅ No High Security Issues"
        echo "✅ All Tests Passing"