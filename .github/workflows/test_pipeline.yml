name: Comprehensive Testing Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.11'
  DATABASE_URL: 'sqlite:///:memory:'
  TESTING: 'true'

jobs:
  # ============================================================================
  # QUICK VALIDATION - Fast feedback for developers
  # ============================================================================

  quick-validation:
    name: Quick Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov flake8 black isort

    - name: Code formatting check
      run: |
        black --check app/ tests/
        isort --check-only app/ tests/

    - name: Lint with flake8
      run: |
        flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 app/ --count --max-complexity=10 --max-line-length=88 --statistics

    - name: Quick unit tests
      run: |
        python -m pytest tests/unit/ -x --tb=short --disable-warnings

  # ============================================================================
  # COMPREHENSIVE TESTING - Full test suite
  # ============================================================================

  comprehensive-tests:
    name: Comprehensive Test Suite
    runs-on: ubuntu-latest
    needs: quick-validation
    timeout-minutes: 30

    strategy:
      matrix:
        test-category: [unit, integration, api, security]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Install security tools (for security tests)
      if: matrix.test-category == 'security'
      run: |
        pip install bandit safety semgrep

    - name: Run test category - ${{ matrix.test-category }}
      run: |
        case "${{ matrix.test-category }}" in
          "unit")
            python -m pytest tests/unit/ --cov=app --cov-report=xml:coverage-unit.xml --cov-report=term-missing -v
            ;;
          "integration")
            python -m pytest tests/integration/ --cov=app --cov-append --cov-report=xml:coverage-integration.xml --cov-report=term-missing -v
            ;;
          "api")
            python -m pytest tests/test_*endpoints*.py tests/test_api*.py --cov=app --cov-append --cov-report=xml:coverage-api.xml -v
            ;;
          "security")
            if [ -d "tests/security" ]; then
              python -m pytest tests/security/ -v --tb=short
            else
              echo "Security tests not yet implemented"
              # Run basic security tools instead
              bandit -r app/ -f json -o bandit-report.json || true
              safety check --json --output safety-report.json || true
            fi
            ;;
        esac

    - name: Upload coverage to Codecov
      if: matrix.test-category != 'security'
      uses: codecov/codecov-action@v3
      with:
        file: coverage-${{ matrix.test-category }}.xml
        flags: ${{ matrix.test-category }}
        name: codecov-${{ matrix.test-category }}

    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results-${{ matrix.test-category }}
        path: |
          coverage-*.xml
          *-report.json
          pytest-report.html
        retention-days: 30

  # ============================================================================
  # QUALITY GATES - Code quality validation
  # ============================================================================

  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    needs: comprehensive-tests
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Generate comprehensive coverage
      run: |
        python -m pytest tests/ --cov=app --cov-report=xml:coverage-final.xml --cov-report=html:htmlcov --cov-report=term-missing

    - name: Run quality gates framework
      run: |
        if [ -f "quality/quality_gates.py" ]; then
          python quality/quality_gates.py
        else
          echo "Quality gates framework not yet implemented"
          # Run basic quality checks
          python -c "
import xml.etree.ElementTree as ET
import sys
import os

coverage_file = 'coverage-final.xml'
if os.path.exists(coverage_file):
    tree = ET.parse(coverage_file)
    root = tree.getroot()
    coverage = float(root.attrib.get('line-rate', 0)) * 100
    print(f'Coverage: {coverage:.1f}%')

    if coverage < 85:
        print('❌ Coverage quality gate failed')
        sys.exit(1)
    else:
        print('✅ Coverage quality gate passed')
else:
    print('⚠️  Coverage report not found')
    sys.exit(1)
"
        fi

    - name: Code complexity analysis
      run: |
        pip install radon
        radon cc app/ --average --show-complexity | tee complexity-report.txt

        # Check if average complexity is acceptable
        python -c "
import subprocess
import sys

result = subprocess.run(['radon', 'cc', 'app/', '--average'], capture_output=True, text=True)
lines = result.stdout.split('\n')
for line in lines:
    if 'Average complexity:' in line:
        complexity = float(line.split(':')[1].strip().split()[0])
        print(f'Average complexity: {complexity}')
        if complexity > 10:
            print('❌ Complexity quality gate failed')
            sys.exit(1)
        else:
            print('✅ Complexity quality gate passed')
        break
"

    - name: Upload quality reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: quality-reports
        path: |
          coverage-final.xml
          htmlcov/
          complexity-report.txt
        retention-days: 90

  # ============================================================================
  # E2E TESTING - End-to-end browser testing (when implemented)
  # ============================================================================

  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: quality-gates
    timeout-minutes: 20
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        if [ -f "requirements-dev.txt" ]; then
          pip install -r requirements-dev.txt
        fi

    - name: Install Playwright
      if: contains(fromJSON('["requirements-dev.txt"]'), 'playwright')
      run: |
        playwright install chromium

    - name: Build Docker image for testing
      run: |
        docker build -t fingerprint-time-logger:test .

    - name: Run E2E tests
      run: |
        if [ -d "tests/e2e" ]; then
          python -m pytest tests/e2e/ -v --tb=short --maxfail=3
        else
          echo "E2E tests not yet implemented"
          # Run basic smoke test instead
          ./scripts/start.sh
          sleep 10
          curl -f http://localhost:5000/api/system/health || exit 1
          ./scripts/stop.sh
        fi

    - name: Upload E2E test artifacts
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: e2e-artifacts
        path: |
          test_screenshots/
          test_videos/
          logs/
        retention-days: 14

  # ============================================================================
  # PERFORMANCE TESTING - Load and performance validation
  # ============================================================================

  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: comprehensive-tests
    timeout-minutes: 15
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-benchmark locust

    - name: Run benchmark tests
      run: |
        python -m pytest tests/ -m performance --benchmark-only --benchmark-json=benchmark-results.json || true

    - name: Basic load test
      run: |
        ./scripts/start.sh
        sleep 5

        # Simple load test with curl
        echo "Running basic load test..."
        for i in {1..100}; do
          curl -s http://localhost:5000/api/system/health > /dev/null &
        done
        wait

        ./scripts/stop.sh

    - name: Upload performance results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: performance-results
        path: |
          benchmark-results.json
        retention-days: 30

  # ============================================================================
  # SECURITY SCANNING - Automated security analysis
  # ============================================================================

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: quick-validation
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety semgrep
        pip install -r requirements.txt

    - name: Run Bandit security scan
      run: |
        bandit -r app/ -f json -o bandit-report.json
      continue-on-error: true

    - name: Run Safety dependency scan
      run: |
        safety check --json --output safety-report.json
      continue-on-error: true

    - name: Run Semgrep security scan
      run: |
        semgrep --config=auto app/ --json --output=semgrep-report.json
      continue-on-error: true

    - name: Security scan summary
      run: |
        echo "## Security Scan Summary" >> security-summary.md
        echo "" >> security-summary.md

        if [ -f "bandit-report.json" ]; then
          echo "### Bandit Results" >> security-summary.md
          python -c "
import json
try:
    with open('bandit-report.json') as f:
        data = json.load(f)
    print(f'High: {len([r for r in data.get(\"results\", []) if r.get(\"issue_severity\") == \"HIGH\"])}')
    print(f'Medium: {len([r for r in data.get(\"results\", []) if r.get(\"issue_severity\") == \"MEDIUM\"])}')
    print(f'Low: {len([r for r in data.get(\"results\", []) if r.get(\"issue_severity\") == \"LOW\"])}')
except:
    print('Bandit report analysis failed')
" >> security-summary.md
        fi

    - name: Upload security reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json
          semgrep-report.json
          security-summary.md
        retention-days: 90

  # ============================================================================
  # DEPLOYMENT READINESS - Final validation
  # ============================================================================

  deployment-readiness:
    name: Deployment Readiness Check
    runs-on: ubuntu-latest
    needs: [comprehensive-tests, quality-gates, security-scan]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v3

    - name: Deployment readiness assessment
      run: |
        echo "## Deployment Readiness Report" > deployment-readiness.md
        echo "" >> deployment-readiness.md
        echo "### Test Results Summary" >> deployment-readiness.md

        # Check if all required artifacts exist
        READY=true

        if [ ! -d "test-results-unit" ]; then
          echo "❌ Unit tests artifacts missing" >> deployment-readiness.md
          READY=false
        else
          echo "✅ Unit tests completed" >> deployment-readiness.md
        fi

        if [ ! -d "test-results-integration" ]; then
          echo "❌ Integration tests artifacts missing" >> deployment-readiness.md
          READY=false
        else
          echo "✅ Integration tests completed" >> deployment-readiness.md
        fi

        if [ ! -d "quality-reports" ]; then
          echo "❌ Quality reports missing" >> deployment-readiness.md
          READY=false
        else
          echo "✅ Quality gates validated" >> deployment-readiness.md
        fi

        if [ ! -d "security-reports" ]; then
          echo "❌ Security reports missing" >> deployment-readiness.md
          READY=false
        else
          echo "✅ Security scan completed" >> deployment-readiness.md
        fi

        echo "" >> deployment-readiness.md
        if [ "$READY" = true ]; then
          echo "🚀 **DEPLOYMENT READY** - All quality gates passed" >> deployment-readiness.md
          echo "deployment-ready=true" >> $GITHUB_ENV
        else
          echo "🚫 **DEPLOYMENT NOT READY** - Quality gates failed" >> deployment-readiness.md
          echo "deployment-ready=false" >> $GITHUB_ENV
        fi

        cat deployment-readiness.md

    - name: Upload deployment readiness report
      uses: actions/upload-artifact@v3
      with:
        name: deployment-readiness
        path: deployment-readiness.md
        retention-days: 30

    outputs:
      deployment-ready: ${{ env.deployment-ready }}