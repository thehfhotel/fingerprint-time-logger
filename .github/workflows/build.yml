name: Build & Publish

# Thin caller for the estate's shared deploy plumbing (thehfhotel/estate-ci).
# The inline GHCR build and the cloudflared/forced-command SSH deploy used to
# be spelled out here; that plumbing now lives once in the reusable workflow,
# SHA-pinned below. The `test` job is unchanged and remains the deploy gate.
#
# What moved where:
# - Image build+push: deploy-evergreen.yml's build job. The Dockerfile's
#   FINAL stage is `fingerprint-logger` and `ARG BUILD_TYPE=production` is
#   the default, so the reusable workflow's target-less build produces the
#   same image the old `target:`+build-args build did. Deploys are now
#   SHA-pinned (IMAGE_TAG=<sha> in the host .env) instead of re-rolling
#   :latest while logging a SHA — fixing that long-standing mismatch.
# - .env materialization: env_payload below, written verbatim into the
#   tarball's .env by deploy-evergreen.yml after IMAGE_TAG and HOST_PORT.
#   ADMIN_PASSCODE_HASH is single-quoted: compose's .env parser treats a
#   single-quoted value as literal, which protects the bcrypt `$2b$12$...`
#   from variable interpolation — the same job the legacy shim's $->$$
#   escaping did (it is the only value on this app containing `$`).
# - Host side: /srv/run-deploy-fingerprint.sh now speaks the estate tarball
#   contract (rewritten 2026-08-13, one-time step; old shim backed up).
#
# Dropped surfaces, deliberate:
# - tag (`v*`) builds and the workflow_dispatch extra-tag input — unused in
#   practice; resurrect as a separate build-only workflow if ever needed.
# - `environment: production` — verified empty (no protection rules), pure
#   ceremony.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Deploy gate. Runs the full unit + integration suites. Tests that
  # target functionality which no longer exists (e.g. the pre-redesign
  # auto_import_fingerprint_logs loop, nonce replay protection) are
  # marked @pytest.mark.skip with documented reasons. Tests that
  # require a running server (tests/e2e/) and the security suite stay
  # out of this gate.
  test:
    name: Tests (deploy gate)
    runs-on: ubuntu-latest
    # Same throwaway secrets ci.yml uses — needed because strict-prod
    # config validation runs at import time.
    env:
      ENV: test
      TESTING: 'true'
      JWT_SECRET: ci-dummy-jwt-secret-do-not-use-in-prod
      ADMIN_PASSCODE_HASH: $2b$12$ci.dummy.hash.do.not.use.in.production.value.here.placeholder
      CORS_ALLOWED_ORIGINS: http://localhost:5000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc curl sqlite3 fonts-tlwg-loma-otf

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock pytest-xdist factory-boy

      - name: Set up test database
        # See ci.yml for rationale — we build the schema directly from the
        # models rather than replaying Alembic, because the migration chain
        # was authored against a pre-existing prod DB.
        run: |
          mkdir -p database
          python -c "from app.core.database import Base, engine; Base.metadata.create_all(bind=engine)"

      - name: Verify backup gate and failure-path tests
        run: pytest tests/unit/test_deploy_backup.py -v

      - name: Run unit + integration suites (deploy gate)
        # `-m "not slow"` matches ci.yml's integration step. The list of
        # legacy top-level test files is included explicitly because
        # they're outside tests/unit and tests/integration.
        run: |
          pytest -v \
            tests/unit/ \
            tests/integration/ \
            tests/test_api.py \
            tests/test_app_structure.py \
            tests/test_v2_routes.py \
            tests/test_attendance_endpoints.py \
            tests/test_device_endpoints.py \
            tests/test_employee_endpoints.py \
            -m "not slow"

  deploy:
    # LOAD-BEARING. deploy-evergreen.yml does not run this repo's tests — it
    # cannot know what they are. Without this `needs:` a red suite would not
    # stop a push to main from reaching production.
    # The image performs a verified host-local backup inside Alembic env.py
    # before any migration. Its existing CMD starts uvicorn only on success.
    # No separate SSH command/installer or readiness variable is required.
    name: Deploy (backup before migrations)
    needs: [test]
    if: github.ref == 'refs/heads/main'
    uses: thehfhotel/estate-ci/.github/workflows/deploy-evergreen.yml@571d115d63ecef9c30cd73f73a38e68395ab259f
    # A called workflow's GITHUB_TOKEN scopes come from the calling job; the
    # reusable build job cannot push to GHCR without packages:write.
    permissions:
      contents: read
      packages: write
    with:
      app_name: fingerprint # -> /srv/run-deploy-fingerprint.sh on the host
      image: ghcr.io/thehfhotel/fingerprint-time-logger
      host_port: "5000"
    secrets:
      ssh_key: ${{ secrets.EVERGREEN_DEPLOY_SSH_KEY }}
      host_key: ${{ secrets.EVERGREEN_HOST_KEY }}
      # The exact key set the legacy shim's static block + env{} + secrets{}
      # payload produced, one KEY=VALUE per line, empty values written
      # deliberately (estate convention: a rotated-then-cleared secret must
      # not leave a stale value behind; empty = feature dark, fail-closed).
      # ADMIN_PASSCODE_HASH single-quoted — see header.
      env_payload: |
        DATABASE_URL=sqlite:///./database/attendance.db
        HF_DEPLOY_RUN=${{ github.run_id }}-${{ github.run_attempt }}
        HF_DEPLOY_COMMIT=${{ github.sha }}
        ENV=production
        BEHIND_PROXY=true
        ZKTECO_HOST=192.168.100.209
        ZKTECO_PORT=4370
        CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}
        AUTO_IMPORT_INTERVAL_MINUTES=${{ vars.AUTO_IMPORT_INTERVAL_MINUTES || '30' }}
        ZK_DRIFT_TOLERANCE_SECONDS=${{ vars.ZK_DRIFT_TOLERANCE_SECONDS || '5' }}
        ZK_STARTUP_RETRY_MINUTES=${{ vars.ZK_STARTUP_RETRY_MINUTES || '3' }}
        ZK_CATCHUP_LOOKBACK_HOURS=${{ vars.ZK_CATCHUP_LOOKBACK_HOURS || '48' }}
        ZK_EXPECTED_UTC_OFFSET_MINUTES=${{ vars.ZK_EXPECTED_UTC_OFFSET_MINUTES || '420' }}
        PORTAL_DIRECTORY_URL=${{ vars.PORTAL_DIRECTORY_URL || 'http://hf-erp-portal:3000/portal-api/directory/managers' }}
        GUEST_FEEDBACK_BASE_URL=${{ vars.GUEST_FEEDBACK_BASE_URL }}
        HOUSEKEEPING_INTERNAL_URL=${{ vars.HOUSEKEEPING_INTERNAL_URL || 'http://housekeeping:4070' }}
        JWT_SECRET=${{ secrets.JWT_SECRET }}
        ADMIN_PASSCODE_HASH='${{ secrets.ADMIN_PASSCODE_HASH }}'
        LINE_CHANNEL_ID=${{ secrets.LINE_CHANNEL_ID }}
        LINE_CHANNEL_SECRET=${{ secrets.LINE_CHANNEL_SECRET }}
        LINE_CALLBACK_URL=${{ secrets.LINE_CALLBACK_URL }}
        ZK_SYNC_SLACK_WEBHOOK_URL=${{ secrets.ZK_SYNC_SLACK_WEBHOOK_URL }}
        HFID_SIGNING_KEY=${{ secrets.HFID_SIGNING_KEY }}
        HFID_CLIENT_ID=${{ secrets.HFID_CLIENT_ID }}
        HFID_CLIENT_SECRET=${{ secrets.HFID_CLIENT_SECRET }}
        READER_SECRET=${{ secrets.READER_SECRET }}
        READER_RESOLVE_SECRET=${{ secrets.READER_RESOLVE_SECRET }}
        STAFF_OA_CHANNEL_ACCESS_TOKEN=${{ secrets.STAFF_OA_CHANNEL_ACCESS_TOKEN }}
        STAFF_OA_CHANNEL_SECRET=${{ secrets.STAFF_OA_CHANNEL_SECRET }}
        GUEST_FEEDBACK_READER_SECRET=${{ secrets.GUEST_FEEDBACK_READER_SECRET }}
        HOUSEKEEPING_STAFF_BOT_TOKEN=${{ secrets.HOUSEKEEPING_STAFF_BOT_TOKEN }}
        PORTAL_DIRECTORY_TOKEN=${{ secrets.PORTAL_DIRECTORY_TOKEN }}


  verify_deployment:
    name: Verify deployed run and backup
    needs: [deploy]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Require the new release to be serving with a verified snapshot
        env:
          EXPECTED_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Existing public LINE webhook URL, GET only. POST still requires
          # LINE's signature. Do not follow redirects: an Access login page
          # or an older healthy container must never count as success.
          url="https://erp.thehfhotel.org/api/public/staff-oa/webhook?run_id=${EXPECTED_RUN}&commit=${EXPECTED_COMMIT}"
          for attempt in $(seq 1 90); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --connect-timeout 5 --max-time 10 --proto '=https' "$url") || status=000
            if [ "$status" = 204 ]; then
              echo 'Verified deployment run and pre-migration database snapshot.'
              echo '## Deployment and host-local database backup verified' >> "$GITHUB_STEP_SUMMARY"
              echo "Run: ${EXPECTED_RUN}; commit: ${EXPECTED_COMMIT}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo '::error::New release/backup not verified. Deployment is NOT confirmed healthy. Do not auto-restore the database.'
          exit 1
