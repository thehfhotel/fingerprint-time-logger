name: Build & Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Additional tag to apply (besides "latest" and sha-XXXX)'
        required: false
        type: string

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build & push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
          labels: |
            org.opencontainers.image.title=Fingerprint Time Logger
            org.opencontainers.image.description=ZKTeco biometric device integration
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: fingerprint-logger
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            BUILD_TYPE=production
            CACHEBUST=${{ github.sha }}

      - name: Image summary
        run: |
          echo "## Published image" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tags pushed:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # DEPLOY — runs on the self-hosted `evergreen` runner that lives on the
  # deploy host itself. Same pattern as loyalty-app/.github/workflows/deploy.yml.
  # No SSH keys to manage; the runner already has docker + filesystem access
  # to /home/nut/fingerprint-time-logger, and GITHUB_TOKEN authenticates
  # the GHCR pull for the duration of the job.
  # ===========================================================================
  deploy:
    name: Deploy to production
    runs-on: [self-hosted, deploy]
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    environment:
      name: production
    steps:
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull new image
        working-directory: /home/nut/fingerprint-time-logger
        run: docker compose pull app

      - name: Restart container (down + up to pick up new image)
        working-directory: /home/nut/fingerprint-time-logger
        # `docker compose restart` would keep the old image. We deliberately
        # `down` then `up -d` — same gotcha called out in CLAUDE.md.
        run: |
          docker compose down
          docker compose up -d --remove-orphans

      - name: Wait for healthy startup
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:5000/api/private/devices/health -o /dev/null -w "%{http_code}" | grep -qE "^(200|401|403)$"; then
              echo "App responded after ${i} polls"
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed after 120s — dumping recent logs:"
          cd /home/nut/fingerprint-time-logger
          docker compose logs --tail=80 app
          exit 1

      - name: Verify ZK scheduler started
        working-directory: /home/nut/fingerprint-time-logger
        # The redesign expects to see `Background scheduler started` and at
        # least one `[scheduler.refresh_status]` line within ~30s of boot.
        # Tolerant grep: the message must show up, but a missing line just
        # means the scheduler is slow on this restart — log a warning,
        # don't fail the deploy.
        run: |
          sleep 30
          if docker compose logs --tail=200 app | grep -q "Background scheduler started"; then
            echo "scheduler-start confirmed"
          else
            echo "::warning::Background scheduler start message not seen in last 200 log lines"
          fi
          if docker compose logs --tail=200 app | grep -q "TCP packet invalid"; then
            echo "::error::TCP packet invalid in fresh logs — the redesign should have eliminated this"
            exit 1
          fi
          echo "no TCP packet invalid in fresh logs"
