name: Build & Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Additional tag to apply (besides "latest" and sha-XXXX)'
        required: false
        type: string

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Deploy gate. Runs the full unit + integration suites. Tests that
  # target functionality which no longer exists (e.g. the pre-redesign
  # auto_import_fingerprint_logs loop, nonce replay protection) are
  # marked @pytest.mark.skip with documented reasons. Tests that
  # require a running server (tests/e2e/) and the security suite stay
  # out of this gate.
  test:
    name: Tests (deploy gate)
    runs-on: ubuntu-latest
    # Same throwaway secrets ci.yml uses — needed because strict-prod
    # config validation runs at import time.
    env:
      ENV: test
      TESTING: 'true'
      JWT_SECRET: ci-dummy-jwt-secret-do-not-use-in-prod
      ADMIN_PASSCODE_HASH: $2b$12$ci.dummy.hash.do.not.use.in.production.value.here.placeholder
      CORS_ALLOWED_ORIGINS: http://localhost:5000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc curl sqlite3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock pytest-xdist factory-boy

      - name: Set up test database
        # See ci.yml for rationale — we build the schema directly from the
        # models rather than replaying Alembic, because the migration chain
        # was authored against a pre-existing prod DB.
        run: |
          mkdir -p database
          python -c "from app.core.database import Base, engine; Base.metadata.create_all(bind=engine)"

      - name: Run unit + integration suites (deploy gate)
        # `-m "not slow"` matches ci.yml's integration step. The list of
        # legacy top-level test files is included explicitly because
        # they're outside tests/unit and tests/integration.
        run: |
          pytest -v \
            tests/unit/ \
            tests/integration/ \
            tests/test_api.py \
            tests/test_app_structure.py \
            tests/test_attendance_endpoints.py \
            tests/test_device_endpoints.py \
            tests/test_employee_endpoints.py \
            -m "not slow"

  build:
    name: Build & push to GHCR
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
          labels: |
            org.opencontainers.image.title=Fingerprint Time Logger
            org.opencontainers.image.description=ZKTeco biometric device integration
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: fingerprint-logger
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            BUILD_TYPE=production
            CACHEBUST=${{ github.sha }}

      - name: Image summary
        run: |
          echo "## Published image" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tags pushed:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # DEPLOY — runs on a GitHub-hosted runner. Mirrors the new-hotel deploy
  # pattern (.github/workflows/docker-build.yml `deploy` job): install
  # cloudflared, SSH to deploy@evergreen.thehfhotel.org via the asgard
  # tunnel using a forced-command key (authorized_keys pins
  # /srv/run-deploy-fingerprint.sh), pipe a JSON payload over stdin with
  # env vars + secrets + the short-lived GHCR token.
  #
  # GitHub-hosted (not self-hosted) so CI doesn't share a host with prod,
  # and the deploy script — not the workflow — is the only thing that runs
  # on the deploy host. Documented evergreen-side: the SSH key only triggers
  # the pinned script, so a compromised workflow can't run arbitrary
  # commands on the host.
  # ===========================================================================
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: read
    environment:
      name: production
    concurrency:
      group: deploy-prod-evergreen-fingerprint
      cancel-in-progress: false
    steps:
      - name: Cache cloudflared binary
        id: cf-cache
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/cloudflared
          # Pin to a specific release so the cache key is stable. Bump in
          # lockstep with the install URL below.
          key: cloudflared-2026.3.0-linux-amd64

      - name: Install cloudflared
        if: steps.cf-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/download/2026.3.0/cloudflared-linux-amd64 \
            -o /tmp/cloudflared
          sudo install -m 755 /tmp/cloudflared /usr/local/bin/cloudflared

      - name: Install SSH key + known_hosts
        env:
          SSH_KEY:  ${{ secrets.EVERGREEN_DEPLOY_SSH_KEY }}
          HOST_KEY: ${{ secrets.EVERGREEN_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY"  > ~/.ssh/deploy_key  && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts

      - name: Deploy via SSH to evergreen
        env:
          GHCR_USER:                    ${{ github.actor }}
          GHCR_TOKEN:                   ${{ secrets.GITHUB_TOKEN }}
          # Non-secret app config (env)
          CORS_ALLOWED_ORIGINS:         ${{ secrets.CORS_ALLOWED_ORIGINS }}
          AUTO_IMPORT_INTERVAL_MINUTES: ${{ vars.AUTO_IMPORT_INTERVAL_MINUTES || '30' }}
          ZK_DRIFT_TOLERANCE_SECONDS:   ${{ vars.ZK_DRIFT_TOLERANCE_SECONDS || '5' }}
          ZK_STARTUP_RETRY_MINUTES:     ${{ vars.ZK_STARTUP_RETRY_MINUTES || '3' }}
          # Secrets (delivered via the .secrets block — written to the same
          # .env file but grouped for documentation. Switch to file-mounted
          # secrets later if needed.)
          JWT_SECRET:                   ${{ secrets.JWT_SECRET }}
          ADMIN_PASSCODE_HASH:          ${{ secrets.ADMIN_PASSCODE_HASH }}
          LINE_CHANNEL_ID:              ${{ secrets.LINE_CHANNEL_ID }}
          LINE_CHANNEL_SECRET:          ${{ secrets.LINE_CHANNEL_SECRET }}
          LINE_CALLBACK_URL:            ${{ secrets.LINE_CALLBACK_URL }}
          ZK_SYNC_SLACK_WEBHOOK_URL:    ${{ secrets.ZK_SYNC_SLACK_WEBHOOK_URL }}
        # Payload shape consumed by /srv/run-deploy-fingerprint.sh on
        # evergreen. The script unpacks, writes .env, docker compose pull
        # + down + up -d, health-checks, and verifies the scheduler logs.
        run: |
          set -euo pipefail
          jq -n \
            --arg commit_sha             "$GITHUB_SHA" \
            --arg ghcr_user              "$GHCR_USER" \
            --arg ghcr_token             "$GHCR_TOKEN" \
            --arg CORS_ALLOWED_ORIGINS   "$CORS_ALLOWED_ORIGINS" \
            --arg AUTO_IMPORT_INTERVAL_MINUTES "$AUTO_IMPORT_INTERVAL_MINUTES" \
            --arg ZK_DRIFT_TOLERANCE_SECONDS   "$ZK_DRIFT_TOLERANCE_SECONDS" \
            --arg ZK_STARTUP_RETRY_MINUTES     "$ZK_STARTUP_RETRY_MINUTES" \
            --arg JWT_SECRET             "$JWT_SECRET" \
            --arg ADMIN_PASSCODE_HASH    "$ADMIN_PASSCODE_HASH" \
            --arg LINE_CHANNEL_ID        "$LINE_CHANNEL_ID" \
            --arg LINE_CHANNEL_SECRET    "$LINE_CHANNEL_SECRET" \
            --arg LINE_CALLBACK_URL      "$LINE_CALLBACK_URL" \
            --arg ZK_SYNC_SLACK_WEBHOOK_URL "$ZK_SYNC_SLACK_WEBHOOK_URL" \
            '{
              commit_sha: $commit_sha,
              ghcr: { user: $ghcr_user, token: $ghcr_token },
              env: {
                CORS_ALLOWED_ORIGINS:         $CORS_ALLOWED_ORIGINS,
                AUTO_IMPORT_INTERVAL_MINUTES: $AUTO_IMPORT_INTERVAL_MINUTES,
                ZK_DRIFT_TOLERANCE_SECONDS:   $ZK_DRIFT_TOLERANCE_SECONDS,
                ZK_STARTUP_RETRY_MINUTES:     $ZK_STARTUP_RETRY_MINUTES,
              },
              secrets: {
                JWT_SECRET:                $JWT_SECRET,
                ADMIN_PASSCODE_HASH:       $ADMIN_PASSCODE_HASH,
                LINE_CHANNEL_ID:           $LINE_CHANNEL_ID,
                LINE_CHANNEL_SECRET:       $LINE_CHANNEL_SECRET,
                LINE_CALLBACK_URL:         $LINE_CALLBACK_URL,
                ZK_SYNC_SLACK_WEBHOOK_URL: $ZK_SYNC_SLACK_WEBHOOK_URL,
              }
            }' \
          | ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o ProxyCommand="cloudflared --edge-ip-version 4 access ssh --hostname %h" \
              deploy@evergreen.thehfhotel.org
