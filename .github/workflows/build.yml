name: Build & Publish

# Production release pipeline. Every change reaches production only through:
# merged-PR provenance -> quality -> full tests -> immutable image build ->
# forced-command deploy -> repository-owned post-deploy operations -> release
# verification. A direct push to main may exist in Git history, but this
# workflow refuses to turn it into a production release.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  provenance:
    name: Require merged PR provenance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Refuse a main SHA that did not arrive through a merged PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" > /tmp/associated-prs.json
          python - <<'PY'
          import json, os, sys
          prs = json.load(open('/tmp/associated-prs.json', encoding='utf-8'))
          valid = [
              pr for pr in prs
              if pr.get('merged_at')
              and (pr.get('base') or {}).get('ref') == 'main'
              and (pr.get('base') or {}).get('repo', {}).get('full_name') == os.environ['GITHUB_REPOSITORY']
          ]
          if not valid:
              print('::error::Production deploy refused: current main SHA is not associated with a PR merged into this repository main branch.')
              sys.exit(1)
          print(f"Merged PR provenance verified: #{valid[0].get('number')}")
          PY

  quality:
    name: Quality & security gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install quality tools
        run: pip install flake8 bandit
      - name: Flake8 blocking errors
        run: flake8 app scripts tests --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Bandit high severity
        run: bandit -r app scripts -ll -ii

  test:
    name: Tests (deploy gate)
    runs-on: ubuntu-latest
    env:
      ENV: test
      TESTING: 'true'
      JWT_SECRET: ci-dummy-jwt-secret-do-not-use-in-prod
      ADMIN_PASSCODE_HASH: $2b$12$ci.dummy.hash.do.not.use.in.production.value.here.placeholder
      CORS_ALLOWED_ORIGINS: http://localhost:5000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc curl sqlite3 fonts-tlwg-loma-otf

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock pytest-xdist factory-boy

      - name: Set up test database
        run: |
          mkdir -p database
          python -c "from app.core.database import Base, engine; Base.metadata.create_all(bind=engine)"

      - name: Verify deploy and post-deploy failure paths
        run: |
          pytest tests/unit/test_deploy_backup.py tests/unit/test_post_deploy.py -v

      - name: Run unit + integration suites (deploy gate)
        run: |
          pytest -v \
            tests/unit/ \
            tests/integration/ \
            tests/test_api.py \
            tests/test_app_structure.py \
            tests/test_v2_routes.py \
            tests/test_attendance_endpoints.py \
            tests/test_device_endpoints.py \
            tests/test_employee_endpoints.py \
            -m "not slow"

  deploy:
    # LOAD-BEARING: test, quality and merged-PR provenance must all be green.
    # Historical contract was `needs: [test]`; test remains a hard dependency,
    # with provenance and quality added rather than replacing it.
    needs: [provenance, quality, test]
    name: Deploy (backup before migrations)
    if: github.ref == 'refs/heads/main'
    uses: thehfhotel/estate-ci/.github/workflows/deploy-evergreen.yml@571d115d63ecef9c30cd73f73a38e68395ab259f
    permissions:
      contents: read
      packages: write
    with:
      app_name: fingerprint
      image: ghcr.io/thehfhotel/fingerprint-time-logger
      host_port: "5000"
    secrets:
      ssh_key: ${{ secrets.EVERGREEN_DEPLOY_SSH_KEY }}
      host_key: ${{ secrets.EVERGREEN_HOST_KEY }}
      env_payload: |
        DATABASE_URL=sqlite:///./database/attendance.db
        HF_DEPLOY_RUN=${{ github.run_id }}-${{ github.run_attempt }}
        HF_DEPLOY_COMMIT=${{ github.sha }}
        HF_POST_DEPLOY_REQUIRED=true
        HF_POST_DEPLOY_READY_TIMEOUT_SECONDS=${{ vars.HF_POST_DEPLOY_READY_TIMEOUT_SECONDS || '240' }}
        ENV=production
        BEHIND_PROXY=true
        ZKTECO_HOST=192.168.100.209
        ZKTECO_PORT=4370
        CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}
        AUTO_IMPORT_INTERVAL_MINUTES=${{ vars.AUTO_IMPORT_INTERVAL_MINUTES || '30' }}
        ZK_DRIFT_TOLERANCE_SECONDS=${{ vars.ZK_DRIFT_TOLERANCE_SECONDS || '5' }}
        ZK_STARTUP_RETRY_MINUTES=${{ vars.ZK_STARTUP_RETRY_MINUTES || '3' }}
        ZK_CATCHUP_LOOKBACK_HOURS=${{ vars.ZK_CATCHUP_LOOKBACK_HOURS || '48' }}
        ZK_EXPECTED_UTC_OFFSET_MINUTES=${{ vars.ZK_EXPECTED_UTC_OFFSET_MINUTES || '420' }}
        PORTAL_DIRECTORY_URL=${{ vars.PORTAL_DIRECTORY_URL || 'http://hf-erp-portal:3000/portal-api/directory/managers' }}
        GUEST_FEEDBACK_BASE_URL=${{ vars.GUEST_FEEDBACK_BASE_URL }}
        HOUSEKEEPING_INTERNAL_URL=${{ vars.HOUSEKEEPING_INTERNAL_URL || 'http://housekeeping:4070' }}
        STAFF_LEAVE_AUTO_APPROVE=${{ vars.STAFF_LEAVE_AUTO_APPROVE || 'true' }}
        JWT_SECRET=${{ secrets.JWT_SECRET }}
        ADMIN_PASSCODE_HASH='${{ secrets.ADMIN_PASSCODE_HASH }}'
        LINE_CHANNEL_ID=${{ secrets.LINE_CHANNEL_ID }}
        LINE_CHANNEL_SECRET=${{ secrets.LINE_CHANNEL_SECRET }}
        LINE_CALLBACK_URL=${{ secrets.LINE_CALLBACK_URL }}
        ZK_SYNC_SLACK_WEBHOOK_URL=${{ secrets.ZK_SYNC_SLACK_WEBHOOK_URL }}
        HFID_SIGNING_KEY=${{ secrets.HFID_SIGNING_KEY }}
        HFID_CLIENT_ID=${{ secrets.HFID_CLIENT_ID }}
        HFID_CLIENT_SECRET=${{ secrets.HFID_CLIENT_SECRET }}
        READER_SECRET=${{ secrets.READER_SECRET }}
        READER_RESOLVE_SECRET=${{ secrets.READER_RESOLVE_SECRET }}
        STAFF_OA_CHANNEL_ACCESS_TOKEN=${{ secrets.STAFF_OA_CHANNEL_ACCESS_TOKEN }}
        STAFF_OA_CHANNEL_SECRET=${{ secrets.STAFF_OA_CHANNEL_SECRET }}
        GUEST_FEEDBACK_READER_SECRET=${{ secrets.GUEST_FEEDBACK_READER_SECRET }}
        HOUSEKEEPING_STAFF_BOT_TOKEN=${{ secrets.HOUSEKEEPING_STAFF_BOT_TOKEN }}
        PORTAL_DIRECTORY_TOKEN=${{ secrets.PORTAL_DIRECTORY_TOKEN }}

  verify_deployment:
    name: Verify release + backup + post-deploy
    needs: [deploy]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Require exact release, verified snapshot and completed operations
        env:
          EXPECTED_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Existing public LINE webhook URL, GET only. POST still requires
          # LINE's signature. 204 now means all three conditions are true:
          # exact image/run, verified pre-migration snapshot, and successful
          # repository-owned post-deploy tasks (including rich-menu sync).
          url="https://erp.thehfhotel.org/api/public/staff-oa/webhook?run_id=${EXPECTED_RUN}&commit=${EXPECTED_COMMIT}"
          for attempt in $(seq 1 90); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --connect-timeout 5 --max-time 10 --proto '=https' "$url") || status=000
            if [ "$status" = 204 ]; then
              echo 'Verified release, pre-migration snapshot, and post-deploy operations.'
              echo '## Production release fully verified' >> "$GITHUB_STEP_SUMMARY"
              echo "Run: ${EXPECTED_RUN}; commit: ${EXPECTED_COMMIT}" >> "$GITHUB_STEP_SUMMARY"
              echo 'Staff LINE OA rich-menu reconciliation: complete' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo '::error::Release is not fully verified. Backup, serving SHA, or post-deploy operations did not complete.'
          exit 1
