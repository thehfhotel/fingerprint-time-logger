name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ENV: test
  TESTING: 'true'
  JWT_SECRET: ci-dummy-jwt-secret-do-not-use-in-prod
  ADMIN_PASSCODE_HASH: $2b$12$ci.dummy.hash.do.not.use.in.production.value.here.placeholder
  CORS_ALLOWED_ORIGINS: http://localhost:5000

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install flake8
      - name: Flake8 (errors only)
        run: flake8 app scripts tests --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Flake8 (informational)
        continue-on-error: true
        run: flake8 app scripts tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  test:
    name: Tests (unit + integration)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc curl sqlite3 fonts-tlwg-loma-otf

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock pytest-cov pytest-xdist factory-boy

      - name: Set up test database
        run: |
          mkdir -p database
          python -c "from app.core.database import Base, engine; Base.metadata.create_all(bind=engine)"

      - name: Run unit tests
        run: pytest tests/unit/ -v --cov=app --cov-report=xml --cov-report=term-missing

      - name: Run integration tests
        run: pytest tests/integration/ -v --cov=app --cov-append --cov-report=xml -m "not slow"

      - name: Run v2 route tests
        run: pytest tests/test_v2_routes.py -v --cov=app --cov-append --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  security:
    name: Security scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install bandit
      - name: Bandit (high severity blocks)
        run: bandit -r app scripts -ll -ii
